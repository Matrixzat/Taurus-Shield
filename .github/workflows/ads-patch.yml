name: Ads Patch

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID containing the APK'
        required: true
      job_id:
        description: 'Job identifier for artifact naming'
        required: true
      patch_level:
        description: 'Patch level (basic/low/mid/advance/all)'
        required: true
        default: 'advance'
      sign_apk:
        description: 'Sign the rebuilt APK'
        required: false
        default: 'true'

jobs:
  patch:
    name: Ads Patch (${{ inputs.patch_level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download input APK from release
        run: |
          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.apk
          echo "Input size: $(du -sh input.apk)"

      - name: Download APKTool
        run: |
          curl -fsSL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar
          echo "APKTool ready"

      - name: Decompile APK
        run: |
          java -Xmx5g -jar apktool.jar d input.apk -o decompiled -f
          echo "Decompile complete — $(find decompiled/smali* -name '*.smali' 2>/dev/null | wc -l) smali files"

      - name: Fetch and run patch engine
        run: |
          curl -fsSL \
            "https://taurus-shield.matrixzat99.workers.dev/patch-script" \
            -H "X-Job-Id: ${{ inputs.job_id }}" \
            -o patch.js
          PATCH_LEVEL="${{ inputs.patch_level }}" node patch.js decompiled/

      - name: Recompile APK (multi-strategy)
        run: |
          mkdir -p output
          BUILD_OK=false
          for STRAT in "--use-aapt2" "" "--use-aapt2 --keep-broken-res" "--keep-broken-res"; do
            echo "Trying: java -jar apktool.jar b decompiled -o output/patched.apk $STRAT"
            if java -Xmx5g -jar apktool.jar b decompiled -o output/patched.apk $STRAT; then
              BUILD_OK=true
              echo "Build succeeded with: $STRAT"
              break
            fi
            echo "Strategy failed, trying next..."
          done

          if [ "$BUILD_OK" = false ]; then
            echo "All resource builds failed — trying smali-only mode"
            java -Xmx5g -jar apktool.jar d input.apk -o smali_only -r -f
            PATCH_LEVEL="${{ inputs.patch_level }}" node patch.js smali_only/
            java -Xmx5g -jar apktool.jar b smali_only -o output/patched.apk
          fi

      - name: Sign APK
        if: inputs.sign_apk == 'true'
        run: |
          if [ ! -f output/patched.apk ]; then
            echo "ERROR: patched.apk not found"; exit 1
          fi
          curl -fsSL \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" \
            -o signer.jar
          java -jar signer.jar --apks output/patched.apk --out output/ --allowResign
          SIGNED=$(find output/ -name "*aligned-debugSigned*.apk" | head -1)
          if [ -n "$SIGNED" ]; then
            mv "$SIGNED" output/out.apk
            rm -f output/patched.apk
          else
            mv output/patched.apk output/out.apk
          fi
          echo "Signed APK: $(du -sh output/out.apk)"

      - name: Rename unsigned APK
        if: inputs.sign_apk != 'true'
        run: mv output/patched.apk output/out.apk

      - name: Delete input asset from release
        if: always()
        run: |
          curl -fsSL -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-patch-${{ inputs.job_id }}
          path: output/out.apk
          retention-days: 1

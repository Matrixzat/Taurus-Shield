name: Cocos2d-x Cloud Analyser

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the slim ZIP (from analyze-queue release)'
        required: true
      job_id:
        description: 'Tracking ID — used to name the output artifact'
        required: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo (fetch cocos_analyzer.py)
        uses: actions/checkout@v4

      - name: Download input file
        run: |
          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          echo "Downloaded: $(du -sh input.zip)"

      - name: Run Cocos2d-x full analyser
        run: |
          python3 - <<'PYEOF'
          import sys, json, os, zipfile

          # ── Wire in the real engine (absolute path, works with stdin mode) ────
          _engine_dir = os.path.join(os.getcwd(), "android", "app", "src", "main", "python")
          if _engine_dir not in sys.path:
              sys.path.insert(0, _engine_dir)
          import cocos_analyzer as ca

          # Override _log so every log line prints to the Actions console
          def _cloud_log(msg):
              print(msg, flush=True)
              ca._log_lines.append(str(msg))
          ca._log = _cloud_log

          os.makedirs("output",     exist_ok=True)
          os.makedirs("game_files", exist_ok=True)

          # ── 1. Extract slim ZIP ───────────────────────────────────────────────
          meta = {}
          with zipfile.ZipFile("input.zip") as z:
              names = z.namelist()
              print(f"ZIP entries ({len(names)}): {names}")
              if "_meta.json" in names:
                  meta = json.loads(z.read("_meta.json"))
                  print(f"Meta: {meta}")
              for n in names:
                  if n == "_meta.json" or n.endswith("/"):
                      continue
                  data = z.read(n)
                  dest = os.path.join("game_files", n)
                  os.makedirs(os.path.dirname(dest) if os.path.dirname(dest) else ".", exist_ok=True)
                  with open(dest, "wb") as f:
                      f.write(data)

          so_path = "game_files/libcocos2dcpp.so"
          if not os.path.exists(so_path):
              print("ERROR: libcocos2dcpp.so not in slim ZIP")
              sys.exit(1)

          with open(so_path, "rb") as f:
              so_data = f.read()
          print(f"\nlibcocos2dcpp.so: {len(so_data)//1_048_576} MB")

          # ── 2. Detect game type from meta hint / script presence ──────────────
          hint = meta.get("game_type_hint", "native")
          game_type = hint if hint in ("lua", "js", "native") else "native"
          print(f"Game type: {game_type.upper()}")

          # ── 3a. NATIVE — full ELF engine ──────────────────────────────────────
          if game_type == "native":
              print("\n=== Pass 1+2: SHT_SYMTAB + SHT_DYNSYM ===")
              symbols = ca._parse_elf_symbols(so_data)
              print(f"Symbols recovered: {len(symbols)}")

              print("\n=== String scan ===")
              strings = ca._scan_strings(so_data)
              print(f"Strings found: {len(strings)}")

              interesting = ca._score_symbols_and_strings(symbols, strings)

              # Build result
              result = {
                  "game_type": "native",
                  "game":      meta.get("game", ""),
                  "symbols":   symbols,
                  "strings":   strings[:5000],   # cap for JSON size
                  "interesting": interesting,
              }

              # ── dump.cpp ──────────────────────────────────────────────────────
              _, n_classes = ca._generate_cpp_dump(symbols, strings, "output")
              print(f"\ndump.cpp: {n_classes} classes written")

              # ── symbols.txt ───────────────────────────────────────────────────
              with open("output/symbols.txt", "w", encoding="utf-8") as f:
                  f.write("// Taurus Shield — Cocos2d-x Symbol Dump\n")
                  f.write(f"// Symbols : {len(symbols)}\n\n")
                  f.write(f"{'Offset':<14}  {'Type':<10}  {'Size':<8}  Name\n")
                  f.write("-" * 80 + "\n")
                  for s in symbols:
                      f.write(f"{s.get('offset','0x0'):<14}  {s.get('type','NOTYPE'):<10}  "
                              f"{str(s.get('size',0)):<8}  {s.get('name','')}\n")

              # ── strings.txt (top 10 000 by score) ────────────────────────────
              with open("output/strings.txt", "w", encoding="utf-8") as f:
                  f.write("// Taurus Shield — Cocos2d-x String Scan\n")
                  f.write(f"// Strings : {len(strings)}\n\n")
                  for s in strings[:10000]:
                      f.write(f"{s.get('offset','0x0'):<14}  score={s.get('score',0):<3}  "
                              f"{s.get('value','')}\n")

              # ── interesting.txt ───────────────────────────────────────────────
              with open("output/interesting.txt", "w", encoding="utf-8") as f:
                  f.write("// Taurus Shield — Top Patchable Items\n")
                  f.write(f"// Items  : {len(interesting)}\n\n")
                  for item in interesting:
                      f.write(f"[score={item.get('score',0):<3}]  "
                              f"{item.get('name',''):<60}  "
                              f"@ {item.get('offset','')}\n")

          # ── 3b. Lua / JS — script value scan (slim ZIP carries scripts) ───────
          else:
              script_files = []
              for root, _, files in os.walk("game_files"):
                  for fn in files:
                      fp = os.path.join(root, fn)
                      rel = os.path.relpath(fp, "game_files")
                      if any(fn.endswith(ext) for ext in (".lua", ".luac", ".js", ".jsc", ".js.enc")):
                          with open(fp, "rb") as f:
                              script_files.append((rel, f.read()))

              import re
              values = []
              KEYWORDS = {
                  "coin":9,"gold":9,"gem":9,"diamond":9,"cash":8,"money":8,
                  "health":8,"hp":8,"life":8,"lives":7,"heart":7,"energy":7,
                  "unlock":8,"premium":8,"vip":7,"purchase":8,"buy":7,
                  "speed":7,"damage":6,"score":7,"point":6,"reward":7,
                  "maxhp":9,"maxhealth":9,"infinite":10,"unlimited":10,
                  "invincib":10,"godmode":10,"revive":8,"cheat":10,"hack":10,
              }
              def score(name):
                  low = name.lower()
                  return sum(p for k, p in KEYWORDS.items() if k in low)

              for rel_path, raw in script_files:
                  try:
                      text = raw.decode("utf-8", errors="replace")
                  except Exception:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      stripped = line.strip()
                      if stripped.startswith(("--", "//", "#")):
                          continue
                      m = re.match(
                          r'^(?:local\s+)?([\w.:\[\]"\']+)\s*=\s*'
                          r'(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)\s*(?:--.*|//.*)?$', stripped)
                      if m:
                          values.append({"file": rel_path, "var": m.group(1),
                                         "value": m.group(2), "line": lineno,
                                         "score": score(m.group(1)), "is_bool": False,
                                         "find_str": stripped})
                          continue
                      mb = re.match(
                          r'^(?:local\s+)?([\w.:\[\]"\']+)\s*=\s*(true|false)\s*(?:--.*|//.*)?$',
                          stripped, re.IGNORECASE)
                      if mb:
                          values.append({"file": rel_path, "var": mb.group(1),
                                         "value": mb.group(2).lower(), "line": lineno,
                                         "score": score(mb.group(1)), "is_bool": True,
                                         "find_str": stripped})

              values.sort(key=lambda x: -x["score"])
              result = {"game_type": game_type, "game": meta.get("game", ""),
                        "interesting": values}
              print(f"Script values: {len(values)}")
              interesting = values
              symbols = []

          # ── 4. Write cocos_analysis.json ──────────────────────────────────────
          out_path = "output/cocos_analysis.json"
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          scored = sum(1 for x in interesting if x.get("score", 0) > 0)
          print(f"\ncocos_analysis.json: {os.path.getsize(out_path)//1024} KB")
          print(f"Output files: {sorted(os.listdir('output'))}")
          if symbols:
              print(f"\nTop 20 scored symbols:")
              for s in [x for x in symbols if x.get('score',0)>0][:20]:
                  print(f"  score={s['score']:>3}  {s['offset']}  {s['name']}")
          PYEOF

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocos-dump-${{ inputs.job_id }}
          path: output/
          retention-days: 7

      - name: Delete input asset
        if: success() || failure()
        run: |
          curl -s -L -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Input asset deleted"

      - name: Summary
        run: |
          echo "## Cocos2d-x Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID:** ${{ inputs.job_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** cocos-dump-${{ inputs.job_id }} (7-day retention)" >> $GITHUB_STEP_SUMMARY
          if [ -f output/dump.cpp ]; then
            CLASSES=$(grep -c "^class " output/dump.cpp 2>/dev/null || echo 0)
            echo "- **dump.cpp:** $CLASSES classes" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/symbols.txt ]; then
            echo "- **symbols.txt:** $(wc -l < output/symbols.txt) lines" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/cocos_analysis.json ]; then
            echo "- **cocos_analysis.json:** $(du -sh output/cocos_analysis.json | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi

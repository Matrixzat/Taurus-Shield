name: Cocos2d-x Cloud Analyser

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the slim ZIP (from analyze-queue release)'
        required: true
      job_id:
        description: 'Tracking ID — used to name the output artifact'
        required: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download input file
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          echo "Downloaded: $(du -sh input.zip)"

      - name: Extract slim ZIP
        run: |
          python3 - <<'EOF'
          import zipfile, os, sys, json

          os.makedirs("output",     exist_ok=True)
          os.makedirs("game_files", exist_ok=True)

          meta = {}
          with zipfile.ZipFile("input.zip") as z:
              names = z.namelist()
              print(f"ZIP entries ({len(names)}): {names}")
              if "_meta.json" in names:
                  meta = json.loads(z.read("_meta.json"))
                  print(f"Meta: {meta}")
              for n in names:
                  if n == "_meta.json" or n.endswith("/"):
                      continue
                  data = z.read(n)
                  dest = os.path.join("game_files", n)
                  parent = os.path.dirname(dest)
                  if parent:
                      os.makedirs(parent, exist_ok=True)
                  with open(dest, "wb") as f:
                      f.write(data)

          with open("game_files/_meta.json", "w") as f:
              json.dump(meta, f)

          so_path = "game_files/libcocos2dcpp.so"
          if not os.path.exists(so_path):
              print("ERROR: libcocos2dcpp.so not found in ZIP")
              sys.exit(1)

          sz = os.path.getsize(so_path)
          print(f"libcocos2dcpp.so: {sz // 1048576} MB")

          hint = meta.get("game_type_hint", "native")
          game_type = hint if hint in ("lua", "js", "native") else "native"
          print(f"Game type: {game_type.upper()}")
          with open("game_files/_type.txt", "w") as f:
              f.write(game_type)
          print("Extraction complete")
          EOF

      - name: Parse ELF symbols + string scan
        run: |
          python3 - <<'EOF'
          import os, sys, json, struct

          game_type = open("game_files/_type.txt").read().strip()
          if game_type != "native":
              print(f"Game type is {game_type} — skipping ELF step")
              with open("output/symbols.json", "w") as f:
                  json.dump([], f)
              sys.exit(0)

          print("Reading libcocos2dcpp.so …")
          with open("game_files/libcocos2dcpp.so", "rb") as f:
              data = f.read()
          print(f"Size: {len(data) // 1048576} MB")

          # ── ELF header ──────────────────────────────────────────────────────────
          if len(data) < 64 or data[:4] != b"\x7fELF":
              print("ERROR: not a valid ELF file")
              sys.exit(1)
          endian = "<" if data[5] == 1 else ">"
          is64   = (data[4] == 2)
          print(f"ELF: {'64-bit' if is64 else '32-bit'}  endian={'LE' if endian=='<' else 'BE'}")

          # ── Section headers ──────────────────────────────────────────────────────
          if is64:
              e_shoff     = struct.unpack_from(f"{endian}Q", data, 40)[0]
              e_shentsize = struct.unpack_from(f"{endian}H", data, 58)[0]
              e_shnum     = struct.unpack_from(f"{endian}H", data, 60)[0]
              e_shstrndx  = struct.unpack_from(f"{endian}H", data, 62)[0]
          else:
              e_shoff     = struct.unpack_from(f"{endian}I", data, 32)[0]
              e_shentsize = struct.unpack_from(f"{endian}H", data, 46)[0]
              e_shnum     = struct.unpack_from(f"{endian}H", data, 48)[0]
              e_shstrndx  = struct.unpack_from(f"{endian}H", data, 50)[0]

          sections = []
          shstrtab = b""
          if e_shoff and e_shentsize and e_shnum and e_shstrndx < e_shnum:
              sstr_off_raw = e_shoff + e_shstrndx * e_shentsize
              try:
                  if is64:
                      _, _, _, _, so, ss, _, _, _, _ = struct.unpack_from(f"{endian}IIQQQQIIQQ", data, sstr_off_raw)
                  else:
                      _, _, _, _, so, ss, _, _, _, _ = struct.unpack_from(f"{endian}IIIIIIIIII", data, sstr_off_raw)
                  shstrtab = data[so:so + ss]
              except Exception:
                  pass
              for i in range(min(e_shnum, 512)):
                  off = e_shoff + i * e_shentsize
                  if off + e_shentsize > len(data):
                      break
                  try:
                      if is64:
                          ni, sh_type, _, _, sh_off, sh_sz, sh_link, _, _, _ = struct.unpack_from(f"{endian}IIQQQQIIQQ", data, off)
                      else:
                          ni, sh_type, _, _, sh_off, sh_sz, sh_link, _, _, _ = struct.unpack_from(f"{endian}IIIIIIIIII", data, off)
                      end  = shstrtab.find(b"\x00", ni)
                      name = shstrtab[ni:end].decode("utf-8", errors="replace") if end >= ni else ""
                      sections.append({"name": name, "type": sh_type, "off": sh_off, "sz": sh_sz, "link": sh_link})
                  except struct.error:
                      break

          print(f"Sections: {len(sections)}")

          # ── PT_LOAD segments (for VMA→offset) ───────────────────────────────────
          if is64:
              e_phoff     = struct.unpack_from(f"{endian}Q", data, 32)[0]
              e_phentsize = struct.unpack_from(f"{endian}H", data, 54)[0]
              e_phnum     = struct.unpack_from(f"{endian}H", data, 56)[0]
          else:
              e_phoff     = struct.unpack_from(f"{endian}I", data, 28)[0]
              e_phentsize = struct.unpack_from(f"{endian}H", data, 42)[0]
              e_phnum     = struct.unpack_from(f"{endian}H", data, 44)[0]

          segments = []
          for i in range(min(e_phnum, 96)):
              off = e_phoff + i * e_phentsize
              if off + e_phentsize > len(data):
                  break
              try:
                  if is64:
                      p_type, _ = struct.unpack_from(f"{endian}II", data, off)
                      p_offset, p_vaddr, _, p_filesz = struct.unpack_from(f"{endian}QQQQ", data, off + 8)
                  else:
                      p_type, p_offset, p_vaddr, _, p_filesz = struct.unpack_from(f"{endian}IIIII", data, off)
                  if p_type == 1:
                      segments.append({"offset": p_offset, "vaddr": p_vaddr, "filesz": p_filesz})
              except struct.error:
                  break

          def vma_to_off(vma):
              for seg in segments:
                  if seg["vaddr"] <= vma < seg["vaddr"] + seg["filesz"]:
                      return vma - seg["vaddr"] + seg["offset"]
              return vma

          # ── Read SHT_SYMTAB (type=2) and SHT_DYNSYM (type=11) ───────────────────
          KEYWORDS = {
              "coin":9,"gold":9,"gem":9,"diamond":9,"cash":8,"money":8,
              "health":8,"hp":8,"life":8,"lives":7,"heart":7,"energy":7,
              "unlock":8,"premium":8,"vip":7,"purchase":8,"buy":7,
              "speed":7,"damage":6,"score":7,"point":6,"reward":7,
              "maxhp":9,"maxhealth":9,"infinite":10,"unlimited":10,
              "invincib":10,"godmode":10,"revive":8,"cheat":10,"hack":10,
              "ammo":8,"bullet":7,"weapon":7,"gun":7,"fuel":8,"nitro":8,
              "soldier":6,"jetpack":8,"boost":7,"player":5,"enemy":6,
              "boss":7,"kill":6,"dead":6,"alive":7,"level":5,"stage":5,
          }

          TYPE_MAP = {0:"NOTYPE",1:"OBJECT",2:"FUNC",3:"SECTION",4:"FILE"}

          def read_symtab(sh_type):
              sec = next((s for s in sections if s["type"] == sh_type), None)
              if sec is None or sec["sz"] == 0:
                  return []
              lnk = sec["link"]
              if lnk <= 0 or lnk >= len(sections):
                  return []
              str_sec  = sections[lnk]
              str_data = data[str_sec["off"]: str_sec["off"] + str_sec["sz"]]
              sym_data = data[sec["off"]: sec["off"] + sec["sz"]]
              entsize  = 24 if is64 else 16
              out = []
              for i in range(len(sym_data) // entsize):
                  o = i * entsize
                  if o + entsize > len(sym_data):
                      break
                  try:
                      if is64:
                          st_name, st_info, _, _, st_value, st_size = struct.unpack_from(f"{endian}IBBHQQ", sym_data, o)
                      else:
                          st_name, st_value, st_size, st_info, _, _ = struct.unpack_from(f"{endian}IIIBBH", sym_data, o)
                  except struct.error:
                      break
                  if st_name == 0 or st_value == 0:
                      continue
                  end  = str_data.find(b"\x00", st_name)
                  name = str_data[st_name:end].decode("utf-8", errors="replace") if end >= 0 else ""
                  if name:
                      out.append({"name": name, "addr": st_value, "size": st_size, "stype": st_info & 0xF})
              return out

          raw_syms = []
          s1 = read_symtab(2)
          if s1:
              print(f"SHT_SYMTAB: {len(s1)} entries")
              raw_syms.extend(s1)
          s2 = read_symtab(11)
          if s2:
              print(f"SHT_DYNSYM: {len(s2)} entries")
              raw_syms.extend(s2)

          seen = set()
          symbols = []
          for s in raw_syms:
              name = s.get("name", "")
              if not name or name in seen:
                  continue
              seen.add(name)
              foff  = vma_to_off(s["addr"])
              stype = TYPE_MAP.get(s["stype"], "NOTYPE")
              score = sum(pts for kw, pts in KEYWORDS.items() if kw in name.lower())
              symbols.append({"name": name, "offset": f"0x{foff:x}", "size": s["size"],
                              "type": stype, "score": score})

          symbols.sort(key=lambda x: (-x["score"], x["name"]))
          print(f"Total symbols: {len(symbols)}")

          # ── String scan ──────────────────────────────────────────────────────────
          print("String scan …")
          strings = []
          cur = []; start = 0
          for i, b in enumerate(data):
              if 0x20 <= b <= 0x7E:
                  if not cur:
                      start = i
                  cur.append(chr(b))
              else:
                  s = "".join(cur)
                  if 6 <= len(s) <= 120:
                      sc = sum(pts for kw, pts in KEYWORDS.items() if kw in s.lower())
                      strings.append({"value": s, "offset": f"0x{start:x}", "score": sc})
                  cur = []
          strings.sort(key=lambda x: -x["score"])
          print(f"Strings: {len(strings)}")

          with open("output/symbols.json", "w") as f:
              json.dump(symbols, f)
          with open("output/strings.json", "w") as f:
              json.dump(strings[:5000], f)
          print("Saved symbols.json + strings.json")
          EOF

      - name: Generate output files
        run: |
          python3 - <<'EOF'
          import json, os, re
          from collections import OrderedDict

          symbols = json.load(open("output/symbols.json"))
          strings = json.load(open("output/strings.json"))
          meta    = json.load(open("game_files/_meta.json"))

          # ── Demangler ────────────────────────────────────────────────────────────
          def demangle(mangled):
              if not mangled.startswith("_ZN"):
                  return None, None
              pos = 3; parts = []; n = len(mangled)
              while pos < n:
                  ch = mangled[pos]
                  if ch == 'C' and pos + 1 < n and mangled[pos + 1] in '012':
                      if parts: parts.append(parts[-1])
                      break
                  if ch == 'D' and pos + 1 < n and mangled[pos + 1] in '012':
                      if parts: parts.append('~' + parts[-1])
                      break
                  if ch == 'E':
                      break
                  if ch.isdigit():
                      end = pos
                      while end < n and mangled[end].isdigit():
                          end += 1
                      length = int(mangled[pos:end]); pos = end
                      if pos + length > n:
                          break
                      parts.append(mangled[pos: pos + length]); pos += length; continue
                  break
              if len(parts) < 2:
                  return None, None
              return parts[:-1], parts[-1]

          # ── dump.cpp ──────────────────────────────────────────────────────────────
          classes   = OrderedDict()
          ungrouped = []
          for sym in symbols:
              raw  = sym.get("name", "")
              off  = sym.get("offset", "0x0")
              stype = sym.get("type", "NOTYPE")
              if stype == "NOTYPE":
                  continue
              cls_parts, method = demangle(raw)
              if cls_parts is None:
                  ungrouped.append((off, raw, stype))
                  continue
              cls_name = "::".join(cls_parts)
              classes.setdefault(cls_name, []).append((off, method, stype))

          with open("output/dump.cpp", "w", encoding="utf-8") as f:
              f.write("// Taurus Shield — Cocos2d-x C++ Class Dump\n")
              f.write(f"// Classes : {len(classes)}\n")
              f.write(f"// Symbols : {len(symbols)}\n\n")
              if classes:
                  f.write("// ═══════════════════════════════════\n")
                  f.write("// C++ CLASSES\n")
                  f.write("// ═══════════════════════════════════\n\n")
                  for cls_name, methods in sorted(classes.items()):
                      f.write(f"class {cls_name} {{\n")
                      for off, meth, st in sorted(methods, key=lambda x: x[0]):
                          f.write(f"    // {off:<14}  void {meth}();\n")
                      f.write("};\n\n")
              if ungrouped:
                  f.write("// ── extern / non-class symbols ──────\n")
                  for off, raw, st in ungrouped:
                      f.write(f"// {off:<14}  [{st}]  {raw}\n")
              if not classes and not ungrouped:
                  f.write("// STRIPPED — no symbol table found\n")
                  for s in strings[:100]:
                      f.write(f'// [{s["offset"]}]  "{s["value"]}"\n')

          print(f"dump.cpp: {len(classes)} classes  {len(ungrouped)} extern symbols")

          # ── symbols.txt ───────────────────────────────────────────────────────────
          with open("output/symbols.txt", "w", encoding="utf-8") as f:
              f.write("// Taurus Shield — Cocos2d-x Symbol Dump\n")
              f.write(f"// Symbols : {len(symbols)}\n\n")
              f.write(f"{'Offset':<14}  {'Type':<10}  {'Size':<8}  Name\n")
              f.write("-" * 80 + "\n")
              for s in symbols:
                  f.write(f"{s['offset']:<14}  {s['type']:<10}  {str(s['size']):<8}  {s['name']}\n")

          # ── strings.txt ───────────────────────────────────────────────────────────
          with open("output/strings.txt", "w", encoding="utf-8") as f:
              f.write("// Taurus Shield — String Scan\n")
              f.write(f"// Strings : {len(strings)}\n\n")
              for s in strings:
                  f.write(f"{s['offset']:<14}  score={s['score']:<3}  {s['value']}\n")

          # ── interesting.txt ───────────────────────────────────────────────────────
          interesting = [s for s in symbols if s.get("score", 0) > 0]
          interesting += [{"name": s["value"], "offset": s["offset"],
                           "score": s["score"], "type": "STRING"}
                          for s in strings if s.get("score", 0) > 0]
          interesting.sort(key=lambda x: -x["score"])
          with open("output/interesting.txt", "w", encoding="utf-8") as f:
              f.write("// Taurus Shield — Top Patchable Items\n")
              f.write(f"// Items : {len(interesting)}\n\n")
              for item in interesting:
                  f.write(f"[score={item['score']:<3}]  {item['name']:<60}  @ {item['offset']}\n")

          # ── cocos_analysis.json ───────────────────────────────────────────────────
          result = {
              "game_type": "native",
              "game":      meta.get("game", ""),
              "symbols":   symbols,
              "strings":   strings,
              "interesting": interesting,
          }
          with open("output/cocos_analysis.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          print(f"Output files: {sorted(os.listdir('output'))}")
          sz = os.path.getsize("output/cocos_analysis.json") // 1024
          print(f"cocos_analysis.json: {sz} KB")
          if interesting:
              print(f"\nTop 15 patchable items:")
              for item in interesting[:15]:
                  print(f"  score={item['score']:>3}  {item['offset']}  {item['name'][:60]}")
          EOF

      - name: Handle Lua / JS games
        run: |
          python3 - <<'EOF'
          import json, os, re

          game_type = open("game_files/_type.txt").read().strip()
          if game_type == "native":
              print("Native game — Lua/JS step skipped")
              exit(0)

          print(f"Script game type: {game_type.upper()}")
          KEYWORDS = {
              "coin":9,"gold":9,"gem":9,"diamond":9,"cash":8,"money":8,
              "health":8,"hp":8,"life":8,"lives":7,"heart":7,"energy":7,
              "unlock":8,"premium":8,"vip":7,"purchase":8,"buy":7,
              "speed":7,"damage":6,"score":7,"point":6,"reward":7,
              "infinite":10,"unlimited":10,"invincib":10,"godmode":10,
              "revive":8,"cheat":10,"hack":10,
          }
          def score(name):
              return sum(p for k, p in KEYWORDS.items() if k in name.lower())

          script_files = []
          for root, _, files in os.walk("game_files"):
              for fn in files:
                  if any(fn.endswith(ext) for ext in (".lua",".luac",".js",".jsc",".js.enc")):
                      fp = os.path.join(root, fn)
                      rel = os.path.relpath(fp, "game_files")
                      with open(fp, "rb") as f:
                          script_files.append((rel, f.read()))

          values = []
          for rel_path, raw in script_files:
              try:
                  text = raw.decode("utf-8", errors="replace")
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith(("--", "//", "#")):
                      continue
                  m = re.match(r'^(?:local\s+)?([\w.:]+)\s*=\s*(-?\d+(?:\.\d+)?)\s*(?:--.*|//.*)?$', stripped)
                  if m:
                      values.append({"file": rel_path, "var": m.group(1), "value": m.group(2),
                                     "line": lineno, "score": score(m.group(1)),
                                     "is_bool": False, "find_str": stripped})
                      continue
                  mb = re.match(r'^(?:local\s+)?([\w.:]+)\s*=\s*(true|false)\s*(?:--.*|//.*)?$', stripped, re.I)
                  if mb:
                      values.append({"file": rel_path, "var": mb.group(1), "value": mb.group(2).lower(),
                                     "line": lineno, "score": score(mb.group(1)),
                                     "is_bool": True, "find_str": stripped})
          values.sort(key=lambda x: -x["score"])

          meta = json.load(open("game_files/_meta.json"))
          result = {"game_type": game_type, "game": meta.get("game",""), "interesting": values}
          with open("output/cocos_analysis.json", "w") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
          with open("output/interesting.txt", "w") as f:
              f.write(f"// Script values: {len(values)}\n\n")
              for v in values:
                  f.write(f"[score={v['score']:<3}]  {v['var']:<40}  = {v['value']}  ({v['file']}:{v['line']})\n")

          print(f"Script values found: {len(values)}")
          print(f"Output: {sorted(os.listdir('output'))}")
          EOF

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocos-dump-${{ inputs.job_id }}
          path: output/
          retention-days: 7

      - name: Delete input asset
        if: success() || failure()
        run: |
          curl -s -L -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Input asset deleted"

      - name: Summary
        run: |
          echo "## Cocos2d-x Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID:** ${{ inputs.job_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** cocos-dump-${{ inputs.job_id }} (7-day retention)" >> $GITHUB_STEP_SUMMARY
          [ -f output/dump.cpp ] && echo "- **dump.cpp classes:** $(grep -c '^class ' output/dump.cpp 2>/dev/null || echo 0)" >> $GITHUB_STEP_SUMMARY || true
          [ -f output/symbols.txt ] && echo "- **symbols.txt lines:** $(wc -l < output/symbols.txt)" >> $GITHUB_STEP_SUMMARY || true
          [ -f output/cocos_analysis.json ] && echo "- **cocos_analysis.json:** $(du -sh output/cocos_analysis.json | cut -f1)" >> $GITHUB_STEP_SUMMARY || true

name: DPT Shell Protection

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded ZIP (APK + optional rules.txt)'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true
      sign_apk:
        description: 'Whether to sign the output APK with a debug key (true/false)'
        required: false
        default: 'true'

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download uploaded ZIP
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          ls -lh input.zip
          file input.zip

      - name: Delete uploaded asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Upload slot cleaned up"

      - name: Extract APK and optional rules.txt
        run: |
          mkdir -p extracted
          set +e
          unzip -o input.zip -d extracted
          UNZIP_RC=$?
          set -e
          if [ "$UNZIP_RC" -gt 1 ]; then
            echo "ERROR: unzip failed with code $UNZIP_RC — ZIP may be corrupted"
            exit 1
          fi

          echo "=== ZIP contents ==="
          unzip -l input.zip || true

          APK_COUNT=$(find extracted/ -name "*.apk" -type f | wc -l)
          APK_PATH=$(find extracted/ -name "*.apk" -type f | head -1)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No .apk file found in the uploaded ZIP"
            find extracted/ -type f | head -20
            exit 1
          fi
          if [ "$APK_COUNT" -gt 1 ]; then
            echo "ERROR: ZIP must contain exactly one .apk file (found $APK_COUNT)"
            find extracted/ -name "*.apk" -type f
            exit 1
          fi
          echo "Found APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          # rules.txt is optional — if present, pass it to dpt.jar via -r
          RULES_PATH=$(find extracted/ -name "rules.txt" -type f | head -1)
          if [ -n "$RULES_PATH" ]; then
            echo "Found rules.txt: $RULES_PATH"
            echo "=== rules.txt contents ==="
            cat "$RULES_PATH"
            echo "RULES_PATH=$RULES_PATH" >> $GITHUB_ENV
            echo "HAS_RULES=true" >> $GITHUB_ENV
          else
            echo "No rules.txt found — all classes will be protected"
            echo "HAS_RULES=false" >> $GITHUB_ENV
          fi

      - name: Install Java
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk zipalign apksigner wget unzip 2>/dev/null
          echo "java: $(java -version 2>&1 | head -1)"

      - name: Download dpt-shell
        run: |
          # Download the latest dpt-shell release ZIP
          RELEASE_URL=$(curl -s https://api.github.com/repos/luoyesiqiu/dpt-shell/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if a['name'].endswith('.zip')))")
          echo "Downloading dpt-shell from: $RELEASE_URL"
          wget -q -O dpt-shell.zip "$RELEASE_URL"
          unzip -q dpt-shell.zip -d dpt-shell-release
          echo "=== dpt-shell release contents ==="
          find dpt-shell-release/ -type f | head -30

          # Find dpt.jar and its parent directory.
          # dpt.jar requires shell-files/ to be in its working directory,
          # so we MUST run the jar from the folder it lives in.
          DPT_JAR=$(find dpt-shell-release/ -name "dpt.jar" | head -1)
          if [ -z "$DPT_JAR" ]; then
            echo "ERROR: dpt.jar not found in release ZIP"
            exit 1
          fi
          DPT_DIR=$(dirname "$(realpath "$DPT_JAR")")
          echo "Found dpt.jar at: $DPT_JAR  (dir: $DPT_DIR)"
          echo "DPT_DIR=$DPT_DIR" >> $GITHUB_ENV

          # Verify shell-files/ is present next to the jar
          if [ ! -d "$DPT_DIR/shell-files" ]; then
            echo "WARNING: shell-files/ not found next to dpt.jar — listing dir:"
            ls -la "$DPT_DIR/"
          else
            echo "shell-files/ found OK"
            ls "$DPT_DIR/shell-files/" | head -10
          fi

          # Smoke-test the jar from its own directory
          (cd "$DPT_DIR" && java -jar dpt.jar -v)

      - name: Run DPT Shell protection
        run: |
          WS="$GITHUB_WORKSPACE"
          INPUT_APK="$WS/input.apk"
          OUTPUT_DIR="$WS/dpt_output"
          LOG_FILE="$WS/dpt_run.log"

          cp "$WS/$APK_PATH" "$INPUT_APK"
          mkdir -p "$OUTPUT_DIR"

          # Build the command arguments (all paths must be absolute)
          EXTRA_ARGS=""
          if [ "$HAS_RULES" = "true" ]; then
            cp "$WS/$RULES_PATH" "$WS/rules.txt"
            EXTRA_ARGS="-r $WS/rules.txt"
          fi

          # cd into DPT_DIR so shell-files/ is found as a sibling of dpt.jar
          echo "Running dpt.jar from: $DPT_DIR"
          echo "Command: java -jar dpt.jar -f $INPUT_APK -o $OUTPUT_DIR -e x86,x86_64 -x $EXTRA_ARGS"
          (cd "$DPT_DIR" && java -jar dpt.jar \
            -f "$INPUT_APK" \
            -o "$OUTPUT_DIR" \
            -e x86,x86_64 \
            -x \
            $EXTRA_ARGS) 2>&1 | tee "$LOG_FILE"
          exit ${PIPESTATUS[0]}
        timeout-minutes: 20

      - name: Collect output
        run: |
          echo "=== dpt_output contents ==="
          find dpt_output/ -type f | sort

          # Find the protected APK — dpt-shell places it in the output dir
          OUT_APK=$(find dpt_output/ -name "*.apk" -type f | head -1)
          if [ -z "$OUT_APK" ]; then
            echo "ERROR: No protected APK found in dpt_output/"
            exit 1
          fi
          echo "Protected APK: $OUT_APK ($(wc -c < "$OUT_APK") bytes)"
          # Normalise filename to out.apk for consistent artifact handling
          cp "$OUT_APK" dpt_output/out.apk
          echo "OUT_APK=dpt_output/out.apk" >> $GITHUB_ENV

      - name: Sign APK
        if: inputs.sign_apk == 'true'
        run: |
          if [ ! -f dpt_output/out.apk ]; then
            echo "No out.apk to sign — skipping"
            exit 0
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

          echo "Zipaligning APK..."
          zipalign -f 4 dpt_output/out.apk dpt_output/out_aligned.apk

          echo "Signing APK..."
          apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out dpt_output/out_signed.apk \
            dpt_output/out_aligned.apk

          mv dpt_output/out_signed.apk dpt_output/out.apk
          rm -f dpt_output/out_aligned.apk /tmp/release.keystore

          echo "APK signed: $(wc -c < dpt_output/out.apk) bytes"
          apksigner verify dpt_output/out.apk && echo "Signature verified OK" || echo "WARNING: Signature verification failed"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: dptshell-${{ inputs.job_id }}
          path: dpt_output/out.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: dpt_run.log
          retention-days: 1

name: Analyze Flutter App (Blutter)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded arm64-v8a.zip'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Taurus integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download uploaded ZIP
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          ls -lh input.zip

      - name: Delete uploaded asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true

      - name: Extract libapp.so
        run: |
          mkdir -p extracted
          unzip -o input.zip -d extracted

          SO_PATH=$(find extracted/ -name "libapp.so" | grep -i "arm64" | head -1)
          if [ -z "$SO_PATH" ]; then
            SO_PATH=$(find extracted/ -name "libapp.so" | head -1)
          fi
          if [ -z "$SO_PATH" ]; then
            echo "Cannot find libapp.so in the uploaded file"
            find extracted/ -type f | head -20
            exit 1
          fi
          echo "Found: $SO_PATH ($(wc -c < "$SO_PATH") bytes)"

          LIB_DIR=$(cd "$(dirname "$SO_PATH")" && pwd)
          echo "LIB_DIR=$LIB_DIR" >> $GITHUB_ENV

      # ── Only install what is NOT pre-installed on ubuntu-latest ──────────────
      # cmake, ninja-build, clang, build-essential, git, python3-pip are all
      # available by default — no need to install them.
      - name: Install missing system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev libcapstone-dev

      # ── Cache pip packages ────────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-blutter-pyelftools

      - name: Install Python packages
        run: pip3 install pyelftools requests --quiet

      - name: Resolve latest upstream Blutter commit
        id: blutter-sha
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/worawit/blutter.git HEAD | cut -f1)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve upstream HEAD"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Blutter commit: $SHA"

      - name: Checkout exact upstream Blutter
        uses: actions/checkout@v4
        with:
          repository: worawit/blutter
          ref: ${{ steps.blutter-sha.outputs.sha }}
          path: blutter
          persist-credentials: false

      - name: Detect target Dart and record engine provenance
        id: target
        run: python3 scripts/blutter_target.py --lib-dir "$LIB_DIR" --output blutter_output/engine-version.json

      - name: Restore compiled target cache
        id: blutter-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            blutter/bin
            blutter/packages
          key: blutter-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.target.outputs.cache_key }}

      - name: Run blutter analysis
        run: |
          mkdir -p blutter_output
          echo "Analyzing: $LIB_DIR"
          cd blutter
          python3 blutter.py "$LIB_DIR" "$GITHUB_WORKSPACE/blutter_output" 2>&1 | tee "$GITHUB_WORKSPACE/blutter_run.log"
          exit ${PIPESTATUS[0]}
        timeout-minutes: 35

      - name: Save compiled target cache
        if: steps.blutter-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            blutter/bin
            blutter/packages
          key: blutter-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.target.outputs.cache_key }}

      - name: Show output summary
        run: |
          echo "=== Output files ==="
          find blutter_output/ -type f | sort | head -40
          echo "=== Size ==="
          du -sh blutter_output/ 2>/dev/null || echo "(no output)"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-${{ inputs.job_id }}
          path: blutter_output/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: blutter_run.log
          retention-days: 1

name: Analyze Flutter App (Blutter)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded arm64-v8a.zip'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download uploaded ZIP
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          ls -lh input.zip
          file input.zip

      - name: Extract libapp.so
        run: |
          mkdir -p extracted
          unzip -o input.zip -d extracted

          echo "=== ZIP contents (first 30 entries) ==="
          unzip -l input.zip | head -35

          # Find libapp.so — prefer arm64 first
          SO_PATH=$(find extracted/ -name "libapp.so" | grep -i "arm64" | head -1)
          if [ -z "$SO_PATH" ]; then
            SO_PATH=$(find extracted/ -name "libapp.so" | head -1)
          fi
          if [ -z "$SO_PATH" ]; then
            echo "Cannot find libapp.so in the uploaded file"
            exit 1
          fi
          echo "Found: $SO_PATH ($(wc -c < "$SO_PATH") bytes)"

          # Detect input structure and build what blutter expects:
          #   blutter needs a directory that HAS lib/arm64-v8a/libapp.so inside it.
          #
          # Case A — full APK:   extracted/lib/arm64-v8a/libapp.so
          # Case B — arm64 ZIP:  extracted/libapp.so   (or extracted/arm64-v8a/libapp.so)
          #
          SO_DIR_ABS=$(cd "$(dirname "$SO_PATH")" && pwd)
          LIB_DIR_ABS=$(dirname "$SO_DIR_ABS")

          if [[ "$(basename "$SO_DIR_ABS")" == *"arm64"* ]] && \
             [[ "$(basename "$LIB_DIR_ABS")" == "lib" ]]; then
            # Case A: already in lib/arm64-v8a/ → APP_DIR is the parent of lib/
            APP_DIR=$(dirname "$LIB_DIR_ABS")
            echo "Input shape: full APK — APP_DIR=$APP_DIR"
          else
            # Case B: flat ZIP — create the lib/arm64-v8a/ structure blutter needs
            mkdir -p app_stage/lib/arm64-v8a
            # Copy all .so files from the same directory as libapp.so
            cp "$(dirname "$SO_PATH")"/*.so app_stage/lib/arm64-v8a/ 2>/dev/null || true
            # Make sure libapp.so is there even if the glob missed it
            cp "$SO_PATH" app_stage/lib/arm64-v8a/libapp.so
            APP_DIR=$(cd app_stage && pwd)
            echo "Input shape: flat/arm64 ZIP — created structure at $APP_DIR"
          fi

          echo "APP_DIR contents:"
          ls -lR "$APP_DIR/lib" 2>/dev/null || ls "$APP_DIR"

          echo "SO_PATH=$SO_PATH" >> $GITHUB_ENV
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang libicu-dev git python3-pip 2>/dev/null
          echo "cmake: $(cmake --version | head -1)"
          echo "clang: $(clang --version | head -1)"

      - name: Clone blutter
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git

      - name: Install Python dependencies
        run: |
          pip3 install -q -r blutter/requirements.txt 2>/dev/null || true

      - name: Run blutter analysis
        run: |
          mkdir -p blutter_output
          echo "Analyzing app dir: $APP_DIR"
          cd blutter
          python3 blutter.py "$APP_DIR" "$GITHUB_WORKSPACE/blutter_output" 2>&1 | tee "$GITHUB_WORKSPACE/blutter_run.log"
          exit ${PIPESTATUS[0]}
        timeout-minutes: 35

      - name: Show output summary
        run: |
          echo "=== Output files ==="
          find blutter_output/ -type f | sort | head -40
          echo "=== Size ==="
          du -sh blutter_output/ 2>/dev/null || echo "(no output)"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-${{ inputs.job_id }}
          path: blutter_output/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: blutter_run.log
          retention-days: 1

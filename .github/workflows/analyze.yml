name: Analyze Flutter App (Blutter)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded arm64-v8a.zip'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download uploaded ZIP
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          ls -lh input.zip
          file input.zip

      - name: Delete uploaded asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Upload slot cleaned up"

      - name: Extract libapp.so
        run: |
          mkdir -p extracted
          unzip -o input.zip -d extracted

          echo "=== ZIP contents (first 30 entries) ==="
          unzip -l input.zip | head -35

          # Find libapp.so — prefer arm64 path first
          SO_PATH=$(find extracted/ -name "libapp.so" | grep -i "arm64" | head -1)
          if [ -z "$SO_PATH" ]; then
            SO_PATH=$(find extracted/ -name "libapp.so" | head -1)
          fi
          if [ -z "$SO_PATH" ]; then
            echo "Cannot find libapp.so in the uploaded file"
            find extracted/ -type f | head -20
            exit 1
          fi
          echo "Found: $SO_PATH ($(wc -c < "$SO_PATH") bytes)"

          # blutter expects the DIRECTORY that directly contains libapp.so
          # (it does: os.path.join(indir, 'libapp.so'))
          # So just pass the parent directory of wherever we found it.
          LIB_DIR=$(cd "$(dirname "$SO_PATH")" && pwd)
          echo "Lib dir for blutter: $LIB_DIR"
          ls -lh "$LIB_DIR"

          echo "SO_PATH=$SO_PATH" >> $GITHUB_ENV
          echo "LIB_DIR=$LIB_DIR" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build clang build-essential pkg-config \
            libicu-dev libcapstone-dev \
            git python3-pip 2>/dev/null
          pip3 install pyelftools requests
          echo "cmake: $(cmake --version | head -1)"
          echo "clang: $(clang --version | head -1)"
          python3 -c "import elftools; print('pyelftools OK')"

      - name: Clone blutter
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git

      - name: Run blutter analysis
        run: |
          mkdir -p blutter_output
          echo "Analyzing: $LIB_DIR"
          cd blutter
          python3 blutter.py "$LIB_DIR" "$GITHUB_WORKSPACE/blutter_output" 2>&1 | tee "$GITHUB_WORKSPACE/blutter_run.log"
          exit ${PIPESTATUS[0]}
        timeout-minutes: 35

      - name: Show output summary
        run: |
          echo "=== Output files ==="
          find blutter_output/ -type f | sort | head -40
          echo "=== Size ==="
          du -sh blutter_output/ 2>/dev/null || echo "(no output)"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-${{ inputs.job_id }}
          path: blutter_output/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: blutter_run.log
          retention-days: 1

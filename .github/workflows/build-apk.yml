name: Build Taurus Shield APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional job ID — used to name the uploaded asset'
        required: false
        default: 'manual'
      upload_to_release:
        description: 'Upload APK to analyze-queue release? (true/false)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.29.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: stable
          cache: true

      - name: Flutter version check
        run: flutter --version

      - name: Get Flutter dependencies
        working-directory: Taurus-Shield
        run: flutter pub get

      - name: Grant Gradle execute permission
        working-directory: Taurus-Shield/android
        run: chmod +x gradlew

      - name: Build release APK (obfuscated)
        working-directory: Taurus-Shield
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug_info \
            --target-platform android-arm64
          echo "=== Build output ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Rename APK with job ID
        run: |
          SRC="Taurus-Shield/build/app/outputs/flutter-apk/app-release.apk"
          JOB="${{ inputs.job_id }}"
          DEST="taurus_shield_${JOB}.apk"
          cp "$SRC" "$DEST"
          echo "APK ready: $(du -sh $DEST | cut -f1)  →  $DEST"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: taurus-shield-${{ inputs.job_id }}
          path: taurus_shield_${{ inputs.job_id }}.apk
          retention-days: 7

      - name: Upload APK to analyze-queue release
        if: ${{ inputs.upload_to_release == 'true' }}
        run: |
          RELEASE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/analyze-queue")

          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$RELEASE_ID" ]; then
            echo "analyze-queue release not found — skipping release upload (artifact is still available above)"
            exit 0
          fi

          ASSET_NAME="taurus_shield_${{ inputs.job_id }}.apk"

          RESULT=$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$ASSET_NAME" \
            --data-binary @"$ASSET_NAME")

          ASSET_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','error'))")
          echo "Uploaded to release — asset_id: $ASSET_ID"

      - name: Summary
        run: |
          APK="taurus_shield_${{ inputs.job_id }}.apk"
          echo "## Taurus Shield APK Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID:** ${{ inputs.job_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** $APK  ($(du -sh $APK | cut -f1))" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter:** 3.29.1  |  **Target:** arm64-v8a  |  **Mode:** release + obfuscated" >> $GITHUB_STEP_SUMMARY
          echo "- **Upload to release:** ${{ inputs.upload_to_release }}" >> $GITHUB_STEP_SUMMARY

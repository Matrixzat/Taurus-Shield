name: Build Blutter for Android ARM64

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Comma-separated Dart versions (e.g. 3.4.4,3.5.4,3.6.2)'
        required: false
        default: '3.3.4,3.4.4,3.5.4,3.6.2,3.7.2'
  push:
    tags:
      - 'blutter-*'

jobs:
  build:
    name: Build blutter_dartvm${{ matrix.dart_version }}_arm64
    runs-on: ubuntu-24.04-arm   # Native ARM64 runner — FREE for public repos

    strategy:
      fail-fast: false
      matrix:
        dart_version:
          - '3.3.4'
          - '3.4.4'
          - '3.5.4'
          - '3.6.2'
          - '3.7.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev libfmt-dev \
            python3-pip python3-pyelftools git curl unzip
          pip3 install requests --quiet

      - name: Clone blutter
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git blutter
          echo "Blutter cloned OK"
          ls blutter/

      - name: Build for Dart ${{ matrix.dart_version }}
        id: build
        run: |
          bash scripts/build_blutter.sh "${{ matrix.dart_version }}" blutter
        env:
          DART_VERSION: ${{ matrix.dart_version }}

      - name: Verify binary
        run: |
          BIN="blutter/bin/blutter_dartvm${{ matrix.dart_version }}"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: binary not found at $BIN"
            ls blutter/bin/ || echo "(bin/ is empty)"
            exit 1
          fi
          file "$BIN"
          ls -lh "$BIN"
          # Rename to include _arm64 suffix for the release
          cp "$BIN" "blutter_dartvm${{ matrix.dart_version }}_arm64"
          echo "Binary ready: blutter_dartvm${{ matrix.dart_version }}_arm64"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter_dartvm${{ matrix.dart_version }}_arm64
          path: blutter_dartvm${{ matrix.dart_version }}_arm64
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blutter-latest
          name: Blutter ARM64 Binaries
          body: |
            ## Blutter ARM64 Binaries for Taurus Shield

            These are pre-compiled blutter binaries for Android ARM64 (arm64-v8a).
            Taurus Shield downloads the matching binary automatically based on the
            Dart version detected in your target APK.

            ### Included Dart Versions
            | Binary | Dart Version | Flutter Version |
            |--------|-------------|-----------------|
            | blutter_dartvm3.3.4_arm64 | 3.3.4 | Flutter 3.19.x |
            | blutter_dartvm3.4.4_arm64 | 3.4.4 | Flutter 3.22.x |
            | blutter_dartvm3.5.4_arm64 | 3.5.4 | Flutter 3.24.x |
            | blutter_dartvm3.6.2_arm64 | 3.6.2 | Flutter 3.27.x |
            | blutter_dartvm3.7.2_arm64 | 3.7.2 | Flutter 3.29.x |

            ### Auto-updated by GitHub Actions
            Built on `ubuntu-24.04-arm` (native ARM64 runner).
          files: artifacts/**/*
          make_latest: true

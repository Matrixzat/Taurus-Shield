name: Build Blutter for Android ARM64

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'Comma-separated Dart versions (e.g. 3.4.4,3.5.4,3.6.2)'
        required: false
        default: '3.3.4,3.4.4,3.5.4,3.6.2,3.7.2'
  push:
    tags:
      - 'blutter-*'

jobs:
  build:
    name: Build Dart ${{ matrix.dart_version }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        dart_version:
          - '3.3.4'
          - '3.4.4'
          - '3.5.4'
          - '3.6.2'
          - '3.7.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev libfmt-dev \
            python3-pip python3-pyelftools git curl unzip
          pip3 install requests --break-system-packages --quiet 2>/dev/null || pip3 install requests --quiet

      - name: Clone blutter
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git blutter
          echo "Blutter cloned"
          ls blutter/

      - name: Build for Dart ${{ matrix.dart_version }}
        run: |
          chmod +x scripts/build_blutter.sh
          bash scripts/build_blutter.sh "${{ matrix.dart_version }}" blutter

      - name: Prepare release asset
        run: |
          BIN="blutter/bin/blutter_dartvm${{ matrix.dart_version }}_android_arm64"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: binary not found at $BIN"
            ls -la blutter/bin/ 2>/dev/null || echo "(bin/ empty)"
            exit 1
          fi
          cp "$BIN" "blutter_dartvm${{ matrix.dart_version }}_android_arm64"
          file "blutter_dartvm${{ matrix.dart_version }}_android_arm64"
          ls -lh "blutter_dartvm${{ matrix.dart_version }}_android_arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter_dartvm${{ matrix.dart_version }}_android_arm64
          path: blutter_dartvm${{ matrix.dart_version }}_android_arm64
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && contains(needs.build.result, 'success')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blutter-latest
          name: Blutter ARM64 Binaries
          body: |
            Pre-compiled blutter binaries for Android ARM64.
            Taurus Shield downloads the matching binary automatically.
          files: artifacts/**/*
          make_latest: true

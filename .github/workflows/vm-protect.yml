name: VM Protect (nmmp)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID'
        required: true
      job_id:
        description: 'Unique job ID'
        required: true
      sign_apk:
        description: 'Sign the output APK (true/false)'
        required: false
        default: 'true'

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download uploaded asset
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input_asset
          ls -lh input_asset
          file input_asset

      - name: Delete asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Upload slot cleaned."

      - name: Detect and extract input
        run: |
          mkdir -p extracted
          if unzip -t input_asset > /dev/null 2>&1; then
            echo "Input is a ZIP"
            unzip -o input_asset -d extracted || true
          else
            echo "Input is a raw APK"
            cp input_asset extracted/input.apk
          fi
          echo "=== Extracted ==="
          find extracted/ -type f | sort
          APK_PATH=$(find extracted/ -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: no .apk found"
            exit 1
          fi
          echo "APK: $APK_PATH"
          RULES_PATH=$(find extracted/ -name "rules.txt" -type f | head -1)
          MAPPING_PATH=$(find extracted/ -name "mapping.txt" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "RULES_PATH=${RULES_PATH:-}" >> $GITHUB_ENV
          echo "MAPPING_PATH=${MAPPING_PATH:-}" >> $GITHUB_ENV

      - name: Auto-generate rules.txt
        if: env.RULES_PATH == ''
        run: |
          sudo apt-get install -y aapt > /dev/null 2>&1 || true
          APK_ABS="$GITHUB_WORKSPACE/$APK_PATH"
          PKG=$(aapt dump badging "$APK_ABS" 2>/dev/null | grep "^package:" | sed "s/.*name='\([^']*\)'.*/\1/") || true
          if [ -z "$PKG" ]; then
            PKG=$(aapt2 dump badging "$APK_ABS" 2>/dev/null | grep "^package:" | sed "s/.*name='\([^']*\)'.*/\1/") || true
          fi
          if [ -z "$PKG" ]; then
            echo "WARNING: could not detect package name"
            echo "RULES_PATH=" >> $GITHUB_ENV
          else
            echo "Detected package: $PKG"
            RULES_FILE="$GITHUB_WORKSPACE/extracted/rules.txt"
            printf '# Auto-generated by Taurus Shield\nclass %s.*\n' "$PKG" > "$RULES_FILE"
            echo "Generated rules.txt:"
            cat "$RULES_FILE"
            echo "RULES_PATH=extracted/rules.txt" >> $GITHUB_ENV
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk zipalign apksigner wget unzip
          java -version 2>&1 | head -1

      - name: Cache cmake binary
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cmake-standalone
          key: cmake-3.28.3-linux-x86_64

      - name: Download cmake from prebuilt release
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt/cmake-3.28.3-linux-x86_64.tar.gz" \
            -O cmake.tar.gz
          mkdir -p cmake-standalone
          tar -xzf cmake.tar.gz -C cmake-standalone --strip-components=1
          rm cmake.tar.gz

      - name: Set cmake path
        run: |
          CMAKE_DIR="${{ github.workspace }}/cmake-standalone"
          chmod +x "$CMAKE_DIR/bin/cmake"
          echo "CMake: $($CMAKE_DIR/bin/cmake --version | head -1)"
          if [ ! -f "$CMAKE_DIR/bin/ninja" ]; then
            NINJA=$(which ninja-build 2>/dev/null || which ninja 2>/dev/null || echo "")
            if [ -n "$NINJA" ]; then
              cp "$NINJA" "$CMAKE_DIR/bin/ninja"
              chmod +x "$CMAKE_DIR/bin/ninja"
              echo "Ninja copied: $NINJA"
            else
              echo "WARNING: ninja not found"
            fi
          fi
          ls -lh "$CMAKE_DIR/bin/" | grep -E "cmake|ninja" || true
          echo "CMAKE_BIN=$CMAKE_DIR" >> $GITHUB_ENV

      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r27c
          key: android-ndk-r27c-linux

      - name: Download NDK from prebuilt release
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt/android-ndk-r27c-linux.zip"
          unzip -q android-ndk-r27c-linux.zip
          rm android-ndk-r27c-linux.zip

      - name: Set NDK path
        run: |
          NDK_DIR="${{ github.workspace }}/android-ndk-r27c"
          echo "NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Resolve Android SDK path
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            mkdir -p sdk_stub
            SDK="$(pwd)/sdk_stub"
            echo "Using stub SDK"
          fi
          echo "ANDROID_SDK_HOME=$SDK" >> $GITHUB_ENV

      - name: Cache vm-protect.jar
        id: cache-jar
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vm-protect.jar
          key: vm-protect-jar-2023-07-08-0942

      - name: Download vm-protect.jar from prebuilt release
        if: steps.cache-jar.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt/vm-protect-2023-07-08-0942.jar" \
            -O vm-protect.jar
          ls -lh vm-protect.jar

      - name: Run VM Protect
        timeout-minutes: 50
        run: |
          APK_ABS="$GITHUB_WORKSPACE/$APK_PATH"
          JAR="$GITHUB_WORKSPACE/vm-protect.jar"
          CMD="java -jar $JAR apk $APK_ABS"
          if [ -n "$RULES_PATH" ]; then
            CMD="$CMD $GITHUB_WORKSPACE/$RULES_PATH"
            echo "Using rules: $RULES_PATH"
            if [ -n "$MAPPING_PATH" ]; then
              CMD="$CMD $GITHUB_WORKSPACE/$MAPPING_PATH"
              echo "Using mapping: $MAPPING_PATH"
            fi
          else
            echo "No rules.txt -- protecting all classes"
          fi
          echo "Command: $CMD"
          export ANDROID_SDK_HOME
          export ANDROID_NDK_HOME
          export CMAKE_PATH="$CMAKE_BIN"
          echo "CMAKE_PATH=$CMAKE_PATH"
          $CMD 2>&1 | tee "$GITHUB_WORKSPACE/vmprotect_run.log"
          exit ${PIPESTATUS[0]}

      - name: Collect output
        run: |
          mkdir -p vmprotect_output
          APK_DIR=$(dirname "$GITHUB_WORKSPACE/$APK_PATH")
          PROTECT_APK=$(find "$APK_DIR/build" -name "*protect*.apk" -type f 2>/dev/null | head -1) || true
          if [ -z "$PROTECT_APK" ]; then
            PROTECT_APK=$(find . -name "*protect*.apk" -type f | head -1) || true
          fi
          if [ -z "$PROTECT_APK" ]; then
            echo "ERROR: protected APK not found"
            find . -name "*.apk" | head -20
            exit 1
          fi
          cp "$PROTECT_APK" vmprotect_output/protected.apk
          echo "Protected APK: $(wc -c < vmprotect_output/protected.apk) bytes"
          find vmprotect_output/ -type f | sort

      - name: Sign APK
        if: inputs.sign_apk == 'true'
        run: |
          if [ ! -f vmprotect_output/protected.apk ]; then
            echo "No APK to sign"
            exit 0
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          zipalign -f 4 \
            vmprotect_output/protected.apk \
            vmprotect_output/protected_aligned.apk
          apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out vmprotect_output/protected_signed.apk \
            vmprotect_output/protected_aligned.apk
          mv vmprotect_output/protected_signed.apk vmprotect_output/protected.apk
          rm -f vmprotect_output/protected_aligned.apk /tmp/release.keystore
          echo "Signed: $(wc -c < vmprotect_output/protected.apk) bytes"
          apksigner verify vmprotect_output/protected.apk && echo "Signature OK" || echo "WARNING: verify failed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmprotect-${{ inputs.job_id }}
          path: vmprotect_output/
          if-no-files-found: error
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: vmprotect_run.log
          retention-days: 1

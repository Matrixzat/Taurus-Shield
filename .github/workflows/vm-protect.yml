name: VM Protect (nmmp)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID'
        required: true
      job_id:
        description: 'Unique job ID'
        required: true
      sign_apk:
        description: 'Sign the output APK (true/false)'
        required: false
        default: 'true'

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download uploaded asset
        run: |
          MAX=5
          for i in $(seq 1 $MAX); do
            echo "Download attempt $i/$MAX..."
            HTTP=$(curl -sL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -w "%{http_code}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
              -o input_asset)
            if [ "$HTTP" = "200" ] && [ -s input_asset ]; then
              echo "Download OK (HTTP $HTTP)"
              break
            fi
            echo "Got HTTP $HTTP or empty file — waiting 10s before retry..."
            rm -f input_asset
            sleep 10
            if [ "$i" = "$MAX" ]; then
              echo "ERROR: asset ${{ inputs.asset_id }} not available after $MAX attempts (last HTTP $HTTP)"
              exit 1
            fi
          done
          ls -lh input_asset
          file input_asset

      - name: Delete asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Upload slot cleaned."

      - name: Detect and extract input
        run: |
          mkdir -p extracted
          # zipinfo -1 prints one filename per line — correctly handles spaces and
          # special characters that break "unzip -l | awk '{print $4}'".
          # APK files are themselves ZIPs, so we distinguish a bundle (ZIP containing
          # an APK) from a raw APK by checking whether any entry ends with .apk.
          if zipinfo -1 input_asset 2>/dev/null | grep -q "\.apk$"; then
            echo "Input is a ZIP bundle containing an APK"
            unzip -o input_asset -d extracted || true
          else
            echo "Input is a raw APK"
            cp input_asset extracted/input.apk
          fi
          echo "=== Extracted files ==="
          find extracted/ -type f | sort
          # Capture the APK path — find handles spaces in filenames safely.
          RAW_APK=$(find extracted/ -name "*.apk" -type f | head -1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: no .apk found after extraction"
            exit 1
          fi
          echo "Found APK: $RAW_APK"
          # Always normalise to a space-free name so every downstream step is safe.
          SAFE_APK="extracted/input.apk"
          if [ "$RAW_APK" != "$SAFE_APK" ]; then
            mv "$RAW_APK" "$SAFE_APK"
            echo "Renamed to: $SAFE_APK"
          fi
          RULES_PATH=$(find extracted/ -name "rules.txt"    -type f | head -1)
          MAPPING_PATH=$(find extracted/ -name "mapping.txt" -type f | head -1)
          echo "APK_PATH=$SAFE_APK"              >> $GITHUB_ENV
          echo "RULES_PATH=${RULES_PATH:-}"      >> $GITHUB_ENV
          echo "MAPPING_PATH=${MAPPING_PATH:-}"  >> $GITHUB_ENV

      - name: APK pre-flight check
        run: |
          APK_ABS="$GITHUB_WORKSPACE/$APK_PATH"
          echo "=== file ==="
          file "$APK_ABS"
          echo "=== size ==="
          ls -lh "$APK_ABS"
          echo "=== ZIP entries (first 30) ==="
          unzip -l "$APK_ABS" 2>&1 | head -35
          echo "=== AndroidManifest.xml present? ==="
          if unzip -l "$APK_ABS" 2>/dev/null | grep -q "AndroidManifest.xml"; then
            echo "YES — AndroidManifest.xml found"
          else
            echo "NO — AndroidManifest.xml missing! Not a standard Android APK."
            exit 1
          fi
          echo "=== Native ABI check ==="
          ABIS=$(unzip -Z1 "$APK_ABS" 2>/dev/null \
            | sed -nE 's#^lib/([^/]+)/[^/]+\.so$#\1#p' \
            | sort -u)
          SUPPORTED_ABIS=$'armeabi-v7a\narm64-v8a\nx86\nx86_64'
          if [ -z "$ABIS" ]; then
            echo "No native libraries found; NMMP will use both ARM ABIs."
            APK_ABIS="armeabi-v7a,arm64-v8a"
          else
            printf '%s\n' "$ABIS"
            while IFS= read -r ABI; do
              [ -z "$ABI" ] && continue
              if ! printf '%s\n' "$SUPPORTED_ABIS" | grep -qx "$ABI"; then
                echo "ERROR: input APK contains unsupported ABI: $ABI"
                echo "Supported NMMP ABIs: armeabi-v7a, arm64-v8a, x86, x86_64"
                exit 1
              fi
            done <<< "$ABIS"
            APK_ABIS=$(printf '%s\n' "$ABIS" | paste -sd, -)
          fi
          echo "NMMP will process input ABI set: $APK_ABIS"
          echo "APK_ABIS=$APK_ABIS" >> "$GITHUB_ENV"

      - name: Log protection mode
        if: env.RULES_PATH == ''
        run: |
          echo "No rules.txt provided — nmmp will protect all classes (default behaviour)."

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk zipalign apksigner wget unzip
          java -version 2>&1 | head -1

      - name: Cache cmake binary
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cmake-standalone
          key: cmake-3.28.3-linux-x86_64

      - name: Download cmake from prebuilt release
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt/cmake-3.28.3-linux-x86_64.tar.gz" \
            -O cmake.tar.gz
          mkdir -p cmake-standalone
          tar -xzf cmake.tar.gz -C cmake-standalone --strip-components=1
          rm cmake.tar.gz

      - name: Set cmake path
        run: |
          CMAKE_DIR="${{ github.workspace }}/cmake-standalone"
          chmod +x "$CMAKE_DIR/bin/cmake"
          echo "CMake: $($CMAKE_DIR/bin/cmake --version | head -1)"
          if [ ! -f "$CMAKE_DIR/bin/ninja" ]; then
            NINJA=$(which ninja-build 2>/dev/null || which ninja 2>/dev/null || echo "")
            if [ -n "$NINJA" ]; then
              cp "$NINJA" "$CMAKE_DIR/bin/ninja"
              chmod +x "$CMAKE_DIR/bin/ninja"
              echo "Ninja copied: $NINJA"
            else
              echo "WARNING: ninja not found"
            fi
          fi
          ls -lh "$CMAKE_DIR/bin/" | grep -E "cmake|ninja" || true
          echo "CMAKE_BIN=$CMAKE_DIR" >> $GITHUB_ENV

      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r27c
          key: android-ndk-r27c-linux

      - name: Download NDK from prebuilt release
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt/android-ndk-r27c-linux.zip"
          unzip -q android-ndk-r27c-linux.zip
          rm android-ndk-r27c-linux.zip

      - name: Set NDK path
        run: |
          NDK_DIR="${{ github.workspace }}/android-ndk-r27c"
          echo "NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Resolve Android SDK path
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            mkdir -p sdk_stub
            SDK="$(pwd)/sdk_stub"
            echo "Using stub SDK"
          fi
          echo "ANDROID_SDK_HOME=$SDK" >> $GITHUB_ENV

      - name: Cache vm-protect.jar
        id: cache-jar
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vm-protect.jar
          key: vm-protect-jar-2023-07-08-0942

      - name: Download vm-protect.jar from prebuilt release
        if: steps.cache-jar.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt/vm-protect-2023-07-08-0942.jar" \
            -O vm-protect.jar
          ls -lh vm-protect.jar

      - name: Configure NMMP for input APK ABIs
        run: |
          JAR_DIR="$(dirname "$GITHUB_WORKSPACE/vm-protect.jar")"
          mkdir -p "$JAR_DIR/tools"

          # NMMP reads this file beside vm-protect.jar. Enable exactly the ABIs
          # found in the uploaded APK so single- and multi-ABI APKs are retained.
          cat > "$JAR_DIR/tools/config.json" <<EOF
          {
            "abi": {
              "armeabi-v7a": false,
              "arm64-v8a": false,
              "x86": false,
              "x86_64": false
            },
            "environment": {
              "sdk_path": "$ANDROID_SDK_HOME",
              "cmake_path": "$CMAKE_BIN",
              "ndk_path": "$ANDROID_NDK_HOME",
              "ndk_toolchains": "/toolchains/llvm/prebuilt/",
              "ndk_abi": "linux-x86_64",
              "ndk_strip": "/bin/llvm-strip"
            }
          }
          EOF

          python3 - "$JAR_DIR/tools/config.json" "$APK_ABIS" <<'PY'
          import json
          import sys
          from pathlib import Path

          config_path = Path(sys.argv[1])
          selected = set(filter(None, sys.argv[2].split(",")))
          supported = ("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
          if not selected or not selected.issubset(supported):
              raise SystemExit(f"Invalid APK ABI set: {sorted(selected)}")
          config = json.loads(config_path.read_text())
          config["abi"] = {abi: abi in selected for abi in supported}
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print("NMMP ABI configuration verified: " + " + ".join(sorted(selected)))
          PY

      - name: Run VM Protect
        timeout-minutes: 50
        run: |
          APK_ABS="$GITHUB_WORKSPACE/$APK_PATH"
          JAR="$GITHUB_WORKSPACE/vm-protect.jar"
          export ANDROID_SDK_HOME
          export ANDROID_NDK_HOME
          export CMAKE_PATH="$CMAKE_BIN"
          echo "CMAKE_PATH=$CMAKE_PATH"
          # Build args as an array — safe against spaces in any path.
          ARGS=(java -jar "$JAR" apk "$APK_ABS")
          if [ -n "$RULES_PATH" ]; then
            ARGS+=("$GITHUB_WORKSPACE/$RULES_PATH")
            echo "Using rules: $RULES_PATH"
            if [ -n "$MAPPING_PATH" ]; then
              ARGS+=("$GITHUB_WORKSPACE/$MAPPING_PATH")
              echo "Using mapping: $MAPPING_PATH"
            fi
          else
            echo "No rules.txt -- protecting all classes"
          fi
          echo "Command: ${ARGS[*]}"
          "${ARGS[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/vmprotect_run.log"
          exit ${PIPESTATUS[0]}

      - name: Collect output
        run: |
          mkdir -p vmprotect_output
          APK_DIR=$(dirname "$GITHUB_WORKSPACE/$APK_PATH")
          PROTECT_APK=$(find "$APK_DIR/build" -name "*protect*.apk" -type f 2>/dev/null | head -1) || true
          if [ -z "$PROTECT_APK" ]; then
            PROTECT_APK=$(find . -name "*protect*.apk" -type f | head -1) || true
          fi
          if [ -z "$PROTECT_APK" ]; then
            echo "ERROR: protected APK not found"
            find . -name "*.apk" | head -20
            exit 1
          fi
          cp "$PROTECT_APK" vmprotect_output/protected.apk
          echo "Protected APK: $(wc -c < vmprotect_output/protected.apk) bytes"
          find vmprotect_output/ -type f | sort

      - name: Verify protected APK contains every input ABI runtime
        run: |
          APK="vmprotect_output/protected.apk"
          echo "=== Native libraries in protected APK ==="
          unzip -Z1 "$APK" | grep '^lib/.*\.so$' | sort || true

          IFS=',' read -r -a REQUIRED_ABIS <<< "$APK_ABIS"
          for ABI in "${REQUIRED_ABIS[@]}"; do
            if ! unzip -Z1 "$APK" | grep -Fqx "lib/$ABI/libnmmp.so"; then
              echo "ERROR: protected APK is missing lib/$ABI/libnmmp.so"
              echo "NMMP did not produce the runtime required for input ABI $ABI."
              exit 1
            fi
            echo "Verified: lib/$ABI/libnmmp.so"
          done

      - name: Sign APK
        if: inputs.sign_apk == 'true'
        run: |
          if [ ! -f vmprotect_output/protected.apk ]; then
            echo "No APK to sign"
            exit 0
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          zipalign -f 4 \
            vmprotect_output/protected.apk \
            vmprotect_output/protected_aligned.apk
          apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out vmprotect_output/protected_signed.apk \
            vmprotect_output/protected_aligned.apk
          mv vmprotect_output/protected_signed.apk vmprotect_output/protected.apk
          rm -f vmprotect_output/protected_aligned.apk /tmp/release.keystore
          echo "Signed: $(wc -c < vmprotect_output/protected.apk) bytes"
          apksigner verify vmprotect_output/protected.apk && echo "Signature OK" || echo "WARNING: verify failed"

      - name: Upload result to release
        run: |
          ASSET_NAME="vmprotect-result-${{ inputs.job_id }}.apk"
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/analyze-queue" \
            | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: could not get analyze-queue release ID"
            exit 1
          fi
          echo "Uploading $ASSET_NAME to release $RELEASE_ID..."
          curl -fX POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" \
            --data-binary @vmprotect_output/protected.apk
          echo "Upload complete."

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: vmprotect_run.log
          retention-days: 1

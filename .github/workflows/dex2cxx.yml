name: dex2cxx-protect

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the ZIP (APK + filter.txt)'
        required: true
      job_id:
        description: 'Job tracking ID'
        required: true

jobs:
  protect:
    runs-on: ubuntu-latest
    env:
      APK_PATH: extracted/Munowatch_Pro_v29_fixed_sign.apk
      FILTER_PATH: extracted/filter.txt

    steps:
      - name: Download uploaded ZIP
        run: |
          curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o job.zip
          unzip -o job.zip -d extracted/
          echo "Extracted:"
          find extracted/ -type f | sort

      - name: Delete uploaded asset
        run: |
          curl -s -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true

      # ── Java 17 ──────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Build dex2cxx.jar ────────────────────────────────────────────────────
      - name: Cache dex2cxx build
        uses: actions/cache@v4
        id: dex2cxx-cache
        with:
          path: ~/dex2cxx
          key: dex2cxx-ispointer-v1

      - name: Clone and build Dex2cxx
        if: steps.dex2cxx-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ispointer/Dex2cxx.git ~/dex2cxx
          cd ~/dex2cxx/java
          chmod +x build.sh
          bash build.sh
          echo "=== Built JAR ==="
          ls -lh ~/dex2cxx/dex2cxx.jar

      # ── Android NDK ──────────────────────────────────────────────────────────
      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ~/android-ndk/android-ndk-r27c
          key: ndk-r27c

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/android-ndk
          wget -q -O /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          unzip -q /tmp/ndk.zip -d ~/android-ndk/
          rm /tmp/ndk.zip
          echo "NDK ready: $(ls ~/android-ndk/)"

      # ── Configure dxx.cfg ────────────────────────────────────────────────────
      - name: Configure dxx
        run: |
          NDK_DIR="$HOME/android-ndk/android-ndk-r27c"

          # Decode keystore for signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

          # Write dxx.cfg next to dex2cxx.jar so ToolConfig.load() finds it
          cat > ~/dex2cxx/dxx.cfg << CFGEOF
          {
              "ndk_dir": "$NDK_DIR",
              "signature": {
                  "keystore_path": "/tmp/release.keystore",
                  "alias": "${{ secrets.KEYSTORE_ALIAS }}",
                  "keystore_pass": "${{ secrets.KEYSTORE_PASSWORD }}",
                  "store_pass": "${{ secrets.KEYSTORE_PASSWORD }}",
                  "v1_enabled": true,
                  "v2_enabled": true,
                  "v3_enabled": true
              },
              "ollvm": {
                  "enable": false,
                  "flags": ""
              }
          }
          CFGEOF

          echo "=== dxx.cfg written ==="
          cat ~/dex2cxx/dxx.cfg | grep -v "pass\|keystore_path"

          # Verify NDK
          "$NDK_DIR/ndk-build" --version 2>&1 | head -2

      # ── Run Dex2cxx ──────────────────────────────────────────────────────────
      - name: Run Dex2cxx protection
        run: |
          set -o pipefail
          APK="$GITHUB_WORKSPACE/$APK_PATH"
          FILTER="$GITHUB_WORKSPACE/$FILTER_PATH"

          echo "=== filter.txt ==="
          cat "$FILTER"
          echo ""

          # Must cd to ~/dex2cxx so ToolConfig finds dxx.cfg and project/ dir
          cd ~/dex2cxx
          java -Xmx2g -jar dex2cxx.jar \
            -a "$APK" \
            -o out.apk \
            --filter "$FILTER" \
            --report report.txt \
            2>&1 | tee /tmp/dex2cxx_run.log

          echo "Exit: $?"
          echo ""
          if [ -f report.txt ]; then
            echo "=== Methods matched ==="
            wc -l report.txt
            cat report.txt
          fi

      # ── Collect output ────────────────────────────────────────────────────────
      - name: Collect output
        run: |
          mkdir -p dex2cxx_output
          if [ -f ~/dex2cxx/out.apk ]; then
            cp ~/dex2cxx/out.apk dex2cxx_output/
            echo "Output APK: $(wc -c < dex2cxx_output/out.apk) bytes"
          else
            echo "ERROR: out.apk not produced" >&2
            cat /tmp/dex2cxx_run.log
            exit 1
          fi
          [ -f ~/dex2cxx/report.txt ]   && cp ~/dex2cxx/report.txt   dex2cxx_output/
          cp /tmp/dex2cxx_run.log dex2cxx_output/run.log
          echo "=== Output files ==="
          find dex2cxx_output/ -type f | sort
          du -sh dex2cxx_output/

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex2cxx-${{ inputs.job_id }}
          path: dex2cxx_output/
          retention-days: 7

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-dex2cxx-${{ inputs.job_id }}
          path: /tmp/dex2cxx_run.log
          retention-days: 3

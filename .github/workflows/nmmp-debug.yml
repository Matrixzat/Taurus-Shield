name: NMMP Debug Trace

# This workflow is intentionally separate from vm-protect.yml.
# It runs a separate protection copy, preserves the fresh input and protected
# output, and never replaces or uploads the normal protection result.
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: "Release asset ID containing the APK or APK bundle"
        required: true
        type: string
      job_id:
        description: "Unique ID used for the debug artifact name"
        required: true
        type: string
      run_emulator:
        description: "Boot an Android emulator and collect a smoke log"
        required: false
        default: false
        type: boolean
      package_name:
        description: "Optional package name to launch in the emulator"
        required: false
        default: ""
        type: string
      emulator_api:
        description: "Android API level for the optional emulator"
        required: false
        default: "30"
        type: string

jobs:
  static-debug:
    name: Static NMMP evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout static recovery tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release asset
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o input_asset
          test -s input_asset
          sha256sum input_asset | tee input_asset.sha256
          file input_asset

      - name: Install protection and static-analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils file unzip python3 openjdk-17-jdk wget ninja-build radare2

      - name: Extract APK without modifying the input
        run: |
          set -euo pipefail
          mkdir -p extracted
          if zipinfo -1 input_asset 2>/dev/null | grep -Eiq '\.apk$'; then
            unzip -q -o input_asset -d extracted
          else
            cp input_asset extracted/input.apk
          fi

          APK=$(find extracted -type f -iname '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" extracted/input.apk
          RULES=$(find extracted -type f -name 'rules.txt' -print -quit || true)
          MAPPING=$(find extracted -type f -name 'mapping.txt' -print -quit || true)
          echo "APK_PATH=extracted/input.apk" >> "$GITHUB_ENV"
          echo "RULES_PATH=$RULES" >> "$GITHUB_ENV"
          echo "MAPPING_PATH=$MAPPING" >> "$GITHUB_ENV"
          echo "APK path: $APK"
          unzip -Z1 "$APK" | sort > debug_zip_entries.txt

      - name: Prepare NMMP toolchain
        run: |
          set -euo pipefail
          if [ ! -f cmake-standalone/bin/cmake ]; then
            curl -fsSL \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt/cmake-3.28.3-linux-x86_64.tar.gz" \
              -o cmake.tar.gz
            mkdir -p cmake-standalone
            tar -xzf cmake.tar.gz -C cmake-standalone --strip-components=1
            rm -f cmake.tar.gz
          fi
          chmod +x cmake-standalone/bin/cmake
          if [ ! -x cmake-standalone/bin/ninja ]; then
            cp "$(command -v ninja)" cmake-standalone/bin/ninja
            chmod +x cmake-standalone/bin/ninja
          fi

          if [ ! -d android-ndk-r27c ]; then
            curl -fsSL \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt/android-ndk-r27c-linux.zip" \
              -o android-ndk.zip
            unzip -q android-ndk.zip
            rm -f android-ndk.zip
          fi

          if [ ! -s vm-protect.jar ]; then
            curl -fsSL \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt/vm-protect-2023-07-08-0942.jar" \
              -o vm-protect.jar
          fi
          test -s vm-protect.jar

          mkdir -p tools
          cat > tools/config.json <<EOF
          {
            "abi": {
              "armeabi-v7a": true,
              "arm64-v8a": true,
              "x86": false,
              "x86_64": true
            },
            "environment": {
              "sdk_path": "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}",
              "cmake_path": "$GITHUB_WORKSPACE/cmake-standalone",
              "ndk_path": "$GITHUB_WORKSPACE/android-ndk-r27c",
              "ndk_toolchains": "/toolchains/llvm/prebuilt/",
              "ndk_abi": "linux-x86_64",
              "ndk_strip": "/bin/llvm-strip"
            }
          }
          EOF

          echo "CMAKE_PATH=$GITHUB_WORKSPACE/cmake-standalone" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" \
            >> "$GITHUB_ENV"

      - name: Run NMMP protection with supplied class rules
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/$APK_PATH"
          JAR="$GITHUB_WORKSPACE/vm-protect.jar"
          ARGS=(java -jar "$JAR" apk "$APK")
          if [ -n "${RULES_PATH:-}" ]; then
            ARGS+=("$GITHUB_WORKSPACE/$RULES_PATH")
            echo "Using class rules: $RULES_PATH"
          else
            echo "No rules.txt supplied; using NMMP defaults."
          fi
          if [ -n "${MAPPING_PATH:-}" ]; then
            ARGS+=("$GITHUB_WORKSPACE/$MAPPING_PATH")
            echo "Using mapping: $MAPPING_PATH"
          fi

          export ANDROID_NDK_HOME CMAKE_PATH
          printf 'Protection command:'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          "${ARGS[@]}" 2>&1 | tee nmmp-protect.log
          exit "${PIPESTATUS[0]}"

      - name: Preserve input and protected APKs
        run: |
          set -euo pipefail
          mkdir -p nmmp-debug/input nmmp-debug/protected
          cp "$GITHUB_WORKSPACE/$APK_PATH" nmmp-debug/input/input.apk
          find . -type f -iname '*protect*.apk' -not -path './nmmp-debug/*' \
            -print | head -1 > protected_path.txt
          PROTECTED=$(cat protected_path.txt)
          if [ -z "$PROTECTED" ]; then
            echo "Protected APK was not produced."
            find . -type f -iname '*.apk' -print
            exit 1
          fi
          cp "$PROTECTED" nmmp-debug/protected/protected.apk
          echo "PROTECTED_APK=nmmp-debug/protected/protected.apk" >> "$GITHUB_ENV"
          sha256sum nmmp-debug/input/input.apk \
            nmmp-debug/protected/protected.apk \
            | tee nmmp-debug/apk-hashes.txt
          cp nmmp-protect.log nmmp-debug/nmmp-protect.log
          if [ -n "${RULES_PATH:-}" ]; then
            cp "$RULES_PATH" nmmp-debug/input/rules.txt
          fi
          if [ -n "${MAPPING_PATH:-}" ]; then
            cp "$MAPPING_PATH" nmmp-debug/input/mapping.txt
          fi

      - name: Preserve generated dex2c mapping evidence
        run: |
          set -euo pipefail
          DEX2C="$GITHUB_WORKSPACE/extracted/build/dex2c"
          if [ ! -d "$DEX2C" ]; then
            echo "ERROR: protector did not leave extracted/build/dex2c"
            echo "Generated build directories found:"
            find "$GITHUB_WORKSPACE/extracted" -type d -path '*/build/*' \
              -print | sort || true
            echo "Top-level generated files:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f \
              -print | sort | head -200 || true
            exit 1
          fi

          mkdir -p nmmp-debug/protected/generated
          cp -a "$DEX2C" nmmp-debug/protected/generated/dex2c
          find nmmp-debug/protected/generated/dex2c -type f -print0 |
            sort -z |
            while IFS= read -r -d '' file; do
              sha256sum "$file"
            done > nmmp-debug/protected/generated/dex2c.sha256

          echo "DEX2C_ROOT=$DEX2C" >> "$GITHUB_ENV"
          echo "Generated dex2c files preserved:"
          find nmmp-debug/protected/generated/dex2c -type f -print | sort

      - name: Extract exact generated opcode permutation
        run: |
          set -euo pipefail
          python3 - "$DEX2C_ROOT" \
            "$GITHUB_WORKSPACE/nmmp-debug/protected/opcode_permutation.json" \
            "$GITHUB_WORKSPACE/nmmp-debug/protected/handler_mapping_generated.json" <<'PY'
          import ast
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          permutation_output = Path(sys.argv[2])
          mapping_output = Path(sys.argv[3])

          # RandomInstructionRewriter preserves NOP and the unused DEX 039
          # holes.  A generated candidate that violates this is not NMMP's
          # opcode permutation, even if it happens to contain 256 integers.
          valid_slots = {
              value for value in range(1, 256)
              if value <= 0x3D or 0x44 <= value <= 0x78
              or 0x7B <= value <= 0xF2 or 0xFA <= value <= 0xFF
          }
          fixed_slots = {0} | (set(range(256)) - valid_slots - {0})
          integer = re.compile(r"(?<![A-Za-z0-9_])(?:0[xX][0-9A-Fa-f]+|[0-9]+)(?![A-Za-z0-9_])")
          declaration = re.compile(
              r"(?P<kind>\b(?:const|static|constexpr|unsigned|uint8_t|"
              r"uint16_t|uint32_t|int|short|char)\b[^;=\n]{0,160}?)"
              r"(?P<name>[A-Za-z_][A-Za-z0-9_]*)\s*"
              r"(?:\[\s*(?:256)?\s*\])?\s*=\s*\{(?P<body>.*?)\}",
              re.IGNORECASE | re.DOTALL,
          )
          opcode_enum = re.compile(
              r"\benum\s+Opcode\s*\{(?P<body>.*?)\};",
              re.IGNORECASE | re.DOTALL,
          )
          enum_entry = re.compile(
              r"^\s*(?P<name>OP_[A-Z0-9_]+)\s*=\s*"
              r"(?P<value>0[xX][0-9A-Fa-f]+|[0-9]+)\s*,?",
              re.MULTILINE,
          )

          def valid(values):
              return (
                  len(values) == 256
                  and sorted(values) == list(range(256))
                  and values[0] == 0
                  and all(
                      (index in valid_slots) == (value in valid_slots)
                      for index, value in enumerate(values)
                  )
                  and all(
                      values[index] == index
                      for index in fixed_slots
                  )
              )

          def numbers(text):
              # Remove comments before parsing arrays, but retain all literals
              # in the initializer. ast.literal_eval handles JSON/Python-like
              # generated arrays; the regex fallback handles C initializers.
              text = re.sub(r"/\*.*?\*/", " ", text, flags=re.DOTALL)
              text = re.sub(r"//.*?$", " ", text, flags=re.MULTILINE)
              try:
                  value = ast.literal_eval("[" + text + "]")
                  if isinstance(value, list) and all(
                      isinstance(item, int) and not isinstance(item, bool)
                      for item in value
                  ):
                      return value
              except (SyntaxError, ValueError):
                  pass
              return [int(match.group(0), 0) for match in integer.finditer(text)]

          def direction_for(path, symbol, label):
              text = " ".join((str(path), symbol, label)).lower()
              if re.search(
                  r"encoded[_-]?to[_-]?(standard|dex)|decode|inverse|"
                  r"vm[_-]?to[_-]?(dex|standard)",
                  text,
              ):
                  return "encoded_to_standard"
              if re.search(
                  r"standard[_-]?to[_-]?(encoded|vm)|encode|"
                  r"dex[_-]?to[_-]?vm|randomized|permutation",
                  text,
              ):
                  return "standard_to_encoded"
              return None

          candidates = []

          def add_candidate(path, symbol, values, label, source_kind):
              if not valid(values):
                  return
              direction = direction_for(path.relative_to(root), symbol, label)
              if direction is None:
                  return
              candidates.append({
                  "path": str(path.relative_to(root)),
                  "symbol": symbol or None,
                  "label": label or None,
                  "direction": direction,
                  "values": values,
                  "source_kind": source_kind,
              })

          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.stat().st_size > 4 * 1024 * 1024:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              # Prefer an explicitly named JSON field when the generated
              # build emits JSON metadata.
              try:
                  document = json.loads(text)
              except (json.JSONDecodeError, ValueError):
                  document = None
              if document is not None:
                  stack = [("", document)]
                  while stack:
                      label, value = stack.pop()
                      if isinstance(value, dict):
                          for key, child in value.items():
                              stack.append((str(key), child))
                      elif (
                          isinstance(value, list)
                          and all(isinstance(item, int) for item in value)
                      ):
                          add_candidate(
                              path, "", value, label, "json"
                          )

              for match in declaration.finditer(text):
                  symbol = match.group("name")
                  label = match.group("kind")
                  values = numbers(match.group("body"))
                  add_candidate(path, symbol, values, label, "c_initializer")

              # The protector's generated DexOpcodes.h keeps the canonical
              # OP_* declaration order and randomizes the assigned enum
              # values.  That enum is the exact standard-opcode -> encoded
              # permutation; it is not inferred from native handlers.
              for match in opcode_enum.finditer(text):
                  entries = [
                      (item.group("name"), int(item.group("value"), 0))
                      for item in enum_entry.finditer(match.group("body"))
                  ]
                  if len(entries) != 256:
                      continue
                  canonical = Path.cwd() / (
                      "devirtualizer/runtime/runtime/nmmp/"
                      "nmmvm/nmmvm/src/main/cpp/vm/DexOpcodes.h"
                  )
                  try:
                      canonical_text = canonical.read_text(encoding="utf-8")
                      canonical_body = opcode_enum.search(canonical_text).group(
                          "body"
                      )
                      canonical_names = [
                          item.group("name")
                          for item in enum_entry.finditer(canonical_body)
                      ]
                  except (OSError, AttributeError):
                      canonical_names = []
                  generated_names = [name for name, _ in entries]
                  generated_values = [value for _, value in entries]
                  if (
                      len(canonical_names) != 256
                      or set(canonical_names) != set(generated_names)
                      or generated_values != list(range(256))
                  ):
                      continue
                  standard_by_name = {
                      name: standard
                      for standard, name in enumerate(canonical_names)
                  }
                  encoded_to_standard = [
                      standard_by_name[name] for name in generated_names
                  ]
                  add_candidate(
                      path,
                      "Opcode",
                      encoded_to_standard,
                      "encoded_to_standard_opcode_enum",
                      "opcode_enum",
                  )

          # Same values in multiple generated copies are one source candidate;
          # different arrays or directions are ambiguous and must stop the job.
          unique = {}
          for candidate in candidates:
              key = (
                  tuple(candidate["values"]),
                  candidate["direction"],
              )
              unique.setdefault(key, []).append(candidate)
          if len(unique) != 1:
              print("ERROR: could not identify one exact generated NMMP permutation")
              print(f"Validated candidates: {len(candidates)}")
              for items in unique.values():
                  for item in items[:5]:
                      print(
                          f"  {item['path']}:{item['symbol'] or item['label'] or '<json>'} "
                          f"direction={item['direction']}"
                      )
              if not candidates:
                  print(
                      "No direction-labeled 256-entry permutation was found. "
                      "The generated header may use a new symbol name; preserve "
                      "the artifact and update the extractor rather than guessing."
                  )
              raise SystemExit(1)

          candidate_group = next(iter(unique.values()))
          candidate = candidate_group[0]
          raw = candidate["values"]
          if candidate["direction"] == "encoded_to_standard":
              encoded_to_standard = raw
          else:
              encoded_to_standard = [0] * 256
              for standard, encoded in enumerate(raw):
                  encoded_to_standard[encoded] = standard

          if not valid(encoded_to_standard):
              raise SystemExit(
                  "generated permutation inversion failed NMMP DEX 039 validation"
              )

          source_files = sorted(
              {item["path"] for item in candidate_group}
          )
          source = {
              "path": candidate["path"],
              "symbol": candidate["symbol"],
              "label": candidate["label"],
              "direction": candidate["direction"],
              "duplicate_source_files": source_files,
          }
          permutation = {
              "schema": "nmmp-generated-opcode-permutation/v1",
              "dex_version": 39,
              "source": source,
              "opcode_permutation": raw,
              "encoded_to_standard": encoded_to_standard,
              "validation": {
                  "entry_count": 256,
                  "is_bijection": True,
                  "nop_fixed": encoded_to_standard[0] == 0,
                  "dex039_holes_fixed": all(
                      encoded_to_standard[index] == index
                      for index in fixed_slots
                  ),
              },
          }
          permutation_output.write_text(
              json.dumps(permutation, indent=2) + "\n", encoding="utf-8"
          )

          # restore_dex.py consumes encoded-byte -> standard-opcode assignments.
          mapping = {
              "schema": "nmmp-generated-handler-mapping/v1",
              "source_permutation": str(permutation_output.resolve()),
              "protected_table": "generated-permutation",
              "known_assignments": {
                  str(encoded): standard
                  for encoded, standard in enumerate(encoded_to_standard)
              },
              "entries": [
                  {
                      "encoded": f"0x{encoded:02x}",
                      "standard": f"0x{standard:02x}",
                      "confidence": "generated-source-exact",
                  }
                  for encoded, standard in enumerate(encoded_to_standard)
              ],
          }
          mapping_output.write_text(
              json.dumps(mapping, indent=2) + "\n", encoding="utf-8"
          )
          print(
              "Exact generated permutation:",
              candidate["path"],
              candidate["symbol"] or candidate["label"] or "<json>",
              candidate["direction"],
          )
          print("Restorer mapping:", mapping_output)
          PY
          echo "OPCODE_PERMUTATION_JSON=nmmp-debug/protected/opcode_permutation.json" \
            >> "$GITHUB_ENV"
          echo "GENERATED_MAPPING_JSON=nmmp-debug/protected/handler_mapping_generated.json" \
            >> "$GITHUB_ENV"

      - name: Restore DEX with generated permutation
        run: |
          set -euo pipefail
          RECOVERY="$GITHUB_WORKSPACE/nmmp-debug/protected/recovery"
          RESTORED="$GITHUB_WORKSPACE/nmmp-debug/protected/restored_dex"
          MAPPING="$GITHUB_WORKSPACE/$GENERATED_MAPPING_JSON"
          RECOVER_SCRIPT="$GITHUB_WORKSPACE/devirtualizer/runtime/runtime/analysis/protected-apk/recover_nmmp.py"
          RESTORE_SCRIPT="$GITHUB_WORKSPACE/devirtualizer/runtime/runtime/analysis/protected-apk/restore_dex.py"
          test -s "$MAPPING"
          test -f "$RECOVER_SCRIPT"
          test -f "$RESTORE_SCRIPT"

          rm -rf "$RECOVERY" "$RESTORED"
          python3 "$RECOVER_SCRIPT" "$GITHUB_WORKSPACE/$PROTECTED_APK" \
            --output "$RECOVERY"
          unzip -q -o "$GITHUB_WORKSPACE/$PROTECTED_APK" \
            'lib/*/libnmmvm.so' -d "$RECOVERY/_apk"

          python3 - "$GITHUB_WORKSPACE" "$RECOVERY" "$RESTORED" "$MAPPING" <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])
          recovered = Path(sys.argv[2])
          restored = Path(sys.argv[3])
          generated_mapping = Path(sys.argv[4])
          runtime = workspace / "devirtualizer/runtime/runtime"
          analysis = runtime / "analysis/protected-apk"
          sys.path.insert(0, str(runtime))
          sys.path.insert(0, str(analysis))
          import restore_nmmp_termux as pipeline

          dex_root = recovered / "_apk"
          dexes = pipeline.dex_paths(dex_root)
          probe = recovered / "probe_smali"
          probe.mkdir(parents=True, exist_ok=True)
          for dex in dexes:
              pipeline.disassemble(dex, probe / dex.stem)

          targets_path = recovered / "native_targets.json"
          target_count = pipeline.discover_native_targets(
              dex_root, dexes, probe, targets_path
          )
          pipeline.align_recovered_methods(recovered, targets_path)

          mapping_path = recovered / "handler_mapping_generated.json"
          shutil.copy2(generated_mapping, mapping_path)
          native_so = recovered / "_apk/lib/arm64-v8a/libnmmp.so"
          if not native_so.is_file():
              raise RuntimeError(
                  "recovery did not extract lib/arm64-v8a/libnmmp.so"
              )

          restored.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable,
              str(analysis / "restore_dex.py"),
              "--dex-dir", str(dex_root),
              "--targets", str(targets_path),
              "--json", str(recovered / "recovered_methods.json"),
              "--native-so", str(native_so),
              "--mapping", str(mapping_path),
              "--out", str(restored),
          ]
          subprocess.run(command, check=True)

          report_path = restored / "restore_report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("methods_skipped") != 0:
              raise RuntimeError(
                  "strict DEX restoration skipped methods: "
                  + json.dumps(report.get("skipped_methods", []))
              )
          if report.get("methods_restored") != target_count:
              raise RuntimeError(
                  "strict DEX restoration count mismatch: "
                  f"restored={report.get('methods_restored')} "
                  f"targets={target_count}"
              )

          validation = recovered / "strict_validation"
          validation.mkdir(parents=True, exist_ok=True)
          for dex in dexes:
              restored_dex = restored / dex.name
              if not restored_dex.is_file():
                  raise RuntimeError(
                      f"restorer omitted expected output {restored_dex.name}"
                  )
              pipeline.disassemble(restored_dex, validation / dex.stem)
          pipeline.validate_smali(validation)

          # Preserve the original extracted DEX files and prove that the
          # restorer wrote a separate output tree.
          if any(
              (restored / dex.name).resolve() == dex.resolve()
              for dex in dexes
          ):
              raise RuntimeError("restorer output aliases an original DEX")
          (recovered / "strict_validation.json").write_text(
              json.dumps({
                  "generated_mapping": str(generated_mapping),
                  "targets": target_count,
                  "methods_restored": report["methods_restored"],
                  "methods_skipped": report["methods_skipped"],
                  "validated_dexes": sorted(dex.name for dex in dexes),
                  "originals_untouched": True,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "Strict static DEX validation passed:",
              report["methods_restored"], "methods",
          )
          PY

          mkdir -p nmmp-debug/protected/restored
          cp -a "$RESTORED/." nmmp-debug/protected/restored/
          cp "$RECOVERY/strict_validation.json" \
            nmmp-debug/protected/strict_validation.json
          echo "RESTORED_DEX_DIR=nmmp-debug/protected/restored" >> "$GITHUB_ENV"

      - name: Collect APK and DEX evidence
        run: |
          set -euo pipefail
          for kind in input protected; do
            if [ "$kind" = input ]; then
              APK="$GITHUB_WORKSPACE/$APK_PATH"
            else
              APK="$GITHUB_WORKSPACE/$PROTECTED_APK"
            fi
            entries="nmmp-debug/$kind/zip_entries.txt"
            mkdir -p "nmmp-debug/$kind/dex"
            unzip -Z1 "$APK" | sort > "$entries"

            {
              echo "=== $kind APK ==="
              file "$APK"
              sha256sum "$APK"
              stat -c 'bytes=%s' "$APK"
              echo
              echo "=== ZIP entries ==="
              cat "$entries"
            } > "nmmp-debug/$kind/apk.txt"

            while IFS= read -r dex; do
              name=$(basename "$dex")
              unzip -p "$APK" "$dex" | sha256sum \
                > "nmmp-debug/$kind/dex/${name}.sha256"
            done < <(grep -E '^classes([0-9]+)?\.dex$' "$entries" || true)
          done

      - name: Collect native ELF and dispatch evidence
        run: |
          set -euo pipefail
          rm -rf extracted/native
          mkdir -p nmmp-debug/protected/native
          APK="$GITHUB_WORKSPACE/$PROTECTED_APK"
          unzip -q -o "$APK" 'lib/*/*.so' -d extracted/native || true

          find extracted/native -type f -name '*.so' -print0 |
          while IFS= read -r -d '' so; do
            rel=${so#extracted/native/}
            safe=$(printf '%s' "$rel" | tr '/ ' '__')
            {
              echo "=== $rel ==="
              file "$so"
              sha256sum "$so"
              echo
              echo "--- ELF header ---"
              readelf -h "$so" || true
              echo
              echo "--- sections ---"
              readelf -S --wide "$so" || true
              echo
              echo "--- dynamic symbols ---"
              readelf -Ws "$so" || true
              echo
              echo "--- relocations ---"
              readelf -r --wide "$so" || true
              echo
              echo "--- NMMP strings ---"
              strings -a "$so" |
                grep -Ei 'nmmp|nmmvm|vmInterpret|cacheInitial|gVm|resolver|opcode' ||
                true
            } > "nmmp-debug/protected/native/${safe}.txt"
          done

          python3 - "$GITHUB_WORKSPACE/extracted/native" \
            "$GITHUB_WORKSPACE/nmmp-debug/protected/dispatch_tables.json" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          relative = re.compile(
              r"^\s*([0-9a-fA-F]+)\s+\S+\s+R_AARCH64_RELATIVE\s+"
              r"([0-9a-fA-F]+)"
          )
          result = {}

          for so in sorted(root.rglob("*.so")):
              try:
                  text = subprocess.check_output(
                      ["readelf", "-r", "--wide", str(so)],
                      text=True,
                      stderr=subprocess.STDOUT,
                  )
              except subprocess.CalledProcessError as exc:
                  result[str(so.relative_to(root))] = {"error": exc.output}
                  continue

              relocations = {}
              for line in text.splitlines():
                  match = relative.match(line)
                  if match:
                      relocations[int(match.group(1), 16)] = int(
                          match.group(2), 16
                      )

              tables = []
              for base in sorted(relocations):
                  window = [base + 8 * index for index in range(256)]
                  if all(location in relocations for location in window):
                      tables.append({
                          "file_offset_or_vaddr": f"0x{base:x}",
                          "entries": [
                              {
                                  "encoded_byte": index,
                                  "native_target_addend":
                                      f"0x{relocations[base + 8 * index]:x}",
                              }
                              for index in range(256)
                          ],
                      })

              result[str(so.relative_to(root))] = {
                  "relative_relocation_count": len(relocations),
                  "complete_256_entry_tables": tables,
                  "interpretation":
                      "Targets identify native handlers only; they are not "
                      "DEX opcode assignments.",
              }

          output.write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Write analysis summary
        run: |
          set -euo pipefail
          {
            echo "# NMMP debug summary"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Input asset ID: \`${{ inputs.asset_id }}\`"
            echo "- Class rules: \`${RULES_PATH:-none}\`"
            echo "- Protected APK: \`${PROTECTED_APK}\`"
            echo
            echo "## Files"
            find nmmp-debug -type f -printf '%p\n' | sort
            echo
            echo "## Dispatch tables"
            python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("nmmp-debug/protected/dispatch_tables.json").read_text()
          )
          for name, item in data.items():
              tables = item.get("complete_256_entry_tables", [])
              print(f"- {name}: {len(tables)} complete 256-entry table(s)")
          PY
            echo
            echo "A dispatch table maps encoded bytes to native handler targets."
            echo "It does not by itself prove the original DEX opcode."
            echo
            echo "## Generated permutation"
            python3 - <<'PY'
          import json
          from pathlib import Path

          permutation = json.loads(
              Path("nmmp-debug/protected/opcode_permutation.json").read_text()
          )
          source = permutation["source"]
          print(f"- Source: {source['path']}")
          print(f"- Symbol: {source.get('symbol') or source.get('label') or '<json>'}")
          print(f"- Direction: {source['direction']}")
          print(
              "- Validation: "
              f"{permutation['validation']['entry_count']} entries, "
              "bijection, NOP and DEX 039 holes fixed"
          )
          print(
              "- Restorer handoff: "
              "nmmp-debug/protected/handler_mapping_generated.json"
          )
          PY
          } > nmmp-debug/summary.md

      - name: Upload static debug bundle
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nmmp-debug-static-${{ inputs.job_id }}
          path: nmmp-debug/
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Optional Android runtime smoke trace
    if: ${{ inputs.run_emulator }}
    needs: static-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Download protected debug bundle
        uses: actions/download-artifact@v4
        with:
          name: nmmp-debug-static-${{ inputs.job_id }}
          path: debug-input

      - name: Prepare protected APK
        run: |
          set -euo pipefail
          test -s debug-input/protected/protected.apk
          cp debug-input/protected/protected.apk analysis.apk

      - name: Boot emulator and collect runtime logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.emulator_api }}
          arch: x86_64
          target: default
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          disable-spellchecker: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            mkdir -p emulator-debug
            adb devices -l | tee emulator-debug/devices.txt
            adb shell getprop | sort > emulator-debug/getprop.txt
            adb install -r analysis.apk 2>&1 |
              tee emulator-debug/install.txt || true

            if [ -n "${{ inputs.package_name }}" ]; then
              adb shell monkey -p "${{ inputs.package_name }}" 1 \
                2>&1 | tee emulator-debug/launch.txt || true
            else
              echo "No package_name supplied; launch was skipped." \
                | tee emulator-debug/launch.txt
            fi

            sleep 8
            adb logcat -d -v threadtime > emulator-debug/logcat.txt || true
            adb shell dumpsys package "${{ inputs.package_name }}" \
              > emulator-debug/package.txt 2>&1 || true

      - name: Upload emulator debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: nmmp-debug-emulator-${{ inputs.job_id }}
          path: emulator-debug/
          if-no-files-found: warn
          retention-days: 7
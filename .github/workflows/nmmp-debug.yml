name: NMMP Debug Trace

# This workflow is intentionally separate from vm-protect.yml.
# It runs a separate protection copy, preserves the fresh input and protected
# output, and never replaces or uploads the normal protection result.
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: "Release asset ID containing the APK or APK bundle"
        required: false
        default: ""
        type: string
      source_url:
        description: "Direct APK URL for a one-off protected-input test"
        required: false
        default: ""
        type: string
      job_id:
        description: "Unique ID used for the debug artifact name"
        required: true
        type: string
      run_emulator:
        description: "Boot an Android emulator and collect a smoke log"
        required: false
        default: false
        type: boolean
      already_protected:
        description: "Treat the input asset as an already-protected NMMP APK"
        required: false
        default: false
        type: boolean
      package_name:
        description: "Optional package name to launch in the emulator"
        required: false
        default: ""
        type: string
      emulator_api:
        description: "Android API level for the optional emulator"
        required: false
        default: "30"
        type: string

jobs:
  static-debug:
    name: Static NMMP evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout static recovery tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download static recovery tool bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle_name="nmmp-devirtualizer-tools-boundary-closure.zip"
          release_json=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/analyze-queue")
          bundle_url=$(printf '%s' "$release_json" |
            jq -r --arg name "$bundle_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' |
            head -1)
          if [ -z "$bundle_url" ] || [ "$bundle_url" = "null" ]; then
            echo "ERROR: missing $bundle_name on the analyze-queue release"
            exit 1
          fi
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            "$bundle_url" -o "$bundle_name"
          test -s "$bundle_name"
          override_dir="$RUNNER_TEMP/nmmp-repository-overrides"
          mkdir -p "$override_dir"
          for relative in \
            devirtualizer/runtime/runtime/analysis/protected-apk/solve_opcode_formats.py \
            devirtualizer/runtime/runtime/analysis/protected-apk/read_armv7_dispatch.py
          do
            test -f "$relative"
            cp "$relative" "$override_dir/$(basename "$relative")"
          done
          unzip -q -o "$bundle_name"
          for relative in \
            devirtualizer/runtime/runtime/analysis/protected-apk/solve_opcode_formats.py \
            devirtualizer/runtime/runtime/analysis/protected-apk/read_armv7_dispatch.py
          do
            mkdir -p "$(dirname "$relative")"
            cp "$override_dir/$(basename "$relative")" "$relative"
          done
          test -f devirtualizer/runtime/runtime/analysis/protected-apk/recover_nmmp.py
          test -f devirtualizer/runtime/runtime/analysis/protected-apk/restore_dex.py
          sha256sum "$bundle_name"

      - name: Normalize radare2 wrapper discovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "devirtualizer/runtime/runtime/analysis/protected-apk/"
              "recover_nmmp.py"
          )
          text = path.read_text(encoding="utf-8")
          old = '''    xrefs = r2_json(so, "aaa; axtj @ sym.imp.vmInterpret")
              wrappers = sorted({int(x["fcn_addr"]) for x in xrefs if x.get("fcn_addr")})
          '''
          new = '''    xrefs = []
              for import_name in ("sym.imp.vmInterpret", "imp.vmInterpret"):
                  try:
                      xrefs.extend(r2_json(so, f"aaa; axtj @ {import_name}"))
                  except (RuntimeError, ValueError, KeyError):
                      pass
              try:
                  symbols = r2_json(so, "aaa; isj")
              except (RuntimeError, ValueError, KeyError):
                  symbols = []
              for symbol in symbols:
                  name = str(symbol.get("name", ""))
                  if not name.endswith("vmInterpret"):
                      continue
                  address = symbol.get("vaddr") or symbol.get("paddr")
                  if not address:
                      continue
                  try:
                      xrefs.extend(r2_json(
                          so, f"aaa; axtj @ 0x{int(address):x}"
                      ))
                  except (RuntimeError, ValueError, KeyError):
                      pass
              # Older radare2 builds may emit no xref at all for an
              # unresolved AArch64 import.  Derive the PLT target from the
              # relocation order and scan the text for BL instructions.
              try:
                  relocations = run(["readelf", "-r", "--wide", str(so)])
                  plt_index = 0
                  vm_plt = None
                  for line in relocations.splitlines():
                      if "R_AARCH64_JUMP_SLOT" not in line:
                          continue
                      if "vmInterpret" in line:
                          vm_plt = sections[".plt"][0] + 0x20 + plt_index * 0x10
                          break
                      plt_index += 1
                  if vm_plt is not None:
                      text_addr, text_offset, text_size = sections[".text"]
                      raw_text = so.read_bytes()
                      for offset in range(0, text_size, 4):
                          word = int.from_bytes(
                              raw_text[text_offset + offset:text_offset + offset + 4],
                              "little",
                          )
                          if word & 0xfc000000 != 0x94000000:
                              continue
                          immediate = word & 0x03ffffff
                          if immediate & 0x02000000:
                              immediate -= 0x04000000
                          target = text_addr + offset + (immediate << 2)
                          if target == vm_plt:
                              call_address = text_addr + offset
                              xrefs.append({"from": call_address})
                              for function_offset in range(offset, -1, -4):
                                  function_word = int.from_bytes(
                                      raw_text[
                                          text_offset + function_offset:
                                          text_offset + function_offset + 4
                                      ],
                                      "little",
                                  )
                                  # sub sp, sp, #imm is the first
                                  # instruction of both generated wrapper
                                  # shapes in this AArch64 build.
                                  if (
                                      function_word & 0xffc003ff
                                      == 0xd10003ff
                                  ):
                                      xrefs.append({
                                          "fcn_addr": text_addr + function_offset
                                      })
                                      break
              except (OSError, RuntimeError, KeyError, ValueError):
                  pass
              wrapper_addresses = set()
              for xref in xrefs:
                  function_addr = xref.get("fcn_addr")
                  if function_addr:
                      wrapper_addresses.add(int(function_addr))
                      continue
                  call_addr = xref.get("from")
                  if not call_addr:
                      continue
                  try:
                      owners = r2_json(so, f"aaa; afij @ 0x{int(call_addr):x}")
                  except (RuntimeError, ValueError, KeyError):
                      continue
                  for owner in owners:
                      offset = owner.get("offset")
                      if offset:
                          wrapper_addresses.add(int(offset))
              wrappers = sorted(wrapper_addresses)
          '''
          if old not in text:
              raise SystemExit("recover_nmmp.py wrapper discovery block not found")
          text = text.replace(old, new, 1)
          records_old = (
              '    records = native_records(so, sections, set(wrappers))\n'
          )
          records_new = records_old + '''    if not wrappers:
                  wrappers = sorted({
                      int(record["wrapper"])
                      for record in records
                      if record.get("wrapper")
                  })
          '''
          if records_old not in text:
              raise SystemExit("recover_nmmp.py JNI record block not found")
          text = text.replace(records_old, records_new, 1)
          json_old = '''def r2_json(so: Path, command: str):
              out = run(["r2", "-e", "bin.relocs.apply=true", "-q",
                         "-c", f"{command}; q", str(so)])
              return json.loads(out)
          '''
          json_new = '''def r2_json(so: Path, command: str):
              out = run(["r2", "-e", "bin.relocs.apply=true", "-q",
                         "-c", f"{command}; q", str(so)])
              try:
                  return json.loads(out)
              except json.JSONDecodeError:
                  decoder = json.JSONDecoder()
                  for start, marker in enumerate(out):
                      if marker not in "[{":
                          continue
                      try:
                          value, _ = decoder.raw_decode(out[start:])
                      except json.JSONDecodeError:
                          continue
                      if isinstance(value, (list, dict)):
                          return value
                  raise
          '''
          if json_old not in text:
              raise SystemExit("recover_nmmp.py r2_json block not found")
          text = text.replace(json_old, json_new, 1)
          pdf_old = '''    doc = r2_json(so, f"aaa; pdfj @ 0x{function_addr:x}")
              ops = doc.get("ops", [])
          '''
          pdf_new = '''    doc = r2_json(so, f"aaa; pdj 256 @ 0x{function_addr:x}")
              ops = doc.get("ops", []) if isinstance(doc, dict) else doc
          '''
          if pdf_old not in text:
              raise SystemExit("recover_nmmp.py pdfj block not found")
          text = text.replace(pdf_old, pdf_new, 1)
          metadata_old = '''        m = re.search(r"mov w([0-9]+), (0x[0-9a-f]+|[0-9]+)", d)
                  if not m:
                      continue
                  reg = m.group(1)
                  value = int(m.group(2), 0)
                  if value > 0x10000:
                      continue
                  following = " ".join(x.get("disasm", "") for x in ops[i + 1:i + 16])
          '''
          metadata_new = '''        m = re.search(
                      r"(?:mov|movz) w([0-9]+), (0x[0-9a-f]+|[0-9]+)",
                      d,
                  )
                  if not m:
                      continue
                  reg = m.group(1)
                  value = int(m.group(2), 0)
                  if value > 0x10000:
                      continue
                  following = " ".join(
                      x.get("disasm", "") for x in ops[i + 1:call_i]
                  )
          '''
          if metadata_old not in text:
              raise SystemExit("recover_nmmp.py metadata proof block not found")
          text = text.replace(metadata_old, metadata_new, 1)
          loop_old = '''    for addr in wrappers:
                  item = recover_wrapper(so, addr, sections) or {}
                  item["registrations"] = by_wrapper.get(addr, [])
          '''
          loop_new = '''    for addr in wrappers:
                  item = recover_wrapper(so, addr, sections)
                  if not item:
                      continue
                  instruction_address = item.get("insns_address")
                  if instruction_address is not None:
                      instruction_address = int(instruction_address, 16)
                      text_address, _, text_size = sections[".text"]
                      if text_address <= instruction_address < text_address + text_size:
                          continue
                  item["registrations"] = by_wrapper.get(addr, [])
          '''
          if loop_old not in text:
              raise SystemExit("recover_nmmp.py wrapper loop block not found")
          path.write_text(text.replace(loop_old, loop_new, 1), encoding="utf-8")
          PY

      - name: Download release asset
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_URL" ]; then
            curl -fsSL -L "$SOURCE_URL" -o input_asset
          else
            test -n "$ASSET_ID"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "${{ github.api_url }}/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
              -o input_asset
          fi
          test -s input_asset
          sha256sum input_asset | tee input_asset.sha256
          file input_asset

      - name: Install protection and static-analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils file unzip python3 openjdk-17-jdk wget ninja-build radare2

      - name: Extract APK without modifying the input
        run: |
          set -euo pipefail
          mkdir -p extracted
          if zipinfo -1 input_asset 2>/dev/null | grep -Eiq '\.apk$'; then
            unzip -q -o input_asset -d extracted
          else
            cp input_asset extracted/input.apk
          fi

          APK=$(find extracted -type f -iname '*.apk' -print -quit)
          test -n "$APK"
          if [ "$APK" != "extracted/input.apk" ]; then
            cp "$APK" extracted/input.apk
          fi
          RULES=$(find extracted -type f -name 'rules.txt' -print -quit || true)
          MAPPING=$(find extracted -type f -name 'mapping.txt' -print -quit || true)
          echo "APK_PATH=extracted/input.apk" >> "$GITHUB_ENV"
          echo "RULES_PATH=$RULES" >> "$GITHUB_ENV"
          echo "MAPPING_PATH=$MAPPING" >> "$GITHUB_ENV"
          echo "APK path: $APK"
          unzip -Z1 "$APK" | sort > debug_zip_entries.txt

      - name: Prepare NMMP toolchain
        if: ${{ !inputs.already_protected }}
        run: |
          set -euo pipefail
          if [ ! -f cmake-standalone/bin/cmake ]; then
            curl -fsSL \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt/cmake-3.28.3-linux-x86_64.tar.gz" \
              -o cmake.tar.gz
            mkdir -p cmake-standalone
            tar -xzf cmake.tar.gz -C cmake-standalone --strip-components=1
            rm -f cmake.tar.gz
          fi
          chmod +x cmake-standalone/bin/cmake
          if [ ! -x cmake-standalone/bin/ninja ]; then
            cp "$(command -v ninja)" cmake-standalone/bin/ninja
            chmod +x cmake-standalone/bin/ninja
          fi

          if [ ! -d android-ndk-r27c ]; then
            curl -fsSL \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt/android-ndk-r27c-linux.zip" \
              -o android-ndk.zip
            unzip -q android-ndk.zip
            rm -f android-ndk.zip
          fi

          if [ ! -s vm-protect.jar ]; then
            curl -fsSL \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt/vm-protect-2023-07-08-0942.jar" \
              -o vm-protect.jar
          fi
          test -s vm-protect.jar

          mkdir -p tools
          cat > tools/config.json <<EOF
          {
            "abi": {
              "armeabi-v7a": true,
              "arm64-v8a": true,
              "x86": false,
              "x86_64": true
            },
            "environment": {
              "sdk_path": "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}",
              "cmake_path": "$GITHUB_WORKSPACE/cmake-standalone",
              "ndk_path": "$GITHUB_WORKSPACE/android-ndk-r27c",
              "ndk_toolchains": "/toolchains/llvm/prebuilt/",
              "ndk_abi": "linux-x86_64",
              "ndk_strip": "/bin/llvm-strip"
            }
          }
          EOF

          echo "CMAKE_PATH=$GITHUB_WORKSPACE/cmake-standalone" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" \
            >> "$GITHUB_ENV"

      - name: Run NMMP protection with supplied class rules
        if: ${{ !inputs.already_protected }}
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/$APK_PATH"
          JAR="$GITHUB_WORKSPACE/vm-protect.jar"
          ARGS=(java -jar "$JAR" apk "$APK")
          if [ -n "${RULES_PATH:-}" ]; then
            ARGS+=("$GITHUB_WORKSPACE/$RULES_PATH")
            echo "Using class rules: $RULES_PATH"
          else
            echo "No rules.txt supplied; using NMMP defaults."
          fi
          if [ -n "${MAPPING_PATH:-}" ]; then
            ARGS+=("$GITHUB_WORKSPACE/$MAPPING_PATH")
            echo "Using mapping: $MAPPING_PATH"
          fi

          export ANDROID_NDK_HOME CMAKE_PATH
          printf 'Protection command:'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          "${ARGS[@]}" 2>&1 | tee nmmp-protect.log
          exit "${PIPESTATUS[0]}"

      - name: Preserve input and protected APKs
        run: |
          set -euo pipefail
          mkdir -p nmmp-debug/input nmmp-debug/protected
          cp "$GITHUB_WORKSPACE/$APK_PATH" nmmp-debug/input/input.apk
          if [ "${{ inputs.already_protected }}" = "true" ]; then
            PROTECTED="$GITHUB_WORKSPACE/$APK_PATH"
          else
            find . -type f -iname '*protect*.apk' -not -path './nmmp-debug/*' \
              -print | head -1 > protected_path.txt
            PROTECTED=$(cat protected_path.txt)
          fi
          if [ -z "$PROTECTED" ]; then
            echo "Protected APK was not produced."
            find . -type f -iname '*.apk' -print
            exit 1
          fi
          cp "$PROTECTED" nmmp-debug/protected/protected.apk
          echo "PROTECTED_APK=nmmp-debug/protected/protected.apk" >> "$GITHUB_ENV"
          sha256sum nmmp-debug/input/input.apk \
            nmmp-debug/protected/protected.apk \
            | tee nmmp-debug/apk-hashes.txt
          if [ -f nmmp-protect.log ]; then
            cp nmmp-protect.log nmmp-debug/nmmp-protect.log
          else
            printf 'Input was already protected; no local protection log.\\n' \
              > nmmp-debug/nmmp-protect.log
          fi
          if [ -n "${RULES_PATH:-}" ]; then
            cp "$RULES_PATH" nmmp-debug/input/rules.txt
          fi
          if [ -n "${MAPPING_PATH:-}" ]; then
            cp "$MAPPING_PATH" nmmp-debug/input/mapping.txt
          fi

      - name: Collect ARMv7 dispatch evidence
        run: |
          set -euo pipefail
          rm -rf protected-armv7
          mkdir -p protected-armv7 nmmp-debug/protected
          unzip -q -o "$GITHUB_WORKSPACE/$PROTECTED_APK" \
            'lib/*/*.so' -d protected-armv7 || true
          python3 \
            devirtualizer/runtime/runtime/analysis/protected-apk/read_armv7_dispatch.py \
            --root protected-armv7 \
            --out "$GITHUB_WORKSPACE/nmmp-debug/protected/armv7_dispatch_tables.json"
          cat "$GITHUB_WORKSPACE/nmmp-debug/protected/armv7_dispatch_tables.json"

      - name: Preserve generated dex2c mapping evidence
        if: ${{ !inputs.already_protected }}
        run: |
          set -euo pipefail
          DEX2C="$GITHUB_WORKSPACE/extracted/build/dex2c"
          if [ ! -d "$DEX2C" ]; then
            echo "ERROR: protector did not leave extracted/build/dex2c"
            echo "Generated build directories found:"
            find "$GITHUB_WORKSPACE/extracted" -type d -path '*/build/*' \
              -print | sort || true
            echo "Top-level generated files:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f \
              -print | sort | head -200 || true
            exit 1
          fi

          mkdir -p nmmp-debug/protected/generated
          cp -a "$DEX2C" nmmp-debug/protected/generated/dex2c
          find nmmp-debug/protected/generated/dex2c -type f -print0 |
            sort -z |
            while IFS= read -r -d '' file; do
              sha256sum "$file"
            done > nmmp-debug/protected/generated/dex2c.sha256

          echo "DEX2C_ROOT=$DEX2C" >> "$GITHUB_ENV"
          echo "Generated dex2c files preserved:"
          find nmmp-debug/protected/generated/dex2c -type f -print | sort

      - name: Extract exact generated opcode permutation
        run: |
          set -euo pipefail
          if [ "${{ inputs.already_protected }}" = "true" ]; then
            mkdir -p nmmp-debug/protected
            rm -rf protected-lib
            mkdir -p protected-lib
            unzip -q -o "$GITHUB_WORKSPACE/$PROTECTED_APK" \
              'lib/arm64-v8a/libnmmvm.so' -d protected-lib
            python3 devirtualizer/runtime/runtime/analysis/protected-apk/map_vm_opcodes.py \
              devirtualizer/runtime/runtime/reference_vm/libnmmvm.so \
              protected-lib/lib/arm64-v8a/libnmmvm.so \
              --reference-table auto \
              --protected-table auto \
              --out "$GITHUB_WORKSPACE/nmmp-debug/protected/handler_mapping_generated.json"
            echo "OPCODE_PERMUTATION_JSON=" >> "$GITHUB_ENV"
            echo "GENERATED_MAPPING_JSON=nmmp-debug/protected/handler_mapping_generated.json" \
              >> "$GITHUB_ENV"
            echo "Static native mapping recovered for already-protected APK."
            exit 0
          fi
          python3 - "$DEX2C_ROOT" \
            "$GITHUB_WORKSPACE/nmmp-debug/protected/opcode_permutation.json" \
            "$GITHUB_WORKSPACE/nmmp-debug/protected/handler_mapping_generated.json" <<'PY'
          import ast
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          permutation_output = Path(sys.argv[2])
          mapping_output = Path(sys.argv[3])

          # RandomInstructionRewriter preserves NOP and the unused DEX 039
          # holes.  A generated candidate that violates this is not NMMP's
          # opcode permutation, even if it happens to contain 256 integers.
          valid_slots = {
              value for value in range(1, 256)
              if value <= 0x3D or 0x44 <= value <= 0x78
              or 0x7B <= value <= 0xF2 or 0xFA <= value <= 0xFF
          }
          fixed_slots = {0} | (set(range(256)) - valid_slots - {0})
          integer = re.compile(r"(?<![A-Za-z0-9_])(?:0[xX][0-9A-Fa-f]+|[0-9]+)(?![A-Za-z0-9_])")
          declaration = re.compile(
              r"(?P<kind>\b(?:const|static|constexpr|unsigned|uint8_t|"
              r"uint16_t|uint32_t|int|short|char)\b[^;=\n]{0,160}?)"
              r"(?P<name>[A-Za-z_][A-Za-z0-9_]*)\s*"
              r"(?:\[\s*(?:256)?\s*\])?\s*=\s*\{(?P<body>.*?)\}",
              re.IGNORECASE | re.DOTALL,
          )
          opcode_enum = re.compile(
              r"\benum\s+Opcode\s*\{(?P<body>.*?)\};",
              re.IGNORECASE | re.DOTALL,
          )
          enum_entry = re.compile(
              r"^\s*(?P<name>OP_[A-Z0-9_]+)\s*=\s*"
              r"(?P<value>0[xX][0-9A-Fa-f]+|[0-9]+)\s*,?",
              re.MULTILINE,
          )

          def valid(values):
              return (
                  len(values) == 256
                  and sorted(values) == list(range(256))
                  and values[0] == 0
                  and all(
                      (index in valid_slots) == (value in valid_slots)
                      for index, value in enumerate(values)
                  )
                  and all(
                      values[index] == index
                      for index in fixed_slots
                  )
              )

          def numbers(text):
              # Remove comments before parsing arrays, but retain all literals
              # in the initializer. ast.literal_eval handles JSON/Python-like
              # generated arrays; the regex fallback handles C initializers.
              text = re.sub(r"/\*.*?\*/", " ", text, flags=re.DOTALL)
              text = re.sub(r"//.*?$", " ", text, flags=re.MULTILINE)
              try:
                  value = ast.literal_eval("[" + text + "]")
                  if isinstance(value, list) and all(
                      isinstance(item, int) and not isinstance(item, bool)
                      for item in value
                  ):
                      return value
              except (SyntaxError, ValueError):
                  pass
              return [int(match.group(0), 0) for match in integer.finditer(text)]

          def direction_for(path, symbol, label):
              text = " ".join((str(path), symbol, label)).lower()
              if re.search(
                  r"encoded[_-]?to[_-]?(standard|dex)|decode|inverse|"
                  r"vm[_-]?to[_-]?(dex|standard)",
                  text,
              ):
                  return "encoded_to_standard"
              if re.search(
                  r"standard[_-]?to[_-]?(encoded|vm)|encode|"
                  r"dex[_-]?to[_-]?vm|randomized|permutation",
                  text,
              ):
                  return "standard_to_encoded"
              return None

          candidates = []

          def add_candidate(path, symbol, values, label, source_kind):
              if not valid(values):
                  return
              direction = direction_for(path.relative_to(root), symbol, label)
              if direction is None:
                  return
              candidates.append({
                  "path": str(path.relative_to(root)),
                  "symbol": symbol or None,
                  "label": label or None,
                  "direction": direction,
                  "values": values,
                  "source_kind": source_kind,
              })

          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.stat().st_size > 4 * 1024 * 1024:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              # Prefer an explicitly named JSON field when the generated
              # build emits JSON metadata.
              try:
                  document = json.loads(text)
              except (json.JSONDecodeError, ValueError):
                  document = None
              if document is not None:
                  stack = [("", document)]
                  while stack:
                      label, value = stack.pop()
                      if isinstance(value, dict):
                          for key, child in value.items():
                              stack.append((str(key), child))
                      elif (
                          isinstance(value, list)
                          and all(isinstance(item, int) for item in value)
                      ):
                          add_candidate(
                              path, "", value, label, "json"
                          )

              for match in declaration.finditer(text):
                  symbol = match.group("name")
                  label = match.group("kind")
                  values = numbers(match.group("body"))
                  add_candidate(path, symbol, values, label, "c_initializer")

              # The protector's generated DexOpcodes.h keeps the canonical
              # OP_* declaration order and randomizes the assigned enum
              # values.  That enum is the exact standard-opcode -> encoded
              # permutation; it is not inferred from native handlers.
              for match in opcode_enum.finditer(text):
                  entries = [
                      (item.group("name"), int(item.group("value"), 0))
                      for item in enum_entry.finditer(match.group("body"))
                  ]
                  if len(entries) != 256:
                      continue
                  # The generated tree is intentionally self-contained.  Keep
                  # the canonical DEX 039 name order here because the
                  # repository's development sources are not required to be
                  # present on the protection runner.
                  canonical_names = " ".join([
                      'OP_NOP OP_MOVE OP_MOVE_FROM16 OP_MOVE_16 OP_MOVE_WIDE OP_MOVE_WIDE_FROM16 OP_MOVE_WIDE_16 OP_MOVE_OBJECT'
                      'OP_MOVE_OBJECT_FROM16 OP_MOVE_OBJECT_16 OP_MOVE_RESULT OP_MOVE_RESULT_WIDE OP_MOVE_RESULT_OBJECT OP_MOVE_EXCEPTION OP_RETURN_VOID OP_RETURN'
                      'OP_RETURN_WIDE OP_RETURN_OBJECT OP_CONST_4 OP_CONST_16 OP_CONST OP_CONST_HIGH16 OP_CONST_WIDE_16 OP_CONST_WIDE_32'
                      'OP_CONST_WIDE OP_CONST_WIDE_HIGH16 OP_CONST_STRING OP_CONST_STRING_JUMBO OP_CONST_CLASS OP_MONITOR_ENTER OP_MONITOR_EXIT OP_CHECK_CAST'
                      'OP_INSTANCE_OF OP_ARRAY_LENGTH OP_NEW_INSTANCE OP_NEW_ARRAY OP_FILLED_NEW_ARRAY OP_FILLED_NEW_ARRAY_RANGE OP_FILL_ARRAY_DATA OP_THROW'
                      'OP_GOTO OP_GOTO_16 OP_GOTO_32 OP_PACKED_SWITCH OP_SPARSE_SWITCH OP_CMPL_FLOAT OP_CMPG_FLOAT OP_CMPL_DOUBLE'
                      'OP_CMPG_DOUBLE OP_CMP_LONG OP_IF_EQ OP_IF_NE OP_IF_LT OP_IF_GE OP_IF_GT OP_IF_LE'
                      'OP_IF_EQZ OP_IF_NEZ OP_IF_LTZ OP_IF_GEZ OP_IF_GTZ OP_IF_LEZ OP_UNUSED_3E OP_UNUSED_3F'
                      'OP_UNUSED_40 OP_UNUSED_41 OP_UNUSED_42 OP_UNUSED_43 OP_AGET OP_AGET_WIDE OP_AGET_OBJECT OP_AGET_BOOLEAN'
                      'OP_AGET_BYTE OP_AGET_CHAR OP_AGET_SHORT OP_APUT OP_APUT_WIDE OP_APUT_OBJECT OP_APUT_BOOLEAN OP_APUT_BYTE'
                      'OP_APUT_CHAR OP_APUT_SHORT OP_IGET OP_IGET_WIDE OP_IGET_OBJECT OP_IGET_BOOLEAN OP_IGET_BYTE OP_IGET_CHAR'
                      'OP_IGET_SHORT OP_IPUT OP_IPUT_WIDE OP_IPUT_OBJECT OP_IPUT_BOOLEAN OP_IPUT_BYTE OP_IPUT_CHAR OP_IPUT_SHORT'
                      'OP_SGET OP_SGET_WIDE OP_SGET_OBJECT OP_SGET_BOOLEAN OP_SGET_BYTE OP_SGET_CHAR OP_SGET_SHORT OP_SPUT'
                      'OP_SPUT_WIDE OP_SPUT_OBJECT OP_SPUT_BOOLEAN OP_SPUT_BYTE OP_SPUT_CHAR OP_SPUT_SHORT OP_INVOKE_VIRTUAL OP_INVOKE_SUPER'
                      'OP_INVOKE_DIRECT OP_INVOKE_STATIC OP_INVOKE_INTERFACE OP_RETURN_VOID_NO_BARRIER OP_INVOKE_VIRTUAL_RANGE OP_INVOKE_SUPER_RANGE OP_INVOKE_DIRECT_RANGE OP_INVOKE_STATIC_RANGE'
                      'OP_INVOKE_INTERFACE_RANGE OP_UNUSED_79 OP_UNUSED_7A OP_NEG_INT OP_NOT_INT OP_NEG_LONG OP_NOT_LONG OP_NEG_FLOAT'
                      'OP_NEG_DOUBLE OP_INT_TO_LONG OP_INT_TO_FLOAT OP_INT_TO_DOUBLE OP_LONG_TO_INT OP_LONG_TO_FLOAT OP_LONG_TO_DOUBLE OP_FLOAT_TO_INT'
                      'OP_FLOAT_TO_LONG OP_FLOAT_TO_DOUBLE OP_DOUBLE_TO_INT OP_DOUBLE_TO_LONG OP_DOUBLE_TO_FLOAT OP_INT_TO_BYTE OP_INT_TO_CHAR OP_INT_TO_SHORT'
                      'OP_ADD_INT OP_SUB_INT OP_MUL_INT OP_DIV_INT OP_REM_INT OP_AND_INT OP_OR_INT OP_XOR_INT'
                      'OP_SHL_INT OP_SHR_INT OP_USHR_INT OP_ADD_LONG OP_SUB_LONG OP_MUL_LONG OP_DIV_LONG OP_REM_LONG'
                      'OP_AND_LONG OP_OR_LONG OP_XOR_LONG OP_SHL_LONG OP_SHR_LONG OP_USHR_LONG OP_ADD_FLOAT OP_SUB_FLOAT'
                      'OP_MUL_FLOAT OP_DIV_FLOAT OP_REM_FLOAT OP_ADD_DOUBLE OP_SUB_DOUBLE OP_MUL_DOUBLE OP_DIV_DOUBLE OP_REM_DOUBLE'
                      'OP_ADD_INT_2ADDR OP_SUB_INT_2ADDR OP_MUL_INT_2ADDR OP_DIV_INT_2ADDR OP_REM_INT_2ADDR OP_AND_INT_2ADDR OP_OR_INT_2ADDR OP_XOR_INT_2ADDR'
                      'OP_SHL_INT_2ADDR OP_SHR_INT_2ADDR OP_USHR_INT_2ADDR OP_ADD_LONG_2ADDR OP_SUB_LONG_2ADDR OP_MUL_LONG_2ADDR OP_DIV_LONG_2ADDR OP_REM_LONG_2ADDR'
                      'OP_AND_LONG_2ADDR OP_OR_LONG_2ADDR OP_XOR_LONG_2ADDR OP_SHL_LONG_2ADDR OP_SHR_LONG_2ADDR OP_USHR_LONG_2ADDR OP_ADD_FLOAT_2ADDR OP_SUB_FLOAT_2ADDR'
                      'OP_MUL_FLOAT_2ADDR OP_DIV_FLOAT_2ADDR OP_REM_FLOAT_2ADDR OP_ADD_DOUBLE_2ADDR OP_SUB_DOUBLE_2ADDR OP_MUL_DOUBLE_2ADDR OP_DIV_DOUBLE_2ADDR OP_REM_DOUBLE_2ADDR'
                      'OP_ADD_INT_LIT16 OP_RSUB_INT OP_MUL_INT_LIT16 OP_DIV_INT_LIT16 OP_REM_INT_LIT16 OP_AND_INT_LIT16 OP_OR_INT_LIT16 OP_XOR_INT_LIT16'
                      'OP_ADD_INT_LIT8 OP_RSUB_INT_LIT8 OP_MUL_INT_LIT8 OP_DIV_INT_LIT8 OP_REM_INT_LIT8 OP_AND_INT_LIT8 OP_OR_INT_LIT8 OP_XOR_INT_LIT8'
                      'OP_SHL_INT_LIT8 OP_SHR_INT_LIT8 OP_USHR_INT_LIT8 OP_IGET_QUICK OP_IGET_WIDE_QUICK OP_IGET_OBJECT_QUICK OP_IPUT_QUICK OP_IPUT_WIDE_QUICK'
                      'OP_IPUT_OBJECT_QUICK OP_INVOKE_VIRTUAL_QUICK OP_INVOKE_VIRTUAL_QUICK_RANGE OP_IPUT_BOOLEAN_QUICK OP_IPUT_BYTE_QUICK OP_IPUT_CHAR_QUICK OP_IPUT_SHORT_QUICK OP_IGET_BOOLEAN_QUICK'
                      'OP_IGET_BYTE_QUICK OP_IGET_CHAR_QUICK OP_IGET_SHORT_QUICK OP_UNUSED_F3 OP_UNUSED_F4 OP_UNUSED_F5 OP_UNUSED_F6 OP_UNUSED_F7'
                      'OP_UNUSED_F8 OP_UNUSED_F9 OP_INVOKE_POLYMORPHIC OP_INVOKE_POLYMORPHIC_RANGE OP_INVOKE_CUSTOM OP_INVOKE_CUSTOM_RANGE OP_CONST_METHOD_HANDLE OP_CONST_METHOD_TYPE'
                  ]).replace("OP_", " OP_").split()
                  generated_names = [name for name, _ in entries]
                  generated_values = [value for _, value in entries]
                  if (
                      len(canonical_names) != 256
                      or set(canonical_names) != set(generated_names)
                      or generated_values != list(range(256))
                  ):
                      continue
                  standard_by_name = {
                      name: standard
                      for standard, name in enumerate(canonical_names)
                  }
                  encoded_to_standard = [
                      standard_by_name[name] for name in generated_names
                  ]
                  add_candidate(
                      path,
                      "Opcode",
                      encoded_to_standard,
                      "encoded_to_standard_opcode_enum",
                      "opcode_enum",
                  )

          # Same values in multiple generated copies are one source candidate;
          # different arrays or directions are ambiguous and must stop the job.
          unique = {}
          for candidate in candidates:
              key = (
                  tuple(candidate["values"]),
                  candidate["direction"],
              )
              unique.setdefault(key, []).append(candidate)
          if len(unique) != 1:
              print("ERROR: could not identify one exact generated NMMP permutation")
              print(f"Validated candidates: {len(candidates)}")
              for items in unique.values():
                  for item in items[:5]:
                      print(
                          f"  {item['path']}:{item['symbol'] or item['label'] or '<json>'} "
                          f"direction={item['direction']}"
                      )
              if not candidates:
                  print(
                      "No direction-labeled 256-entry permutation was found. "
                      "The generated header may use a new symbol name; preserve "
                      "the artifact and update the extractor rather than guessing."
                  )
              raise SystemExit(1)

          candidate_group = next(iter(unique.values()))
          candidate = candidate_group[0]
          raw = candidate["values"]
          if candidate["direction"] == "encoded_to_standard":
              encoded_to_standard = raw
          else:
              encoded_to_standard = [0] * 256
              for standard, encoded in enumerate(raw):
                  encoded_to_standard[encoded] = standard

          if not valid(encoded_to_standard):
              raise SystemExit(
                  "generated permutation inversion failed NMMP DEX 039 validation"
              )

          source_files = sorted(
              {item["path"] for item in candidate_group}
          )
          source = {
              "path": candidate["path"],
              "symbol": candidate["symbol"],
              "label": candidate["label"],
              "direction": candidate["direction"],
              "duplicate_source_files": source_files,
          }
          permutation = {
              "schema": "nmmp-generated-opcode-permutation/v1",
              "dex_version": 39,
              "source": source,
              "opcode_permutation": raw,
              "encoded_to_standard": encoded_to_standard,
              "validation": {
                  "entry_count": 256,
                  "is_bijection": True,
                  "nop_fixed": encoded_to_standard[0] == 0,
                  "dex039_holes_fixed": all(
                      encoded_to_standard[index] == index
                      for index in fixed_slots
                  ),
              },
          }
          permutation_output.write_text(
              json.dumps(permutation, indent=2) + "\n", encoding="utf-8"
          )

          # restore_dex.py consumes encoded-byte -> standard-opcode assignments.
          mapping = {
              "schema": "nmmp-generated-handler-mapping/v1",
              "source_permutation": str(permutation_output.resolve()),
              "protected_table": "generated-permutation",
              "known_assignments": {
                  str(encoded): standard
                  for encoded, standard in enumerate(encoded_to_standard)
              },
              "entries": [
                  {
                      "encoded": f"0x{encoded:02x}",
                      "standard": f"0x{standard:02x}",
                      "confidence": "generated-source-exact",
                  }
                  for encoded, standard in enumerate(encoded_to_standard)
              ],
          }
          mapping_output.write_text(
              json.dumps(mapping, indent=2) + "\n", encoding="utf-8"
          )
          print(
              "Exact generated permutation:",
              candidate["path"],
              candidate["symbol"] or candidate["label"] or "<json>",
              candidate["direction"],
          )
          print("Restorer mapping:", mapping_output)
          PY
          echo "OPCODE_PERMUTATION_JSON=nmmp-debug/protected/opcode_permutation.json" \
            >> "$GITHUB_ENV"
          echo "GENERATED_MAPPING_JSON=nmmp-debug/protected/handler_mapping_generated.json" \
            >> "$GITHUB_ENV"

      - name: Restore DEX with generated permutation
        run: |
          set -euo pipefail
          RECOVERY="$GITHUB_WORKSPACE/nmmp-debug/protected/recovery"
          RESTORED="$GITHUB_WORKSPACE/nmmp-debug/protected/restored_dex"
          MAPPING="$GITHUB_WORKSPACE/$GENERATED_MAPPING_JSON"
          RECOVER_SCRIPT="$GITHUB_WORKSPACE/devirtualizer/runtime/runtime/analysis/protected-apk/recover_nmmp.py"
          RESTORE_SCRIPT="$GITHUB_WORKSPACE/devirtualizer/runtime/runtime/analysis/protected-apk/restore_dex.py"
          test -s "$MAPPING"
          test -f "$RECOVER_SCRIPT"
          test -f "$RESTORE_SCRIPT"

          rm -rf "$RECOVERY" "$RESTORED"
          python3 "$RECOVER_SCRIPT" "$GITHUB_WORKSPACE/$PROTECTED_APK" \
            --output "$RECOVERY"
          unzip -q -o "$GITHUB_WORKSPACE/$PROTECTED_APK" \
            'lib/*/libnmmvm.so' -d "$RECOVERY/_apk"

          python3 - "$GITHUB_WORKSPACE" "$RECOVERY" "$RESTORED" "$MAPPING" <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          workspace = Path(sys.argv[1])
          recovered = Path(sys.argv[2])
          restored = Path(sys.argv[3])
          generated_mapping = Path(sys.argv[4])
          runtime = workspace / "devirtualizer/runtime/runtime"
          analysis = runtime / "analysis/protected-apk"
          sys.path.insert(0, str(runtime))
          sys.path.insert(0, str(analysis))
          import restore_nmmp_termux as pipeline

          dex_root = recovered / "_apk"
          dexes = pipeline.dex_paths(dex_root)
          probe = recovered / "probe_smali"
          probe.mkdir(parents=True, exist_ok=True)
          for dex in dexes:
              pipeline.disassemble(dex, probe / dex.stem)

          targets_path = recovered / "native_targets.json"
          target_count = pipeline.discover_native_targets(
              dex_root, dexes, probe, targets_path
          )
          pipeline.align_recovered_methods(recovered, targets_path)

          mapping_path = recovered / "handler_mapping_generated.json"
          shutil.copy2(generated_mapping, mapping_path)
          mapping_data = json.loads(mapping_path.read_text(encoding="utf-8"))
          if mapping_data.get("schema") != "nmmp-generated-handler-mapping/v1":
              # An already-protected APK has no generated dex2c tree to
              # inspect.  The pre-recovery native mapper therefore produces
              # only the handler evidence it can prove statically.  Re-run it
              # after recovery with the method corpus so boundary closure
              # promotes every proven method-entry byte and solver-visible
              # successor boundary.  Do not replace an exact generated
              # permutation from a fresh protection run.
              protected_vm = dex_root / "lib/arm64-v8a/libnmmvm.so"
              mapper = analysis / "map_vm_opcodes.py"
              reference_vm = runtime / "reference_vm/libnmmvm.so"
              subprocess.run(
                  [
                      sys.executable,
                      str(mapper),
                      str(reference_vm),
                      str(protected_vm),
                      "--reference-table", "auto",
                      "--protected-table", "auto",
                      "--corpus", str(recovered / "recovered_methods.json"),
                      "--out", str(mapping_path),
                  ],
                  check=True,
              )
          solved_mapping = recovered / "format_solved_mapping.json"
          solver = analysis / "solve_opcode_formats.py"
          solver_jar = runtime / "tools/format-solver-all.jar"
          solver_process = subprocess.run(
              [
                  sys.executable,
                  str(solver),
                  "--solver", str(solver_jar),
                  "--methods", str(recovered / "recovered_methods.json"),
                  "--mapping", str(mapping_path),
                  "--out", str(solved_mapping),
              ],
              text=True,
              capture_output=True,
          )
          if solver_process.returncode:
              mapping_data = json.loads(mapping_path.read_text())
              diagnostic = workspace / "nmmp-debug/protected/unsupported_mapping.json"
              diagnostic.parent.mkdir(parents=True, exist_ok=True)
              diagnostic.write_text(
                  json.dumps(
                      {
                          "status": "unsupported_or_ambiguous",
                          "reason": (
                              "The recovered opcode evidence does not prove "
                              "one unique verifier-safe permutation. No DEX "
                              "was written."
                          ),
                          "solver_stdout": solver_process.stdout,
                          "solver_stderr": solver_process.stderr,
                          "known_assignments": len(
                              mapping_data.get("known_assignments", {})
                          ),
                          "candidate_domains": len(
                              mapping_data.get("candidate_opcodes", {})
                          ),
                          "exact_unique_entries": mapping_data.get(
                              "exact_unique_entries"
                          ),
                          "recovered_methods": str(
                              recovered / "recovered_methods.json"
                          ),
                          "generated_mapping": str(generated_mapping),
                          "armv7_evidence": str(
                              workspace
                              / "nmmp-debug/protected/armv7_dispatch_tables.json"
                          ),
                          "armv7_mapping_promoted": False,
                          "originals_untouched": True,
                      },
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              print(
                  "UNSUPPORTED_OR_AMBIGUOUS_MAPPING:",
                  solver_process.stderr.strip()
                  or solver_process.stdout.strip()
                  or "format solver rejected the mapping",
              )
              print("Diagnostic artifact:", diagnostic)
              raise RuntimeError(
                  "static opcode mapping is unsupported or ambiguous; "
                  "refusing to write restored DEX files"
              )
          mapping_path = solved_mapping
          native_so = recovered / "_apk/lib/arm64-v8a/libnmmp.so"
          if not native_so.is_file():
              raise RuntimeError(
                  "recovery did not extract lib/arm64-v8a/libnmmp.so"
              )

          restored.mkdir(parents=True, exist_ok=True)
          command = [
              sys.executable,
              str(analysis / "restore_dex.py"),
              "--dex-dir", str(dex_root),
              "--targets", str(targets_path),
              "--json", str(recovered / "recovered_methods.json"),
              "--native-so", str(native_so),
              "--mapping", str(mapping_path),
              "--out", str(restored),
          ]
          subprocess.run(command, check=True)

          report_path = restored / "restore_report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("methods_skipped") != 0:
              raise RuntimeError(
                  "strict DEX restoration skipped methods: "
                  + json.dumps(report.get("skipped_methods", []))
              )
          if report.get("methods_restored") != target_count:
              raise RuntimeError(
                  "strict DEX restoration count mismatch: "
                  f"restored={report.get('methods_restored')} "
                  f"targets={target_count}"
              )

          validation = recovered / "strict_validation"
          validation.mkdir(parents=True, exist_ok=True)
          for dex in dexes:
              restored_dex = restored / dex.name
              if not restored_dex.is_file():
                  raise RuntimeError(
                      f"restorer omitted expected output {restored_dex.name}"
                  )
              pipeline.disassemble(restored_dex, validation / dex.stem)
          pipeline.remove_nmmp_bootstrap(validation)
          pipeline.validate_smali(validation)

          # Preserve the original extracted DEX files and prove that the
          # restorer wrote a separate output tree.
          if any(
              (restored / dex.name).resolve() == dex.resolve()
              for dex in dexes
          ):
              raise RuntimeError("restorer output aliases an original DEX")
          (recovered / "strict_validation.json").write_text(
              json.dumps({
                  "generated_mapping": str(generated_mapping),
                  "targets": target_count,
                  "methods_restored": report["methods_restored"],
                  "methods_skipped": report["methods_skipped"],
                  "validated_dexes": sorted(dex.name for dex in dexes),
                  "originals_untouched": True,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "Strict static DEX validation passed:",
              report["methods_restored"], "methods",
          )
          PY

          mkdir -p nmmp-debug/protected/restored
          cp -a "$RESTORED/." nmmp-debug/protected/restored/
          cp "$RECOVERY/strict_validation.json" \
            nmmp-debug/protected/strict_validation.json
          echo "RESTORED_DEX_DIR=nmmp-debug/protected/restored" >> "$GITHUB_ENV"

      - name: Collect APK and DEX evidence
        run: |
          set -euo pipefail
          for kind in input protected; do
            if [ "$kind" = input ]; then
              APK="$GITHUB_WORKSPACE/$APK_PATH"
            else
              APK="$GITHUB_WORKSPACE/$PROTECTED_APK"
            fi
            entries="nmmp-debug/$kind/zip_entries.txt"
            mkdir -p "nmmp-debug/$kind/dex"
            unzip -Z1 "$APK" | sort > "$entries"

            {
              echo "=== $kind APK ==="
              file "$APK"
              sha256sum "$APK"
              stat -c 'bytes=%s' "$APK"
              echo
              echo "=== ZIP entries ==="
              cat "$entries"
            } > "nmmp-debug/$kind/apk.txt"

            while IFS= read -r dex; do
              name=$(basename "$dex")
              unzip -p "$APK" "$dex" | sha256sum \
                > "nmmp-debug/$kind/dex/${name}.sha256"
            done < <(grep -E '^classes([0-9]+)?\.dex$' "$entries" || true)
          done

      - name: Collect native ELF and dispatch evidence
        run: |
          set -euo pipefail
          rm -rf extracted/native
          mkdir -p nmmp-debug/protected/native
          APK="$GITHUB_WORKSPACE/$PROTECTED_APK"
          unzip -q -o "$APK" 'lib/*/*.so' -d extracted/native || true

          find extracted/native -type f -name '*.so' -print0 |
          while IFS= read -r -d '' so; do
            rel=${so#extracted/native/}
            safe=$(printf '%s' "$rel" | tr '/ ' '__')
            {
              echo "=== $rel ==="
              file "$so"
              sha256sum "$so"
              echo
              echo "--- ELF header ---"
              readelf -h "$so" || true
              echo
              echo "--- sections ---"
              readelf -S --wide "$so" || true
              echo
              echo "--- dynamic symbols ---"
              readelf -Ws "$so" || true
              echo
              echo "--- relocations ---"
              readelf -r --wide "$so" || true
              echo
              echo "--- NMMP strings ---"
              strings -a "$so" |
                grep -Ei 'nmmp|nmmvm|vmInterpret|cacheInitial|gVm|resolver|opcode' ||
                true
            } > "nmmp-debug/protected/native/${safe}.txt"
          done

          python3 - "$GITHUB_WORKSPACE/extracted/native" \
            "$GITHUB_WORKSPACE/nmmp-debug/protected/dispatch_tables.json" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          relative = re.compile(
              r"^\s*([0-9a-fA-F]+)\s+\S+\s+R_AARCH64_RELATIVE\s+"
              r"([0-9a-fA-F]+)"
          )
          result = {}

          for so in sorted(root.rglob("*.so")):
              try:
                  text = subprocess.check_output(
                      ["readelf", "-r", "--wide", str(so)],
                      text=True,
                      stderr=subprocess.STDOUT,
                  )
              except subprocess.CalledProcessError as exc:
                  result[str(so.relative_to(root))] = {"error": exc.output}
                  continue

              relocations = {}
              for line in text.splitlines():
                  match = relative.match(line)
                  if match:
                      relocations[int(match.group(1), 16)] = int(
                          match.group(2), 16
                      )

              tables = []
              for base in sorted(relocations):
                  window = [base + 8 * index for index in range(256)]
                  if all(location in relocations for location in window):
                      tables.append({
                          "file_offset_or_vaddr": f"0x{base:x}",
                          "entries": [
                              {
                                  "encoded_byte": index,
                                  "native_target_addend":
                                      f"0x{relocations[base + 8 * index]:x}",
                              }
                              for index in range(256)
                          ],
                      })

              result[str(so.relative_to(root))] = {
                  "relative_relocation_count": len(relocations),
                  "complete_256_entry_tables": tables,
                  "interpretation":
                      "Targets identify native handlers only; they are not "
                      "DEX opcode assignments.",
              }

          output.write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Write analysis summary
        run: |
          set -euo pipefail
          {
            echo "# NMMP debug summary"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Input asset ID: \`${{ inputs.asset_id }}\`"
            echo "- Class rules: \`${RULES_PATH:-none}\`"
            echo "- Protected APK: \`${PROTECTED_APK}\`"
            echo
            echo "## Files"
            find nmmp-debug -type f -printf '%p\n' | sort
            echo
            echo "## Dispatch tables"
            python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("nmmp-debug/protected/dispatch_tables.json").read_text()
          )
          for name, item in data.items():
              tables = item.get("complete_256_entry_tables", [])
              print(f"- {name}: {len(tables)} complete 256-entry table(s)")
          PY
            echo
            echo "A dispatch table maps encoded bytes to native handler targets."
            echo "It does not by itself prove the original DEX opcode."
            echo
            echo "## ARMv7 evidence"
            python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("nmmp-debug/protected/armv7_dispatch_tables.json").read_text()
          )
          print(f"- Files scanned: {report['files_scanned']}")
          print(f"- ARMv7 files: {len(report['armv7_files'])}")
          for name, item in report["armv7_files"].items():
              print(
                  f"- {name}: {len(item.get('complete_256_entry_tables', []))} "
                  "complete table(s); "
                  f"preferred={item.get('preferred_table') or 'none'}"
              )
          print("- Mapping promotion: refused without ARMv7 semantic proof")
          PY
            echo
            echo "## Generated permutation"
            python3 - <<'PY'
          import json
          from pathlib import Path

          permutation = json.loads(
              Path("nmmp-debug/protected/opcode_permutation.json").read_text()
          )
          source = permutation["source"]
          print(f"- Source: {source['path']}")
          print(f"- Symbol: {source.get('symbol') or source.get('label') or '<json>'}")
          print(f"- Direction: {source['direction']}")
          print(
              "- Validation: "
              f"{permutation['validation']['entry_count']} entries, "
              "bijection, NOP and DEX 039 holes fixed"
          )
          print(
              "- Restorer handoff: "
              "nmmp-debug/protected/handler_mapping_generated.json"
          )
          PY
          } > nmmp-debug/summary.md

      - name: Upload static debug bundle
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nmmp-debug-static-${{ inputs.job_id }}
          path: nmmp-debug/
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Optional Android runtime smoke trace
    if: ${{ inputs.run_emulator }}
    needs: static-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Download protected debug bundle
        uses: actions/download-artifact@v4
        with:
          name: nmmp-debug-static-${{ inputs.job_id }}
          path: debug-input

      - name: Prepare protected APK
        run: |
          set -euo pipefail
          test -s debug-input/protected/protected.apk
          cp debug-input/protected/protected.apk analysis.apk

      - name: Boot emulator and collect runtime logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.emulator_api }}
          arch: x86_64
          target: default
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          disable-spellchecker: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            mkdir -p emulator-debug
            adb devices -l | tee emulator-debug/devices.txt
            adb shell getprop | sort > emulator-debug/getprop.txt
            adb install -r analysis.apk 2>&1 |
              tee emulator-debug/install.txt || true

            if [ -n "${{ inputs.package_name }}" ]; then
              adb shell monkey -p "${{ inputs.package_name }}" 1 \
                2>&1 | tee emulator-debug/launch.txt || true
            else
              echo "No package_name supplied; launch was skipped." \
                | tee emulator-debug/launch.txt
            fi

            sleep 8
            adb logcat -d -v threadtime > emulator-debug/logcat.txt || true
            adb shell dumpsys package "${{ inputs.package_name }}" \
              > emulator-debug/package.txt 2>&1 || true

      - name: Upload emulator debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: nmmp-debug-emulator-${{ inputs.job_id }}
          path: emulator-debug/
          if-no-files-found: warn
          retention-days: 7
name: Subway Surfers — Runtime Mod Menu Inject

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: 'Direct download URL for the APK (Dropbox dl=1 link)'
        required: false
        default: 'https://www.dropbox.com/scl/fi/jddlzuz3q627cr4xusufq/Subway-Surf_3.62.1.apk?rlkey=ilrh3no1ljn36g4uwys7ff0uj&st=qhu5ysmi&dl=1'
      asset_id:
        description: 'OR: Release asset ID of an already-uploaded APK (leave blank to use URL)'
        required: false
        default: ''

jobs:
  build-and-inject:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo (for hook sources)
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          if [ -n "${{ inputs.asset_id }}" ]; then
            curl -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
              -o game.apk
          else
            curl -L "${{ inputs.dropbox_url }}" -o game.apk
          fi
          echo "APK size: $(du -sh game.apk)"
          file game.apk

      - name: Extract APK
        run: |
          mkdir -p apk_work
          unzip -q game.apk -d apk_work
          echo "Entries: $(find apk_work -type f | wc -l)"
          find apk_work/lib -name "*.so" | while read f; do echo "  $(du -sh $f)"; done

      - name: Set up Android NDK
        run: |
          NDK_VERSION="r27c"
          curl -L "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          echo "NDK_ROOT=$(pwd)/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK ready: android-ndk-${NDK_VERSION}"

      - name: Compile libmatrix-hook.so + libmain.so stub (ARM64)
        run: |
          CXX="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          BASE_FLAGS="--sysroot=$SYSROOT -target aarch64-linux-android24 -shared -fPIC -O2 -fvisibility=hidden -Wl,--strip-all"

          echo "── Compiling libmatrix-hook.so ──"
          $CXX $BASE_FLAGS -std=c++17 -static-libstdc++ \
            -o libmatrix-hook.so mod_menu/subway/hook.cpp \
            -llog -ldl
          echo "  size: $(du -sh libmatrix-hook.so)"
          file libmatrix-hook.so

          echo "── Compiling libmain.so stub (pure C — no C++ runtime needed) ──"
          $CC $BASE_FLAGS \
            -o libmain_stub.so mod_menu/subway/loader_stub.c \
            -llog -ldl
          echo "  size: $(du -sh libmain_stub.so)"
          file libmain_stub.so

          echo "=== Exported symbols ==="
          nm -D libmatrix-hook.so | grep -v " U " | awk '{print "  matrix-hook:",$3}' || true
          nm -D libmain_stub.so   | grep -v " U " | awk '{print "  stub:       ",$3}' || true

          echo "=== NEEDED libs (must NOT include libc++_shared.so) ==="
          readelf -d libmatrix-hook.so | grep NEEDED
          readelf -d libmain_stub.so   | grep NEEDED

      - name: Inject matrix-hook into APK
        run: |
          python3 - <<'PYEOF'
          import os, shutil, zipfile

          lib_dir = "apk_work/lib/arm64-v8a"

          orig_main = os.path.join(lib_dir, "libmain.so")
          bak_main  = os.path.join(lib_dir, "libmain_orig.so")
          if os.path.exists(orig_main):
              shutil.copy2(orig_main, bak_main)
              print(f"Backed up:  libmain.so -> libmain_orig.so  ({os.path.getsize(bak_main):,} bytes)")

          shutil.copy2("libmain_stub.so", orig_main)
          print(f"Stub:       libmain_stub.so -> libmain.so      ({os.path.getsize(orig_main):,} bytes)")

          hook_dst = os.path.join(lib_dir, "libmatrix-hook.so")
          shutil.copy2("libmatrix-hook.so", hook_dst)
          print(f"Hook:       libmatrix-hook.so added             ({os.path.getsize(hook_dst):,} bytes)")

          orig_info = {}
          with zipfile.ZipFile("game.apk") as z:
              for info in z.infolist():
                  orig_info[info.filename] = info.compress_type

          out = "subway_modded_unsigned.apk"
          with zipfile.ZipFile(out, "w") as zout:
              for root, dirs, files in os.walk("apk_work"):
                  for fname in sorted(files):
                      fp  = os.path.join(root, fname)
                      arc = os.path.relpath(fp, "apk_work")
                      compress = zipfile.ZIP_STORED if arc.endswith(".so") else orig_info.get(arc, zipfile.ZIP_DEFLATED)
                      zout.write(fp, arc, compress)

          sz = os.path.getsize(out)
          print(f"\nOutput: {out}  ({sz // 1024 // 1024} MB)")

          with zipfile.ZipFile(out) as vz:
              names = vz.namelist()
              for n in ["lib/arm64-v8a/libmatrix-hook.so","lib/arm64-v8a/libmain.so","lib/arm64-v8a/libmain_orig.so"]:
                  ok    = n in names
                  info  = vz.getinfo(n) if ok else None
                  sz_kb = (info.file_size // 1024) if info else 0
                  ctype = "STORED" if (info and info.compress_type == 0) else "DEFLATED"
                  print(f"  {'OK' if ok else 'MISSING'} {n}  ({sz_kb} KB, {ctype})")
          PYEOF

      - name: Upload unsigned modded APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-modded-unsigned
          path: subway_modded_unsigned.apk
          retention-days: 7

      - name: Summary
        run: |
          echo "## Subway Surfers — matrix-hook Injected" >> $GITHUB_STEP_SUMMARY
          echo "| File | Role |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| libmatrix-hook.so | Our hook — 21 runtime patches |" >> $GITHUB_STEP_SUMMARY
          echo "| libmain.so | Tiny C stub — loads matrix-hook, forwards JNI_OnLoad |" >> $GITHUB_STEP_SUMMARY
          echo "| libmain_orig.so | Original Unity libmain (untouched) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifact -> MT Manager -> sign -> install" >> $GITHUB_STEP_SUMMARY

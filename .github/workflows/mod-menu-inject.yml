name: Subway Surfers — Runtime Mod Menu Inject

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: 'Direct download URL for the APK (Dropbox dl=1 link)'
        required: false
        default: 'https://www.dropbox.com/scl/fi/jddlzuz3q627cr4xusufq/Subway-Surf_3.62.1.apk?rlkey=ilrh3no1ljn36g4uwys7ff0uj&st=qhu5ysmi&dl=1'
      asset_id:
        description: 'OR: Release asset ID of an already-uploaded APK (leave blank to use URL)'
        required: false
        default: ''

jobs:
  build-and-inject:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── 1. Download APK ──────────────────────────────────────────────────────
      - name: Download APK
        run: |
          if [ -n "${{ inputs.asset_id }}" ]; then
            echo "Downloading from release asset..."
            curl -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
              -o game.apk
          else
            echo "Downloading from Dropbox URL..."
            curl -L "${{ inputs.dropbox_url }}" -o game.apk
          fi
          echo "APK size: $(du -sh game.apk)"
          file game.apk

      # ── 2. Extract APK ───────────────────────────────────────────────────────
      - name: Extract APK
        run: |
          mkdir -p apk_work
          unzip -q game.apk -d apk_work
          echo "Entries: $(find apk_work -type f | wc -l)"
          echo "=== Native libs ==="
          find apk_work/lib -name "*.so" | while read f; do
            echo "  $(du -sh $f)"
          done

      # ── 3. Set up Android NDK ────────────────────────────────────────────────
      - name: Set up Android NDK
        run: |
          NDK_VERSION="r27c"
          curl -L "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          echo "NDK_ROOT=$(pwd)/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK ready: android-ndk-${NDK_VERSION}"

      # ── 4. Write hook source ─────────────────────────────────────────────────
      - name: Write hook.cpp
        run: |
          mkdir -p hook_src
          cat > hook_src/hook.cpp << 'CPPSRC'
          /**
           * Taurus Shield — Subway Surfers 3.62.1 Runtime Hook
           * Proxy for libmain.so — patches libil2cpp.so at runtime.
           */
          #include <android/log.h>
          #include <dlfcn.h>
          #include <jni.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <unistd.h>

          #define TAG  "TaurusHook"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          static uintptr_t getLibBase(const char* name) {
              char line[512];
              FILE* fp = fopen("/proc/self/maps", "r");
              if (!fp) return 0;
              while (fgets(line, sizeof(line), fp)) {
                  if (strstr(line, name) && strstr(line, "r-xp")) {
                      uintptr_t base = (uintptr_t)strtoull(line, nullptr, 16);
                      fclose(fp);
                      return base;
                  }
              }
              fclose(fp);
              return 0;
          }

          static void writeAt(uintptr_t addr, const uint32_t* insns, size_t count) {
              size_t len  = count * 4;
              long   pgsz = getpagesize();
              uintptr_t page    = addr & ~(uintptr_t)(pgsz - 1);
              size_t    pageLen = len + (addr - page);
              mprotect((void*)page, pageLen, PROT_READ | PROT_WRITE | PROT_EXEC);
              memcpy((void*)addr, insns, len);
              mprotect((void*)page, pageLen, PROT_READ | PROT_EXEC);
              __builtin___clear_cache((char*)addr, (char*)(addr + len));
          }

          static void patchBool(uintptr_t base, uintptr_t off, bool val) {
              uint32_t i[] = { val ? 0x52800020u : 0x52800000u, 0xD65F03C0u };
              writeAt(base + off, i, 2);
              LOGI("  bool  @0x%lX = %s", (unsigned long)off, val ? "true" : "false");
          }

          static void patchInt16(uintptr_t base, uintptr_t off, uint16_t val) {
              uint32_t i[] = { (uint32_t)(0x52800000u | ((uint32_t)val << 5)), 0xD65F03C0u };
              writeAt(base + off, i, 2);
              LOGI("  int   @0x%lX = %u", (unsigned long)off, (unsigned)val);
          }

          static void patchInt32(uintptr_t base, uintptr_t off, uint32_t val) {
              uint16_t lo = (uint16_t)(val & 0xFFFF);
              uint16_t hi = (uint16_t)(val >> 16);
              uint32_t i[] = {
                  (uint32_t)(0x52800000u | ((uint32_t)lo << 5)),
                  (uint32_t)(0x72A00000u | ((uint32_t)hi << 5)),
                  0xD65F03C0u
              };
              writeAt(base + off, i, 3);
              LOGI("  int32 @0x%lX = %u", (unsigned long)off, val);
          }

          static void patchFloat(uintptr_t base, uintptr_t off, float val) {
              uint32_t bits;
              memcpy(&bits, &val, 4);
              uint16_t lo = (uint16_t)(bits & 0xFFFF);
              uint16_t hi = (uint16_t)(bits >> 16);
              uint32_t i[] = {
                  (uint32_t)(0x52800000u | ((uint32_t)lo << 5)),
                  (uint32_t)(0x72A00000u | ((uint32_t)hi << 5)),
                  0x1E270000u,
                  0xD65F03C0u
              };
              writeAt(base + off, i, 4);
              LOGI("  float @0x%lX = %.3f", (unsigned long)off, (double)val);
          }

          static void patchVoid(uintptr_t base, uintptr_t off) {
              uint32_t i[] = { 0xD65F03C0u };
              writeAt(base + off, i, 1);
              LOGI("  void  @0x%lX silenced", (unsigned long)off);
          }

          static void applyPatches(uintptr_t base) {
              LOGI("=== Taurus Shield — Subway Surfers 3.62.1 ===");
              LOGI("libil2cpp base: 0x%lX", (unsigned long)base);

              // Ads
              patchVoid (base, 0x1043C64);
              patchVoid (base, 0x1150264);
              patchBool (base, 0x3247894, false);
              // IAP
              patchBool (base, 0x32477FC, true);
              // Currency 999999
              patchInt32(base, 0x158EF98, 999999u);
              patchInt32(base, 0x32B4820, 999999u);
              // Jump
              patchInt16(base, 0xF9EFD4, 100);
              patchFloat(base, 0xF9EFF4, 3.0f);
              // Speed
              patchFloat(base, 0xF9F454, 5.0f);
              patchFloat(base, 0xF9F624, 5.0f);
              patchBool (base, 0xF9F3C8, true);
              patchFloat(base, 0xF9F48C, 0.5f);
              patchFloat(base, 0xF9F674, 0.5f);
              // Score
              patchBool (base, 0x13918C4, true);
              patchBool (base, 0x13919DC, true);
              patchInt16(base, 0x1392030, 5);
              patchBool (base, 0x1021B20, true);
              // Powerups
              patchBool (base, 0xFC2538, true);
              patchBool (base, 0xFC2548, true);
              patchBool (base, 0xFC2578, true);
              // Revive
              patchBool (base, 0x13D570C, true);

              LOGI("=== 21 patches applied ===");
          }

          __attribute__((constructor))
          static void onLoad() {
              LOGI("Taurus Shield hook loaded — waiting for libil2cpp...");
              uintptr_t base = 0;
              for (int i = 0; i < 40 && !base; i++) {
                  base = getLibBase("libil2cpp.so");
                  if (!base) usleep(50000);
              }
              if (!base) { LOGE("libil2cpp.so base not found"); return; }
              applyPatches(base);
          }

          extern "C" JNIEXPORT jint JNI_OnLoad(JavaVM* vm, void* reserved) {
              void* orig = dlopen("libmain_orig.so", RTLD_NOW | RTLD_GLOBAL);
              if (!orig) { LOGE("dlopen libmain_orig.so: %s", dlerror()); return JNI_VERSION_1_6; }
              typedef jint (*fn_t)(JavaVM*, void*);
              auto fn = (fn_t)dlsym(orig, "JNI_OnLoad");
              if (!fn) { LOGE("JNI_OnLoad not in libmain_orig"); return JNI_VERSION_1_6; }
              LOGI("Forwarding JNI_OnLoad → libmain_orig");
              return fn(vm, reserved);
          }
          CPPSRC
          echo "hook.cpp written ($(wc -l < hook_src/hook.cpp) lines)"

      # ── 5. Compile hook.so with NDK clang ────────────────────────────────────
      - name: Compile libmain.so (ARM64)
        run: |
          CLANG="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          $CLANG \
            --sysroot="$SYSROOT" \
            -target aarch64-linux-android24 \
            -shared \
            -fPIC \
            -std=c++17 \
            -O2 \
            -fvisibility=hidden \
            -Wl,--strip-all \
            -o hook_libmain.so \
            hook_src/hook.cpp \
            -llog \
            -ldl \
            -landroid

          echo "=== Built hook library ==="
          ls -lh hook_libmain.so
          file hook_libmain.so
          # Show exported symbols (should only be JNI_OnLoad + constructor)
          nm -D hook_libmain.so | grep -v "U " | awk '{print $3}' || true

      # ── 6. Inject into APK ───────────────────────────────────────────────────
      - name: Inject hook into APK
        run: |
          python3 - <<'PYEOF'
          import os, shutil, zipfile

          # Rename original libmain.so → libmain_orig.so
          orig = "apk_work/lib/arm64-v8a/libmain.so"
          dest = "apk_work/lib/arm64-v8a/libmain_orig.so"
          if os.path.exists(orig):
              shutil.copy2(orig, dest)
              print(f"Backed up: libmain.so → libmain_orig.so  ({os.path.getsize(dest):,} bytes)")
          else:
              print("WARNING: libmain.so not found in APK")

          # Replace libmain.so with our hook
          shutil.copy2("hook_libmain.so", orig)
          print(f"Injected: hook_libmain.so → lib/arm64-v8a/libmain.so  ({os.path.getsize(orig):,} bytes)")

          # Repack APK — .so files MUST be ZIP_STORED (uncompressed) for the
          # dynamic linker to mmap them directly from the APK on Android 6+
          print("\nRepacking APK...")
          orig_info = {}
          with zipfile.ZipFile("game.apk") as z:
              for info in z.infolist():
                  orig_info[info.filename] = info.compress_type

          out = "subway_modded_unsigned.apk"
          with zipfile.ZipFile(out, "w") as zout:
              for root, dirs, files in os.walk("apk_work"):
                  for fname in sorted(files):
                      fp  = os.path.join(root, fname)
                      arc = os.path.relpath(fp, "apk_work")
                      if arc.endswith(".so"):
                          compress = zipfile.ZIP_STORED     # mandatory for native libs
                      elif arc in orig_info:
                          compress = orig_info[arc]
                      else:
                          compress = zipfile.ZIP_DEFLATED
                      zout.write(fp, arc, compress)

          sz = os.path.getsize(out)
          print(f"\n✅ Output: {out}  ({sz // 1024 // 1024} MB)")

          # Verify injection
          with zipfile.ZipFile(out) as vz:
              names = vz.namelist()
              for n in ["lib/arm64-v8a/libmain.so", "lib/arm64-v8a/libmain_orig.so"]:
                  status = "✅" if n in names else "❌ MISSING"
                  info = vz.getinfo(n) if n in names else None
                  sz_kb = (info.file_size // 1024) if info else 0
                  ctype = "STORED" if (info and info.compress_type == 0) else "DEFLATED"
                  print(f"  {status} {n}  ({sz_kb} KB, {ctype})")
          PYEOF

      # ── 7. Upload artifact ───────────────────────────────────────────────────
      - name: Upload unsigned modded APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-modded-unsigned
          path: subway_modded_unsigned.apk
          retention-days: 7

      - name: Summary
        run: |
          echo "## Subway Surfers Runtime Mod Menu ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Injection Method" >> $GITHUB_STEP_SUMMARY
          echo "- **libmain.so replaced** with Taurus Shield runtime hook" >> $GITHUB_STEP_SUMMARY
          echo "- **libmain_orig.so** = original, proxied via JNI_OnLoad" >> $GITHUB_STEP_SUMMARY
          echo "- **No static binary modification** — all patches applied at runtime" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Patches Applied (all at runtime)" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Offset | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| TryShowInterstitial | 0x1043C64 | silenced |" >> $GITHUB_STEP_SUMMARY
          echo "| get_IsAdCost | 0x3247894 | false |" >> $GITHUB_STEP_SUMMARY
          echo "| get_IsIAP | 0x32477FC | true |" >> $GITHUB_STEP_SUMMARY
          echo "| GetCurrency ×2 | 0x158EF98 / 0x32B4820 | 999,999 |" >> $GITHUB_STEP_SUMMARY
          echo "| get_JumpLimit | 0xF9EFD4 | 100 |" >> $GITHUB_STEP_SUMMARY
          echo "| get_SpeedMultiplier ×2 | 0xF9F454 / 0xF9F624 | 5× |" >> $GITHUB_STEP_SUMMARY
          echo "| get_GravityMultiplier ×2 | 0xF9F48C / 0xF9F674 | 0.5× |" >> $GITHUB_STEP_SUMMARY
          echo "| get_MagnetActive | 0xFC2538 | true |" >> $GITHUB_STEP_SUMMARY
          echo "| get_SuperSneakersActive | 0xFC2548 | true |" >> $GITHUB_STEP_SUMMARY
          echo "| get_HoverboardActive | 0xFC2578 | true |" >> $GITHUB_STEP_SUMMARY
          echo "| get_CanRevive | 0x13D570C | true |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Step" >> $GITHUB_STEP_SUMMARY
          echo "Download **subway-modded-unsigned** artifact → sign with MT Manager → install" >> $GITHUB_STEP_SUMMARY

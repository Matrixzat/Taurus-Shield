name: Subway Surfers — Runtime Mod Menu Inject

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: 'Direct download URL for the APK'
        required: false
        default: 'https://www.dropbox.com/scl/fi/jddlzuz3q627cr4xusufq/Subway-Surf_3.62.1.apk?rlkey=ilrh3no1ljn36g4uwys7ff0uj&st=qhu5ysmi&dl=1'

jobs:
  build-and-inject:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl -L "${{ inputs.dropbox_url }}" -o game.apk
          echo "APK: $(du -sh game.apk)"

      - name: Extract APK
        run: |
          mkdir -p apk_work
          unzip -q game.apk -d apk_work
          echo "Files: $(find apk_work -type f | wc -l)"
          find apk_work/lib -name "*.so" 2>/dev/null | while read f; do echo "  $(du -sh $f)"; done

      - name: Set up Android NDK
        run: |
          NDK_ROOT=$(ls -d /usr/local/lib/android/sdk/ndk/27* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "Using NDK: $NDK_ROOT"

      - name: Build Dobby (ARM64 Android)
        run: |
          git clone https://github.com/jmpews/Dobby.git --depth=1
          mkdir -p Dobby/build_arm64 && cd Dobby/build_arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPlugin.Android=ON \
            2>&1 | tail -5
          make -j$(nproc) dobby 2>&1 | tail -8
          find . -name "*.a" | while read f; do echo "  $(du -sh $f)  $f"; done
          echo "DOBBY_LIB=$(pwd)/$(find . -name 'libdobby.a' | head -1)" >> $GITHUB_ENV
          echo "DOBBY_INC=$(pwd)/../include" >> $GITHUB_ENV

      - name: Download ImGui (v1.91.6)
        run: |
          git clone --depth=1 --branch v1.91.6 https://github.com/ocornut/imgui.git
          echo "ImGui files: $(find imgui -name '*.h' -o -name '*.cpp' | wc -l)"
          ls imgui/backends/imgui_impl_opengl3*

      - name: Compile libmatrix-hook.so (Dobby + ImGui + GLES2)
        run: |
          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$LLVM/aarch64-linux-android24-clang++"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          echo "Toolchain: $($CXX --version | head -1)"
          echo "Dobby lib: $DOBBY_LIB"

          $CXX \
            --sysroot=$SYSROOT \
            -target aarch64-linux-android24 \
            -shared -fPIC -O2 -fvisibility=hidden \
            -std=c++17 -static-libstdc++ \
            -DIMGUI_IMPL_OPENGL_ES2 \
            -I imgui \
            -I imgui/backends \
            -I "$DOBBY_INC" \
            mod_menu/subway/hook.cpp \
            imgui/imgui.cpp \
            imgui/imgui_draw.cpp \
            imgui/imgui_tables.cpp \
            imgui/imgui_widgets.cpp \
            imgui/backends/imgui_impl_opengl3.cpp \
            "$DOBBY_LIB" \
            -lEGL -lGLESv2 -landroid -llog -ldl \
            -Wl,--strip-all \
            -o libmatrix-hook.so

          echo "Hook size: $(du -sh libmatrix-hook.so)"
          file libmatrix-hook.so
          readelf -d libmatrix-hook.so | grep NEEDED
          nm -D libmatrix-hook.so | grep -v " U " | grep -v "__cxa\|__gnu\|_ZN\|_ZS\|_ZT\|_ZZ" | head -10

      - name: Compile libmain.so stub (pure C)
        run: |
          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$LLVM/aarch64-linux-android24-clang"
          SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          $CC \
            --sysroot=$SYSROOT \
            -target aarch64-linux-android24 \
            -shared -fPIC -O2 -fvisibility=hidden \
            mod_menu/subway/loader_stub.c \
            -llog -ldl \
            -Wl,--strip-all \
            -o libmain_stub.so

          echo "Stub size: $(du -sh libmain_stub.so)"
          readelf -d libmain_stub.so | grep NEEDED

      - name: Inject into APK
        run: |
          python3 - <<'PYEOF'
          import os, shutil, zipfile

          lib_dir    = "apk_work/lib/arm64-v8a"

          orig = os.path.join(lib_dir, "libmain.so")
          bak  = os.path.join(lib_dir, "libmain_orig.so")
          if os.path.exists(orig):
              shutil.copy2(orig, bak)
              print(f"Backed up libmain.so ({os.path.getsize(bak):,} bytes)")

          shutil.copy2("libmain_stub.so",   orig)
          shutil.copy2("libmatrix-hook.so", os.path.join(lib_dir, "libmatrix-hook.so"))
          print(f"Stub:  {os.path.getsize(orig):,} bytes")
          print(f"Hook:  {os.path.getsize(os.path.join(lib_dir,'libmatrix-hook.so')):,} bytes")

          orig_ct = {}
          with zipfile.ZipFile("game.apk") as z:
              for i in z.infolist(): orig_ct[i.filename] = i.compress_type

          out = "subway_modded_unsigned.apk"
          with zipfile.ZipFile(out, "w") as zout:
              for root, _, files in os.walk("apk_work"):
                  for fn in sorted(files):
                      fp  = os.path.join(root, fn)
                      arc = os.path.relpath(fp, "apk_work")
                      ct  = zipfile.ZIP_STORED if arc.endswith(".so") else orig_ct.get(arc, zipfile.ZIP_DEFLATED)
                      zout.write(fp, arc, ct)

          sz = os.path.getsize(out)
          print(f"\nOutput: {out}  ({sz//1024//1024} MB)")
          with zipfile.ZipFile(out) as vz:
              names = vz.namelist()
              for n in ["lib/arm64-v8a/libmatrix-hook.so",
                        "lib/arm64-v8a/libmain.so",
                        "lib/arm64-v8a/libmain_orig.so"]:
                  ok = n in names
                  sz_kb = (vz.getinfo(n).file_size//1024) if ok else 0
                  print(f"  {'OK' if ok else 'MISS'} {n}  ({sz_kb} KB)")
          PYEOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-modded-unsigned
          path: subway_modded_unsigned.apk
          retention-days: 7

      - name: Summary
        run: |
          echo "## Subway Surfers — Dobby + ImGui Mod Menu" >> $GITHUB_STEP_SUMMARY
          echo "| File | Role |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| libmatrix-hook.so | Hook — Dobby patches + ImGui GL overlay |" >> $GITHUB_STEP_SUMMARY
          echo "| libmain.so | C stub — loads matrix-hook via absolute path |" >> $GITHUB_STEP_SUMMARY
          echo "| libmain_orig.so | Original Unity libmain |" >> $GITHUB_STEP_SUMMARY

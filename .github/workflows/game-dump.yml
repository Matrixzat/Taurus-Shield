name: Game Dump (IL2CPP Analyser)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the game APK (from analyze-queue release)'
        required: true
      job_id:
        description: 'Tracking ID — used to name the output artifact'
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download input file
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.bin
          echo "Downloaded: $(du -sh input.bin)"

      - name: Extract IL2CPP files
        run: |
          python3 - <<'EOF'
          import zipfile, os, sys
          os.makedirs("il2cpp", exist_ok=True)
          with zipfile.ZipFile("input.bin") as z:
              names = z.namelist()
              print(f"Entries: {len(names)}")
              for n in names[:10]:
                  print(f"  {n}")
              slim_so   = "libil2cpp.so"        if "libil2cpp.so"        in names else None
              slim_meta = "global-metadata.dat" if "global-metadata.dat" in names else None
              if slim_so and slim_meta:
                  print("Format: SLIM ZIP")
                  for src, dst in [(slim_so, "il2cpp/libil2cpp.so"),
                                   (slim_meta, "il2cpp/global-metadata.dat")]:
                      data = z.read(src)
                      with open(dst, "wb") as f: f.write(data)
                      print(f"  {src} -> {dst}  ({len(data)//1024} KB)")
              else:
                  print("Format: FULL APK — scanning…")
                  il2cpp_c = sorted([n for n in names if "libil2cpp.so" in n],
                                    key=lambda x: 0 if "arm64" in x else 1)
                  meta_c   = [n for n in names if "global-metadata.dat" in n]
                  if not il2cpp_c: print("ERROR: libil2cpp.so not found"); sys.exit(1)
                  if not meta_c:   print("ERROR: global-metadata.dat not found"); sys.exit(1)
                  for src, dst in [(il2cpp_c[0], "il2cpp/libil2cpp.so"),
                                   (meta_c[0],   "il2cpp/global-metadata.dat")]:
                      data = z.read(src)
                      with open(dst, "wb") as f: f.write(data)
                      print(f"  {src} -> {dst}  ({len(data)//1024} KB)")
          for f in os.listdir("il2cpp"):
              print(f"  il2cpp/{f}  {os.path.getsize('il2cpp/'+f)//1024} KB")
          EOF

      # ── Detect metadata version ──────────────────────────────────────────
      - name: Detect metadata version
        id: meta
        run: |
          python3 - <<'EOF'
          import struct
          with open("il2cpp/global-metadata.dat", "rb") as f:
              raw = f.read(8)
          magic   = struct.unpack("<I", raw[:4])[0]
          version = struct.unpack("<i", raw[4:8])[0]
          # Both 0xFAB11BFA (older Unity) and 0xFAB11BAF (Unity 2022+) are valid
          VALID = {0xFAB11BFA, 0xFAB11BAF}
          print(f"Magic: 0x{magic:08X} ({'OK' if magic in VALID else 'WARNING: unknown magic'})")
          print(f"Metadata version: {version}")
          with open("/tmp/meta_version.txt", "w") as f:
              f.write(str(version))
          EOF
          VERSION=$(cat /tmp/meta_version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Metadata version: $VERSION"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ════════════════════════════════════════════════════════════════════
      # PRIMARY: Il2CppDumper — metadata v16 / v19–v24 / v27 / v29 / v31
      # ════════════════════════════════════════════════════════════════════
      - name: Get Il2CppDumper version
        id: il2cpp_ver
        run: |
          TAG=$(curl -s https://api.github.com/repos/AndnixSH/Il2CppDumper/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG=$(curl -s "https://api.github.com/repos/AndnixSH/Il2CppDumper/releases?per_page=5" \
              | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin) if x.get('tag_name')]; print(r[0]['tag_name'] if r else '')" 2>/dev/null || true)
          fi
          [ -z "$TAG" ] && TAG="v6.7.46"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Il2CppDumper: $TAG"

      - name: Restore Il2CppDumper cache
        id: cache_dumper
        uses: actions/cache@v4
        with:
          path: Il2CppDumper
          key: il2cppdumper-linux-x64-${{ steps.il2cpp_ver.outputs.tag }}

      - name: Download Il2CppDumper
        if: steps.cache_dumper.outputs.cache-hit != 'true'
        run: |
          LATEST=$(curl -s https://api.github.com/repos/AndnixSH/Il2CppDumper/releases/latest \
            | python3 -c "import sys,json; assets=[a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'linux-x64' in a['name']]; print(assets[0])")
          echo "Downloading: $LATEST"
          curl -L "$LATEST" -o Il2CppDumper.zip
          unzip -q Il2CppDumper.zip -d Il2CppDumper
          chmod +x Il2CppDumper/Il2CppDumper 2>/dev/null || chmod +x Il2CppDumper/* 2>/dev/null || true
          ls -la Il2CppDumper/

      - name: Ensure Il2CppDumper is executable
        run: chmod +x Il2CppDumper/Il2CppDumper 2>/dev/null || chmod +x Il2CppDumper/* 2>/dev/null || true

      - name: Run Il2CppDumper
        id: run_dumper
        run: |
          mkdir -p dump_out
          EXE=$(find Il2CppDumper -maxdepth 1 -type f -name "Il2CppDumper" | head -1)
          [ -z "$EXE" ] && EXE=$(find Il2CppDumper -maxdepth 1 -type f ! -name "*.dll" ! -name "*.so" ! -name "*.json" | head -1)
          echo "Running: $EXE"
          "$EXE" il2cpp/libil2cpp.so il2cpp/global-metadata.dat dump_out/ 2>&1 | tee dumper_output.txt || true
          if grep -q "not a supported version" dumper_output.txt; then
            VER=$(grep -oP 'not a supported version\[\K[^\]]+' dumper_output.txt | head -1)
            echo "Il2CppDumper: unsupported metadata v${VER} — switching to Cpp2IL"
            echo "needs_cpp2il=true"  >> $GITHUB_OUTPUT
          else
            echo "needs_cpp2il=false" >> $GITHUB_OUTPUT
          fi
          ls -la dump_out/ 2>/dev/null || echo "(empty)"

      # ════════════════════════════════════════════════════════════════════
      # FALLBACK: Cpp2IL pre-release.21
      # Handles v29.2, v39 (Unity 2023.x / Unity 6) and all future versions.
      # Correct flags: --game-path + --force-binary-path + --force-metadata-path
      # ════════════════════════════════════════════════════════════════════
      - name: Restore Cpp2IL cache
        id: cache_cpp2il
        if: steps.run_dumper.outputs.needs_cpp2il == 'true'
        uses: actions/cache@v4
        with:
          path: Cpp2IL-bin
          key: cpp2il-linux-2022.1.0-pre-release.21

      - name: Download Cpp2IL
        if: steps.run_dumper.outputs.needs_cpp2il == 'true' && steps.cache_cpp2il.outputs.cache-hit != 'true'
        run: |
          TAG="2022.1.0-pre-release.21"
          URL="https://github.com/SamboyCoding/Cpp2IL/releases/download/${TAG}/Cpp2IL-${TAG}-Linux"
          mkdir -p Cpp2IL-bin
          curl -L "$URL" -o Cpp2IL-bin/Cpp2IL --progress-bar
          chmod +x Cpp2IL-bin/Cpp2IL
          ls -lh Cpp2IL-bin/

      - name: Run Cpp2IL
        if: steps.run_dumper.outputs.needs_cpp2il == 'true'
        run: |
          echo "Running Cpp2IL for metadata v${{ steps.meta.outputs.version }}..."
          mkdir -p cpp2il_raw dump_out

          # Cpp2IL needs --game-path (even a stub), then override binary/metadata with --force-* flags
          mkdir -p gpath
          touch gpath/GameData.exe

          ABSO=$(pwd)/il2cpp/libil2cpp.so
          ABSM=$(pwd)/il2cpp/global-metadata.dat

          ./Cpp2IL-bin/Cpp2IL \
            --game-path        gpath \
            --exe-name         GameData \
            --force-binary-path   "$ABSO" \
            --force-metadata-path "$ABSM" \
            --force-unity-version 2022.3.0 \
            --use-processor    dumper \
            --output-to        cpp2il_raw \
            2>&1 | tee cpp2il_output.txt || true

          cat cpp2il_output.txt >> dumper_output.txt

          echo "=== cpp2il_raw tree ==="
          find cpp2il_raw -type f 2>/dev/null | head -30 || echo "(empty)"

          # Flatten Cpp2IL output into dump_out/
          DUMPCS=$(find cpp2il_raw -name "dump.cs" 2>/dev/null | head -1)
          [ -n "$DUMPCS" ] && cp "$DUMPCS" dump_out/dump.cs && echo "Copied dump.cs from $DUMPCS"

          for fname in ida.py ida_with_struct.py ghidra.py il2cpp.h script.json stringliteral.json; do
            SRC=$(find cpp2il_raw -name "$fname" 2>/dev/null | head -1)
            [ -n "$SRC" ] && cp "$SRC" "dump_out/$fname" && echo "Copied $fname"
          done

          echo "=== dump_out after Cpp2IL ==="
          ls -la dump_out/

      # ════════════════════════════════════════════════════════════════════
      # COMMON: recover + parse + upload
      # ════════════════════════════════════════════════════════════════════
      - name: Recover missing script files from script.json
        run: |
          python3 - <<'PYEOF'
          import json, os
          sj = "dump_out/script.json"
          if not os.path.exists(sj):
              print("script.json not found — nothing to recover"); exit(0)
          with open(sj, encoding="utf-8") as f:
              raw = json.load(f)
          entries = [e for e in (raw if isinstance(raw, list) else []) if isinstance(e, dict)]
          print(f"script.json: {len(entries)} entries")
          def _get(e): return e.get("Address") or e.get("address",0), e.get("Name") or e.get("name","")
          def _hdr(p):
              if os.path.exists(p):
                  with open(p, encoding="utf-8") as f: return f.read().strip()+"\n\n"
              return "import idc\ndef SetScriptAddressComments(d):\n    for ea,n in d.items(): idc.set_name(ea,n,idc.SN_CHECK)\n\n"
          for fname, hdr_path, var, footer in [
              ("ida.py",            "Il2CppDumper/ida.py",            "method_dict", "SetScriptAddressComments(method_dict)\n"),
              ("ida_with_struct.py","Il2CppDumper/ida_with_struct.py","method_dict", "SetScriptAddressComments(method_dict)\n"),
          ]:
              if os.path.exists(f"dump_out/{fname}"): print(f"{fname} exists"); continue
              hdr = _hdr(hdr_path)
              lines = [hdr, f"{var} = {{\n"]
              for e in entries:
                  addr, name = _get(e)
                  if addr and name:
                      lines.append(f"    {addr}: '{name.replace(chr(39), chr(92)+chr(39))}',\n")
              lines.append(f"}}\n{footer}")
              with open(f"dump_out/{fname}", "w", encoding="utf-8") as f: f.writelines(lines)
              print(f"Generated {fname}")
          if not os.path.exists("dump_out/ghidra.py"):
              hdr = _hdr("Il2CppDumper/ghidra.py") if os.path.exists("Il2CppDumper/ghidra.py") else "# Ghidra\ndef run(): pass\n\n"
              lines = [hdr, "METHOD_DICT = {\n"]
              for e in entries:
                  addr, name = _get(e)
                  if addr and name:
                      lines.append(f"    {addr}: '{name.replace(chr(39), chr(92)+chr(39))}',\n")
              lines.append("}\nrun()\n")
              with open("dump_out/ghidra.py","w",encoding="utf-8") as f: f.writelines(lines)
              print(f"Generated ghidra.py")
          for fn in sorted(os.listdir("dump_out")):
              print(f"  {fn}  {os.path.getsize('dump_out/'+fn)//1024} KB")
          PYEOF

      - name: Parse dump → offsets.json
        run: |
          python3 - <<'EOF'
          import re, json, os, sys
          if os.path.exists("dumper_output.txt"):
              out = open("dumper_output.txt").read().strip()
              print("=== Dumper log ==="); print(out[-3000:] if len(out)>3000 else out); print("==================")
          dump_file = "dump_out/dump.cs"
          if not os.path.exists(dump_file):
              sj = "dump_out/script.json"
              if os.path.exists(sj):
                  data = json.load(open(sj)); print(f"Fallback: script.json {len(data)} entries")
                  json.dump(data, open("offsets.json","w"), indent=2); sys.exit(0)
              out_files = os.listdir("dump_out") if os.path.isdir("dump_out") else []
              log = open("dumper_output.txt").read() if os.path.exists("dumper_output.txt") else "no log"
              json.dump({"error":"Dumper produced no output","dump_out_files":out_files,
                         "dumper_log":log[-2000:],"total_methods":0,"interesting_methods":[],"all_methods":[]},
                        open("offsets.json","w"), indent=2)
              print("Wrote error offsets.json"); sys.exit(0)
          methods, current_class, pending = [], "", None
          with open(dump_file, encoding="utf-8", errors="replace") as f:
              for line in f:
                  cm = re.match(r'^\s*(?:public |private |protected |internal |sealed |abstract )*(?:class|struct|interface)\s+(\w+)', line)
                  if cm: current_class = cm.group(1)
                  mm = re.search(r'//\s*RVA:\s*(0x[0-9A-Fa-f]+)\s+Offset:\s*(0x[0-9A-Fa-f]+)', line)
                  if mm: pending = {"rva":mm.group(1),"offset":mm.group(2),"class":current_class}; continue
                  if pending is not None:
                      sig = re.search(r'(\w[\w\s\*<>\[\],.]+)\s+(\w+)\s*\(([^)]*)\)', line)
                      if sig and not line.strip().startswith("//"):
                          pending.update({"method":sig.group(2).strip(),"return_type":sig.group(1).strip(),
                                          "params":sig.group(3).strip(),"signature":line.strip()})
                          methods.append(pending)
                      pending = None
          kw = {"coin":9,"gold":9,"gem":9,"diamond":9,"money":8,"cash":8,"unlock":8,"premium":8,"vip":7,
                "affor":9,"enough":7,"cost":6,"speed":7,"damage":6,"health":6,"hp":6,"score":7,"point":6,
                "reward":7,"chest":7,"pickup":6,"cooldown":7,"infinite":10,"unlimited":10,"invincib":10,
                "revive":8,"cheat":10,"hack":10,"spawn":6,"max":5,"save":4,"load":4,"add":2,"set":2,"get":1}
          for m in methods:
              t = (m.get("method","")+" "+m.get("class","")).lower()
              m["interest_score"] = sum(p for k,p in kw.items() if k in t)
          methods.sort(key=lambda x: -x["interest_score"])
          top = [m for m in methods if m["interest_score"]>0][:500]
          game_cls = [m for m in methods if any(k in m.get("class","").lower()
                      for k in ["game","runner","player","character","coin","score","enemy","level","spawn"])]
          json.dump({"total_methods":len(methods),"interesting_methods":top,
                     "game_class_methods":game_cls,"all_methods":methods},
                    open("offsets.json","w"), indent=2)
          print(f"offsets.json: {len(top)} interesting / {len(methods)} total methods")
          EOF

      - name: Prepare artifact directory
        run: |
          cp offsets.json dump_out/offsets.json
          echo "=== Artifact contents ===" && ls -la dump_out/

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-dump-${{ inputs.job_id }}
          path: |
            dump_out/**
            !dump_out/DummyDlls/**
          retention-days: 7

      - name: Delete input asset
        run: |
          curl -s -L -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}"
          echo "Input asset deleted"

      - name: Summary
        run: |
          META="${{ steps.meta.outputs.version }}"
          CPP="${{ steps.run_dumper.outputs.needs_cpp2il }}"
          [ "$CPP" = "true" ] \
            && TOOL="Cpp2IL pre-release.21 (metadata v${META} — Unity 2023+/Unity 6)" \
            || TOOL="Il2CppDumper ${{ steps.il2cpp_ver.outputs.tag }} (metadata v${META})"
          echo "## Game Dump Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID:** ${{ inputs.job_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool:** $TOOL" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** game-dump-${{ inputs.job_id }} (7-day retention)" >> $GITHUB_STEP_SUMMARY
          [ -f offsets.json ] && echo "- **offsets.json:** $(du -sh offsets.json | cut -f1)" >> $GITHUB_STEP_SUMMARY || true
          echo "- **Files:** $(ls dump_out/ 2>/dev/null | tr '\n' ' ' || echo empty)" >> $GITHUB_STEP_SUMMARY

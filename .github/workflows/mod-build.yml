name: Mod Builder (Unity IL2CPP — Static Patch)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the game APK (from analyze-queue release)'
        required: true
      job_id:
        description: 'Tracking ID — used to name the output asset'
        required: true
      game_name:
        description: 'Game name (no spaces)'
        required: true
        default: 'game'
      features_json:
        description: |
          JSON array of patches. Each entry:
            { "name": "...", "file_offset": "0xHEX", "type": "int|void|float", "value": N }
          file_offset = the Offset field from il2cpp dump (NOT RVA).
          type=int   → MOVZ W0, #lo  /  MOVK W0, #hi, LSL16  /  RET  (returns value as int)
          type=void  → RET  (no-op, suppresses the function)
          type=float → embeds IEEE-754 float via LDR S0 + RET
        required: true
        default: '[]'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Get analyze-queue release ID
        id: release
        run: |
          RELEASE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/analyze-queue")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "Using release ID: $RELEASE_ID"

      - name: Download game APK
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o game.apk
          echo "APK size: $(du -sh game.apk)"

      - name: Static-patch libil2cpp.so and repack APK
        run: |
          python3 - <<'PYEOF'
          import json, os, struct, shutil, zipfile

          features_raw = os.environ.get("FEATURES_JSON", "[]")
          game_name    = os.environ.get("GAME_NAME", "game")

          try:
              features = json.loads(features_raw)
          except Exception as e:
              print(f"WARN: could not parse features JSON: {e}")
              features = []

          # ── ARM64 instruction builders ─────────────────────────────────────────
          def movz_w0(imm16, shift=0):
              """MOVZ W0, #imm16, LSL #shift"""
              hw    = shift // 16
              instr = (0b0_10_100101 << 23) | (hw << 21) | ((imm16 & 0xFFFF) << 5) | 0
              return struct.pack('<I', instr)

          def movk_w0(imm16, shift=0):
              """MOVK W0, #imm16, LSL #shift"""
              hw    = shift // 16
              instr = (0b0_11_100101 << 23) | (hw << 21) | ((imm16 & 0xFFFF) << 5) | 0
              return struct.pack('<I', instr)

          RET = struct.pack('<I', 0xD65F03C0)   # RET (ARM64)
          NOP = struct.pack('<I', 0xD503201F)   # NOP (ARM64)

          def patch_for(ftype, value):
              """Return the bytes to write at the function's file offset."""
              if ftype == "void":
                  # No-op: just return immediately
                  return RET

              elif ftype in ("int", "long", "bool"):
                  val = int(value)
                  if val == 0:
                      # MOV W0, #0 is MOVZ W0, #0
                      return movz_w0(0) + RET + NOP
                  elif val == 1 and ftype == "bool":
                      return movz_w0(1) + RET + NOP
                  else:
                      lo = val & 0xFFFF
                      hi = (val >> 16) & 0xFFFF
                      if hi == 0:
                          return movz_w0(lo) + RET + NOP
                      else:
                          return movz_w0(lo) + movk_w0(hi, 16) + RET

              elif ftype == "float":
                  # Pack IEEE-754 float as uint32, load via literal pool
                  # Pattern: LDR W0, #8  / RET / NOP / .float value
                  # LDR W0, #8 (PC-relative, offset=2 instructions = 8 bytes ahead):
                  # encoding: 0x18000040 (LDR W0, [PC, #8])
                  fval = float(value)
                  raw  = struct.pack('<f', fval)
                  ldr  = struct.pack('<I', 0x18000040)  # LDR W0, [PC, #8]
                  # Now move W0 into S0 (FMOV S0, W0):
                  fmov = struct.pack('<I', 0x1E270000)  # FMOV S0, W0
                  return ldr + fmov + RET + raw

              return b''   # unknown type — skip

          # ── Extract APK ────────────────────────────────────────────────────────
          os.makedirs("apk_work", exist_ok=True)
          with zipfile.ZipFile("game.apk") as z:
              z.extractall("apk_work")
          print("APK extracted.")

          # ── Apply patches to libil2cpp.so for each ABI ─────────────────────────
          abis = ["arm64-v8a", "armeabi-v7a"]
          for abi in abis:
              il2cpp = f"apk_work/lib/{abi}/libil2cpp.so"
              if not os.path.exists(il2cpp):
                  print(f"[{abi}] libil2cpp.so not found — skipping")
                  continue

              with open(il2cpp, "r+b") as f:
                  file_size = os.path.getsize(il2cpp)
                  print(f"\n[{abi}] libil2cpp.so — {file_size:,} bytes")

                  for feat in features:
                      name        = feat.get("name", "?")
                      offset_str  = feat.get("file_offset", feat.get("offset", "0x0"))
                      ftype       = feat.get("type", "int")
                      value       = feat.get("value", feat.get("max_val", 0))

                      try:
                          file_offset = int(offset_str, 16)
                      except Exception:
                          print(f"  SKIP {name}: bad offset '{offset_str}'")
                          continue

                      if file_offset >= file_size:
                          print(f"  SKIP {name}: offset 0x{file_offset:X} >= file size")
                          continue

                      patch_bytes = patch_for(ftype, value)
                      if not patch_bytes:
                          print(f"  SKIP {name}: unknown type '{ftype}'")
                          continue

                      # Read original bytes for logging
                      f.seek(file_offset)
                      orig = f.read(len(patch_bytes))

                      # Write patch
                      f.seek(file_offset)
                      f.write(patch_bytes)

                      print(f"  ✅ {name} @ 0x{file_offset:X}  "
                            f"orig={orig.hex()}  →  patch={patch_bytes.hex()}")

          # ── Re-pack APK preserving original compression per file ───────────────
          orig_compress = {}
          with zipfile.ZipFile("game.apk") as orig_z:
              for info in orig_z.infolist():
                  orig_compress[info.filename] = info.compress_type

          out = f"{game_name}_unsigned.apk"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk("apk_work"):
                  for fname in files:
                      fp  = os.path.join(root, fname)
                      arc = os.path.relpath(fp, "apk_work")
                      # .so files must stay uncompressed for the dynamic linker
                      if arc.endswith(".so"):
                          compress = zipfile.ZIP_STORED
                      elif arc in orig_compress:
                          compress = orig_compress[arc]
                      else:
                          compress = zipfile.ZIP_DEFLATED
                      z.write(fp, arc, compress)

          sz = os.path.getsize(out)
          print(f"\nUnsigned APK: {out}  ({sz//1024//1024} MB)")
          PYEOF
        env:
          FEATURES_JSON: ${{ inputs.features_json }}
          GAME_NAME: ${{ inputs.game_name }}

      - name: Upload modded APK to analyze-queue release
        run: |
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          JOB_ID="${{ inputs.job_id }}"
          APK="${{ inputs.game_name }}_unsigned.apk"

          ASSET_NAME="modded_${JOB_ID}.apk"
          echo "Uploading $ASSET_NAME ($(du -sh $APK | cut -f1))..."
          curl -s -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$ASSET_NAME" \
            --data-binary @"$APK" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Uploaded — asset_id:', d.get('id','error'))"

      - name: Delete input APK asset
        run: |
          curl -s -L -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}"
          echo "Input APK deleted"

      - name: Summary
        run: |
          echo "## Mod Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Game:** ${{ inputs.game_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID:** ${{ inputs.job_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Method:** Direct static binary patch of libil2cpp.so" >> $GITHUB_STEP_SUMMARY

name: Build Taurus Shield APK

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID of the uploaded project ZIP'
        required: true
      job_id:
        description: 'Job correlation ID for artifact naming'
        required: true

jobs:
  build:
    name: Flutter Build (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download project ZIP from release
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" \
            -o project.zip
          echo "Downloaded: $(ls -lh project.zip)"
          unzip -q project.zip -d project/
          echo "Contents:"
          ls project/

      - name: Locate Flutter project root
        id: locate
        run: |
          ROOT=$(find project/ -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "Flutter root: $ROOT"
          echo "flutter_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.29.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Set up key.properties for signing
        working-directory: ${{ steps.locate.outputs.flutter_root }}
        run: |
          KEYSTORE=$(find . -name "*.keystore" | head -1)
          echo "Found keystore: $KEYSTORE"
          cat > android/key.properties <<EOF
          storePassword=Matrix@2026
          keyPassword=Matrix@2026
          keyAlias=matrix_hbc_key
          storeFile=../../$(basename $KEYSTORE)
          EOF
          echo "key.properties written"

      - name: Get dependencies
        working-directory: ${{ steps.locate.outputs.flutter_root }}
        run: flutter pub get

      - name: Build release APK (arm64)
        working-directory: ${{ steps.locate.outputs.flutter_root }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info
          echo "Build complete:"
          ls -lh build/app/outputs/flutter-apk/

      - name: Sign APK with keystore
        working-directory: ${{ steps.locate.outputs.flutter_root }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE=$(find . -name "*.keystore" | head -1)
          jarsigner -verbose \
            -keystore "$KEYSTORE" \
            -storepass "Matrix@2026" \
            -keypass "Matrix@2026" \
            -signedjar "$APK" \
            "$APK" \
            "matrix_hbc_key"
          echo "Signed APK size: $(ls -lh $APK | awk '{print $5}')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ github.event.inputs.job_id }}
          path: ${{ steps.locate.outputs.flutter_root }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Delete input ZIP asset
        if: always()
        run: |
          curl -fsSL -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" || true

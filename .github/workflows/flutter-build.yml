name: Build Taurus Shield APK

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded project ZIP'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Download project ZIP
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o project.zip
          echo "Downloaded: $(ls -lh project.zip)"
          file project.zip

      - name: Delete uploaded asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Upload slot cleaned up"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o project.zip -d project
          echo "=== Extracted top-level ==="
          ls project/
          PROJECT_DIR=$(find project/ -maxdepth 4 -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "Flutter project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          ls "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK 27.0.12077973
        run: |
          echo "y" | sdkmanager "ndk;27.0.12077973" 2>/dev/null || true
          NDK_PATH="$ANDROID_HOME/ndk/27.0.12077973"
          if [ -d "$NDK_PATH" ]; then
            echo "NDK installed at $NDK_PATH"
          else
            echo "WARNING: NDK not found at $NDK_PATH — falling back to default NDK"
            NDK_PATH=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | tail -1)
            echo "Using NDK: $NDK_PATH"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up Flutter 3.29.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Write local.properties
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/android/local.properties"
          echo "flutter.sdk=$FLUTTER_SDK" >> "$PROJECT_DIR/android/local.properties"
          echo "=== local.properties ==="
          cat "$PROJECT_DIR/android/local.properties"

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --target-platform android-arm64 2>&1 | tee "$GITHUB_WORKSPACE/flutter_build.log"
          exit ${PIPESTATUS[0]}
        timeout-minutes: 75

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR/build/" -name "*.apk" \
            -not -path "*/intermediates/*" \
            -not -path "*/tmp/*" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            find "$PROJECT_DIR/build/" -name "*.apk" 2>/dev/null | head -20
            exit 1
          fi
          echo "Built APK: $APK ($(du -sh "$APK" | cut -f1))"
          mkdir -p output
          cp "$APK" output/taurus-shield.apk
          echo "APK ready: $(ls -lh output/taurus-shield.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taurus-shield-${{ inputs.job_id }}
          path: output/taurus-shield.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.job_id }}
          path: flutter_build.log
          retention-days: 1

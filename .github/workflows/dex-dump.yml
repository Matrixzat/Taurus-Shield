name: DEX Dump (Frida Memory Extract)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded APK (from analyze-queue release)'
        required: true
      job_id:
        description: 'Tracking ID — used to name the output artifact'
        required: true

jobs:
  dex-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from release
        run: |
          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.apk
          echo "Downloaded: $(du -sh input.apk)"
          file input.apk

      - name: Extract package name from APK
        id: pkg
        run: |
          PKG=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id input.apk 2>/dev/null || true)
          if [ -z "$PKG" ] || echo "$PKG" | grep -qi "error"; then
            PKG=$(python3 .github/scripts/extract_pkg.py input.apk 2>/dev/null || true)
          fi
          echo "Package name: [$PKG]"
          if [ -z "$PKG" ]; then
            echo "ERROR: Could not determine package name"
            exit 1
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get latest Frida version
        id: frida-ver
        run: |
          VER=$(curl -sf https://api.github.com/repos/frida/frida/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Frida version: $VER"

      - name: Cache Frida server binary
        id: frida-cache
        uses: actions/cache@v4
        with:
          path: frida-server-bin
          key: frida-server-${{ steps.frida-ver.outputs.version }}-android-x86_64

      - name: Download Frida server (x86_64 for emulator)
        if: steps.frida-cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ steps.frida-ver.outputs.version }}"
          curl -fL "https://github.com/frida/frida/releases/download/${VER}/frida-server-${VER}-android-x86_64.xz" -o frida-server.xz
          xz -d frida-server.xz
          mv frida-server frida-server-bin
          chmod +x frida-server-bin
          echo "Frida server downloaded and ready"

      - name: Ensure frida-server is executable
        run: chmod +x frida-server-bin

      - name: Cache pip frida-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-frida-tools-${{ steps.frida-ver.outputs.version }}-${{ runner.os }}

      - name: Install Frida Python tools (host)
        run: pip install "frida-tools~=14.0" "frida==${{ steps.frida-ver.outputs.version }}"

      - name: Cache Android AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29-x86_64-google_apis-${{ runner.os }}

      - name: Create AVD (if not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and cached."

      - name: Run DEX dump inside Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run_dump.sh "${{ steps.pkg.outputs.package }}"

      - name: Package DEX output
        if: always()
        run: |
          PKG="${{ steps.pkg.outputs.package }}"
          JOB="${{ inputs.job_id }}"
          mkdir -p final_output
          find dex_output -type f 2>/dev/null | while read f; do cp "$f" final_output/; done
          cp frida_output.txt final_output/frida_log.txt 2>/dev/null || true
          DEX_COUNT=$(find final_output -name '*.dex' 2>/dev/null | wc -l)
          printf "Package : %s\nJob ID  : %s\nDEX files dumped: %s\n" "$PKG" "$JOB" "$DEX_COUNT" > final_output/dump_info.txt
          cat final_output/dump_info.txt
          find final_output -type f | sort

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-dump-${{ inputs.job_id }}
          path: final_output/
          retention-days: 3

      - name: Delete uploaded APK asset
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Asset cleaned up"

      - name: Summary
        if: always()
        run: |
          DEX_COUNT=$(find final_output -name '*.dex' 2>/dev/null | wc -l)
          echo "## DEX Dump - ${{ steps.pkg.outputs.package }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID:** ${{ inputs.job_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **DEX files dumped:** $DEX_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Method:** Frida attach + ClassLinker::DefineClass hook" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** dex-dump-${{ inputs.job_id }} (3-day retention)" >> $GITHUB_STEP_SUMMARY

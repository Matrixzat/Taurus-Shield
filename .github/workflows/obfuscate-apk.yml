name: APK Obfuscator (Chinese + String Encryption)

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID of the uploaded APK ZIP'
        required: true
      job_id:
        description: 'Job correlation ID for artifact naming'
        required: true
      classes_filter:
        description: 'JSON array of class paths to obfuscate (empty = obfuscate all)'
        required: false
        default: ''

jobs:
  obfuscate:
    name: Chinese Obfuscation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Download APK ZIP from release
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" \
            -o input.zip
          echo "Downloaded: $(ls -lh input.zip)"
          unzip -q input.zip -d extracted/
          curl -fsSL -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" || true
          rm -f input.zip
          APK_FILE=$(find extracted/ -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found in ZIP"
            exit 1
          fi
          cp "$APK_FILE" input.apk
          echo "APK: $APK_FILE ($(ls -lh input.apk | awk '{print $5}'))"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache apktool
        uses: actions/cache@v4
        id: cache-apktool
        with:
          path: /usr/local/bin/apktool.jar
          key: apktool-2.10.0

      - name: Cache apt packages
        uses: actions/cache@v4
        id: cache-apt
        with:
          path: /var/cache/apt/archives
          key: apt-obfuscate-${{ runner.os }}-zipalign-apksigner

      - name: Install tools
        run: |
          APKTOOL_VER="2.10.0"
          if [ "${{ steps.cache-apktool.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL -o /usr/local/bin/apktool.jar \
              "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar"
          fi
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update -qq
          fi
          sudo apt-get install -y -qq --no-upgrade zipalign apksigner python3
          cat > /tmp/apktool_wrap << 'EOF'
          #!/bin/bash
          exec java -jar /usr/local/bin/apktool.jar "$@"
          EOF
          chmod +x /tmp/apktool_wrap
          sudo mv /tmp/apktool_wrap /usr/local/bin/apktool
          apktool --version

      - name: Decompile APK
        run: |
          apktool d input.apk -o decompiled/ --no-res -f
          echo "Smali dirs: $(ls decompiled/ | grep smali)"

      - name: Apply Chinese obfuscation
        run: |
          cat > /tmp/obfuscate.py << 'PYEOF'
          import os, re, random, sys, hashlib, json

          ROOT = 'decompiled'

          # ── Classes filter (manual mode) ─────────────────────────────────────
          CLASSES_FILTER_RAW = os.environ.get('CLASSES_FILTER', '').strip()
          CLASSES_FILTER = set()
          if CLASSES_FILTER_RAW:
              try:
                  parsed = json.loads(CLASSES_FILTER_RAW)
                  CLASSES_FILTER = set(parsed)
                  print(f'[+] Manual mode: will obfuscate {len(CLASSES_FILTER)} specific classes')
              except Exception as e:
                  print(f'[!] Could not parse classes_filter ({e}), falling back to full mode')
          else:
              print(f'[+] Full mode: obfuscating all classes')
          SMALI_DIRS = [d for d in os.listdir(ROOT) if d.startswith('smali')]

          # CJK Unified Ideographs range (4E00-9FFF) — 20,902 chars
          CJK_START = 0x4E00
          CJK_END   = 0x9FFF
          CJK_RANGE = list(range(CJK_START, CJK_END + 1))
          random.seed(42)

          def rand_cjk(length=3):
              return ''.join(chr(random.choice(CJK_RANGE)) for _ in range(length))

          def collect_smali_files():
              files = []
              for sd in SMALI_DIRS:
                  sd_path = os.path.join(ROOT, sd)
                  for dirpath, _, fnames in os.walk(sd_path):
                      for f in fnames:
                          if f.endswith('.smali'):
                              files.append(os.path.join(dirpath, f))
              return files

          print(f'[+] Scanning smali files...')
          smali_files = collect_smali_files()
          print(f'[+] Found {len(smali_files)} smali files')

          # ── Phase 1: collect class names to rename ──────────────────────────
          class_map = {}   # old_class_path -> new_class_path

          SKIP_PREFIXES = [
              'Landroid/', 'Ljava/', 'Ljavax/', 'Ldalvik/', 'Lcom/google/android/',
              'Lcom/android/', 'Landroidx/', 'Lkotlin/', 'Lkotlinx/',
              'Lcom/squareup/', 'Lokhttp3/', 'Lretrofit2/', 'Lrx/',
          ]
          def should_skip_class(cls):
              for p in SKIP_PREFIXES:
                  if cls.startswith(p):
                      return True
              return False

          print(f'[+] Phase 1: Mapping class names...')
          for fpath in smali_files:
              with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                  first_line = ''
                  for line in f:
                      first_line = line.strip()
                      break
              m = re.match(r'^\.class\s+(?:[\w\s]+\s+)?(\S+;)', first_line)
              if not m:
                  continue
              cls = m.group(1)
              if should_skip_class(cls):
                  continue
              # Manual mode: only process selected classes
              if CLASSES_FILTER and cls[1:-1] not in CLASSES_FILTER:
                  continue
              # Extract package and class name
              slash_idx = cls.rfind('/')
              if slash_idx < 0:
                  continue
              pkg  = cls[:slash_idx + 1]   # e.g. Lcom/example/
              name = cls[slash_idx + 1:-1]  # e.g. MyClass
              if '$' in name:
                  # Inner class — rename just the inner part
                  parts = name.split('$')
                  new_parts = []
                  for p in parts:
                      if p.isdigit() or p == '':
                          new_parts.append(p)
                      else:
                          h = hashlib.md5((cls + p).encode()).hexdigest()[:4]
                          new_parts.append(rand_cjk(2) + h)
                  new_name = '$'.join(new_parts)
              else:
                  h = hashlib.md5(cls.encode()).hexdigest()[:4]
                  new_name = rand_cjk(3) + h
              new_cls = pkg + new_name + ';'
              class_map[cls] = new_cls

          print(f'[+] Will rename {len(class_map)} classes')

          # ── Phase 2: class renaming only ────────────────────────────────────────
          # NOTE: method/field renaming is intentionally excluded. Renaming a method
          # definition without updating every call site across all smali files creates
          # DUPLICATE method references (old name in callers + new name in definition),
          # which pushes the DEX method-reference count past the 65535 hard limit and
          # causes "Unsigned short value out of range" on rebuild.

          print(f'[+] Phase 2: Applying class renames...')
          processed = 0
          skipped   = 0

          # Pre-compile a SINGLE regex that matches any old class name in one pass.
          # Sort longest-first so longer names match before shorter prefixes.
          if class_map:
              sorted_keys = sorted(class_map.keys(), key=len, reverse=True)
              class_regex = re.compile('|'.join(re.escape(k) for k in sorted_keys))
              def replace_classes(content):
                  return class_regex.sub(lambda m: class_map[m.group(0)], content)
              def has_any_ref(content):
                  return bool(class_regex.search(content))
          else:
              def replace_classes(content): return content
              def has_any_ref(content): return False

          for fpath in smali_files:
              with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                  content = f.read()

              if not has_any_ref(content):
                  skipped += 1
                  continue

              new_content = replace_classes(content)

              with open(fpath, 'w', encoding='utf-8') as f:
                  f.write(new_content)

              processed += 1
              if processed % 200 == 0:
                  print(f'  processed {processed}/{len(smali_files)} files...')

          print(f'[+] Skipped {skipped} unrelated files (no references)')
          print(f'[+] Done. Renamed {len(class_map)} classes.')
          PYEOF
          CLASSES_FILTER="${{ github.event.inputs.classes_filter }}" python3 /tmp/obfuscate.py

      - name: Promote const-string to const-string/jumbo
        run: |
          # After class renaming the string pool is reshuffled; strings that were
          # at index ≤ 65535 may now exceed it.  const-string/jumbo uses a 32-bit
          # index and is always valid, so promote every const-string instruction.
          find decompiled/ -name "*.smali" -print0 | \
            xargs -0 sed -i 's/const-string \([vp]\)/const-string\/jumbo \1/g'
          echo "Promotion complete"

      - name: Rebuild APK
        run: |
          apktool b decompiled/ -o obfuscated_unsigned.apk
          echo "Rebuilt: $(ls -lh obfuscated_unsigned.apk | awk '{print $5}')"

      - name: Align and sign APK
        run: |
          zipalign -v -p 4 obfuscated_unsigned.apk obfuscated_aligned.apk
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias taurus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass taurus123 \
            -keypass taurus123 \
            -dname "CN=Taurus, OU=Shield, O=Taurus, L=Shield, S=Shield, C=US" \
            2>/dev/null || true
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias taurus \
            --ks-pass pass:taurus123 \
            --key-pass pass:taurus123 \
            --out out.apk \
            obfuscated_aligned.apk
          echo "Signed APK: $(ls -lh out.apk | awk '{print $5}')"
          apksigner verify out.apk && echo "Signature OK"

      - name: Upload obfuscated APK
        uses: actions/upload-artifact@v4
        with:
          name: obfuscate-${{ github.event.inputs.job_id }}
          path: out.apk
          retention-days: 1

name: reFlutter Patcher

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID of the uploaded APK'
        required: true
      job_id:
        description: 'Job correlation ID for artifact naming'
        required: true

jobs:
  reflutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download uploaded APK asset
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" \
            -o input.apk
          echo "Downloaded: $(ls -lh input.apk)"
          file input.apk

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reFlutter
        run: |
          pip3 install reflutter==0.8.6
          echo "reFlutter installed"

      - name: Normalise APK for reFlutter
        run: |
          python3 - << 'PYEOF'
          import zipfile, os, shutil, sys

          src = "input.apk"
          dst = "input_fixed.apk"

          # Priority order for libapp.so architectures
          ARCH_PRIORITY = ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]

          with zipfile.ZipFile(src, "r") as zin:
              names = zin.namelist()

              # Find libapp.so — pick the best architecture available
              libapp_entry = None
              for arch in ARCH_PRIORITY:
                  candidate = f"lib/{arch}/libapp.so"
                  if candidate in names:
                      libapp_entry = candidate
                      print(f"Found libapp.so at: {candidate}")
                      break

              if libapp_entry is None:
                  # Last resort: any path containing libapp.so
                  for n in names:
                      if n.endswith("libapp.so"):
                          libapp_entry = n
                          print(f"Found libapp.so at non-standard path: {n}")
                          break

              if libapp_entry is None:
                  print("ERROR: libapp.so not found in APK at all.")
                  sys.exit(1)

              # Check if it's already at arm64-v8a and already stored (no compression)
              info = zin.getinfo(libapp_entry)
              already_ok = (
                  libapp_entry == "lib/arm64-v8a/libapp.so"
                  and info.compress_type == zipfile.ZIP_STORED
              )

              if already_ok:
                  print("APK is already in correct format — no preprocessing needed.")
                  shutil.copy(src, dst)
              else:
                  print(f"Preprocessing APK: moving/uncompressing libapp.so -> lib/arm64-v8a/libapp.so")
                  libapp_data = zin.read(libapp_entry)

                  with zipfile.ZipFile(dst, "w", allowZip64=True) as zout:
                      for item in zin.infolist():
                          data = zin.read(item.filename)

                          if item.filename == libapp_entry and libapp_entry != "lib/arm64-v8a/libapp.so":
                              # Skip the original entry — we'll write it at the canonical path
                              continue
                          elif item.filename == libapp_entry or item.filename == "lib/arm64-v8a/libapp.so":
                              # Write libapp.so as STORED (uncompressed) at arm64-v8a
                              new_info = zipfile.ZipInfo("lib/arm64-v8a/libapp.so")
                              new_info.compress_type = zipfile.ZIP_STORED
                              zout.writestr(new_info, libapp_data)
                          else:
                              # Preserve everything else as-is
                              zout.writestr(item, data)

                  # If libapp was at a different path, make sure arm64-v8a entry exists
                  if libapp_entry != "lib/arm64-v8a/libapp.so":
                      with zipfile.ZipFile(dst, "a", allowZip64=True) as zout:
                          existing = zout.namelist()
                          if "lib/arm64-v8a/libapp.so" not in existing:
                              new_info = zipfile.ZipInfo("lib/arm64-v8a/libapp.so")
                              new_info.compress_type = zipfile.ZIP_STORED
                              zout.writestr(new_info, libapp_data)

                  print("Preprocessing complete.")
                  print(f"  Original size : {os.path.getsize(src):,} bytes")
                  print(f"  Fixed size    : {os.path.getsize(dst):,} bytes")

          PYEOF

      - name: Run reFlutter
        run: |
          echo "Running reFlutter — detecting Flutter snapshot hash and patching engine..."
          echo "" | reflutter input_fixed.apk || reflutter input_fixed.apk || true
          if [ -f "release.RE.apk" ]; then
            echo "Patch applied successfully: $(du -sh release.RE.apk | cut -f1)"
          else
            echo "release.RE.apk not found — listing directory:"
            ls -lh
            exit 1
          fi

      - name: Extract snapshot hash
        run: |
          python3 - << 'PYEOF'
          import re, zipfile
          snap_hash = "unknown"
          try:
              with zipfile.ZipFile("input_fixed.apk") as zf:
                  for name in zf.namelist():
                      if name.endswith("v8a/libapp.so") or name.endswith("v7a/libapp.so"):
                          data = zf.read(name).decode("latin-1", errors="ignore")
                          matches = re.findall(r"([a-f0-9]{32})", data)
                          if matches:
                              snap_hash = matches[0]
                              break
          except Exception as e:
              print(f"Hash extraction warning: {e}")
          print(f"Snapshot Hash: {snap_hash}")
          with open("snap_hash.txt", "w") as f:
              f.write(snap_hash)
          PYEOF

      - name: Collect output
        run: |
          mkdir -p output_pkg
          cp release.RE.apk output_pkg/reflutter_patched.apk
          HASH=$(cat snap_hash.txt 2>/dev/null || echo "unknown")
          {
            echo "Tool          : reFlutter"
            echo "Snapshot Hash : $HASH"
            echo "Signed        : No (unsigned — install via adb or trusted source)"
            echo ""
            echo "NEXT STEPS:"
            echo "1. Transfer reflutter_patched.apk to your device"
            echo "2. Install:  adb install reflutter_patched.apk"
            echo "   (Uninstall the original app first if already installed)"
            echo "3. Set up your proxy tool (HTTP Toolkit, mitmproxy, Burp, etc.)"
            echo "   on the same network as your device"
            echo "4. Route device traffic through the proxy:"
            echo "   - System proxy:  Settings → WiFi → Proxy → Manual"
            echo "   - Or use HTTP Toolkit / ProxyDroid for transparent capture"
            echo "5. Launch the patched app — SSL pinning is bypassed"
            echo "6. Retrieve the Dart dump:"
            echo "   adb shell cat /data/data/<PACKAGE>/dump.dart > dump.dart"
          } > output_pkg/reflutter_info.txt
          echo "Output ready"
          ls -lh output_pkg/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflutter-${{ github.event.inputs.job_id }}
          path: output_pkg/
          retention-days: 1

      - name: Delete uploaded asset
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" \
            || true

name: ReFlutter — Flutter Engine Patch

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded APK'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true
      proxy_address:
        description: 'Proxy IP address (e.g. 192.168.1.10) — used only for mode 1, port 8083 is fixed by ReFlutter'
        required: false
        default: '127.0.0.1'

jobs:
  reflutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download uploaded APK
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.apk
          ls -lh input.apk

      - name: Delete uploaded asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true

      - name: Install tools
        run: |
          pip3 install reflutter --quiet
          echo "ReFlutter: $(pip3 show reflutter | grep -E '^Version')"
          sudo apt-get install -y --no-install-recommends zipalign apksigner 2>&1 | tail -5 || true

      - name: Run reflutter
        timeout-minutes: 12
        run: |
          PROXY="${{ inputs.proxy_address }}"
          if [ -z "$PROXY" ]; then PROXY="127.0.0.1"; fi
          echo "Traffic Intercept — proxy: $PROXY"

          printf "1\n${PROXY}\n" | reflutter input.apk 2>&1 | tee reflutter_run.log
          REFL_EXIT=${PIPESTATUS[1]}

          echo "--- Files after reflutter ---"
          find . -maxdepth 4 -type f | sort

          echo "reflutter exit: $REFL_EXIT"
          echo "EXIT=${REFL_EXIT}" >> $GITHUB_ENV

      - name: Check reflutter exit
        run: |
          echo "=== reflutter output ==="
          cat reflutter_run.log || true
          if [ "$EXIT" != "0" ]; then
            echo "reflutter exited with code $EXIT"
            exit 1
          fi

      - name: Package patched APK
        run: |
          # Look for a ready-made output APK (any .apk except input.apk)
          PATCHED=$(find . -maxdepth 4 -name "*.apk" ! -name "input.apk" 2>/dev/null | head -1)

          if [ -n "$PATCHED" ]; then
            echo "ReFlutter produced APK: $PATCHED"
          else
            echo "No output APK — repacking from release/ directory..."

            if [ ! -d release ]; then
              echo "ERROR: release/ directory is missing — reflutter failed to extract"
              ls -la
              exit 1
            fi

            echo "=== release/ tree ==="
            ls -la release/
            echo ""
            echo "=== lib/ tree ==="
            find release/lib -type f 2>/dev/null | sort || echo "(no lib dir)"

            # Repack the release/ directory into a new APK (exclude META-INF to avoid signature issues)
            cd release
            zip -r ../release-unsigned.apk . -x "META-INF/*" > /dev/null
            cd ..
            echo "Repacked size: $(du -sh release-unsigned.apk)"

            # Sign with a throwaway debug keystore
            keytool -genkeypair -keystore /tmp/debug.ks \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

            if command -v apksigner &>/dev/null; then
              apksigner sign \
                --ks /tmp/debug.ks --ks-pass pass:android --key-pass pass:android \
                --out release-signed.apk release-unsigned.apk && \
              PATCHED="release-signed.apk" || PATCHED="release-unsigned.apk"
            else
              PATCHED="release-unsigned.apk"
            fi

            echo "Final APK: $PATCHED  ($(du -sh "$PATCHED" | cut -f1))"
          fi

          mkdir -p reflutter_output
          cp "$PATCHED" reflutter_output/reflutter-patched.apk
          cp reflutter_run.log reflutter_output/ 2>/dev/null || true
          ls -lh reflutter_output/

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflutter-${{ inputs.job_id }}
          path: reflutter_output/
          if-no-files-found: error
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: |
            reflutter_run.log
          retention-days: 1

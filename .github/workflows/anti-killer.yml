name: Anti-Dialog Killer

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID containing the APK'
        required: true
      job_id:
        description: 'Job identifier for artifact naming'
        required: true
      main_activity:
        description: 'Main activity class name (e.g. com.example.MainActivity)'
        required: true
        default: ''
      sign_apk:
        description: 'Sign the rebuilt APK'
        required: false
        default: 'true'

jobs:
  patch:
    name: Anti-Dialog Killer
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download input APK from release
        run: |
          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.apk
          echo "Input size: $(du -sh input.apk)"

      - name: Download APKTool + baksmali + signer
        run: |
          curl -fsSL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar
          curl -fsSL \
            "https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar" \
            -o baksmali.jar
          curl -fsSL \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" \
            -o signer.jar
          echo "All tools ready"

      - name: Decompile APK
        run: |
          java -Xmx5g -jar apktool.jar d input.apk -o decompiled -f
          echo "Decompile complete — $(find decompiled/smali* -name '*.smali' 2>/dev/null | wc -l) smali files"

      - name: Fetch Anti-Dialog Killer DEX
        run: |
          curl -fsSL \
            "https://taurus-shield.matrixzat99.workers.dev/anti-killer-dex" \
            -H "X-Job-Id: ${{ inputs.job_id }}" \
            -o anti_dialog_killer.dex
          echo "DEX size: $(du -sh anti_dialog_killer.dex)"

      - name: Fetch and run injection script
        run: |
          curl -fsSL \
            "https://taurus-shield.matrixzat99.workers.dev/anti-killer-script" \
            -H "X-Job-Id: ${{ inputs.job_id }}" \
            -o anti-killer-script.js
          MAIN_ACTIVITY="${{ inputs.main_activity }}" \
          BAKSMALI_JAR="baksmali.jar" \
            node anti-killer-script.js decompiled/ anti_dialog_killer.dex

      - name: Recompile APK (multi-strategy)
        run: |
          mkdir -p output
          BUILD_OK=false
          for STRAT in "--use-aapt2" "" "--use-aapt2 --keep-broken-res" "--keep-broken-res"; do
            echo "Trying: java -jar apktool.jar b decompiled -o output/patched.apk $STRAT"
            if java -Xmx5g -jar apktool.jar b decompiled -o output/patched.apk $STRAT; then
              BUILD_OK=true
              echo "Build succeeded with: $STRAT"
              break
            fi
            echo "Strategy failed, trying next..."
          done
          if [ "$BUILD_OK" = false ]; then
            echo "ERROR: All build strategies failed"; exit 1
          fi

      - name: Sign APK (intermediate)
        if: inputs.sign_apk == 'true'
        run: |
          if [ ! -f output/patched.apk ]; then
            echo "ERROR: patched.apk not found"; exit 1
          fi
          java -jar signer.jar --apks output/patched.apk --out output/ --allowResign
          SIGNED=$(find output/ -name "*aligned-debugSigned*.apk" | head -1)
          if [ -n "$SIGNED" ]; then
            mv "$SIGNED" output/intermediate.apk
            rm -f output/patched.apk
          else
            mv output/patched.apk output/intermediate.apk
          fi
          echo "Intermediate APK: $(du -sh output/intermediate.apk)"

      - name: Rename unsigned APK (intermediate)
        if: inputs.sign_apk != 'true'
        run: mv output/patched.apk output/intermediate.apk

      - name: Inject integrity hashes into APK
        run: |
          node - output/intermediate.apk <<'NODE'
          const crypto  = require('crypto');
          const fs      = require('fs');
          const path    = require('path');
          const { execSync } = require('child_process');

          const APK = process.argv[2];
          const KEY = Buffer.from('SecurityGuardKey', 'utf8');
          const IV  = Buffer.from('AntiKillerIV0001', 'utf8');

          function encrypt(str) {
            const c = crypto.createCipheriv('aes-128-cbc', KEY, IV);
            return Buffer.concat([c.update(str, 'utf8'), c.final()]);
          }

          // Manifest hash (binary AndroidManifest.xml inside APK)
          let manifestHash = '';
          try {
            const raw = execSync(`unzip -p "${APK}" AndroidManifest.xml | sha256sum`).toString().trim();
            const h   = raw.split(/\s+/)[0];
            if (h && h.length === 64) manifestHash = h;
          } catch(e) { console.error('Hash error:', e.message); }
          console.log('Manifest hash:', manifestHash);

          // DEX count
          let dexCount = 1;
          try {
            const listing = execSync(`unzip -l "${APK}"`).toString();
            const matches = listing.match(/classes\d*\.dex/g) || [];
            dexCount = matches.length || 1;
          } catch(e) {}
          console.log('DEX count:', dexCount);

          // Write encrypted dat files
          fs.mkdirSync('hash_assets', { recursive: true });
          fs.writeFileSync('hash_assets/ak_mh.dat', encrypt(manifestHash));
          fs.writeFileSync('hash_assets/ak_dc.dat', encrypt(dexCount.toString()));

          // Inject into APK using zip
          execSync(`cd hash_assets && zip -j "../${APK}" ak_mh.dat ak_dc.dat`);
          console.log('Integrity hashes injected successfully.');
          NODE

      - name: Sign APK (final)
        if: inputs.sign_apk == 'true'
        run: |
          java -jar signer.jar --apks output/intermediate.apk --out output/ --allowResign
          SIGNED=$(find output/ -name "*aligned-debugSigned*.apk" | head -1)
          if [ -n "$SIGNED" ]; then
            mv "$SIGNED" output/out.apk
            rm -f output/intermediate.apk
          else
            mv output/intermediate.apk output/out.apk
          fi
          echo "Final APK: $(du -sh output/out.apk)"

      - name: Rename unsigned APK (final)
        if: inputs.sign_apk != 'true'
        run: mv output/intermediate.apk output/out.apk

      - name: Delete input asset from release
        if: always()
        run: |
          curl -fsSL -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-killer-${{ inputs.job_id }}
          path: output/out.apk
          retention-days: 1

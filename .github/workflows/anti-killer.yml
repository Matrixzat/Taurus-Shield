name: Anti-Dialog Killer

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID containing the APK'
        required: true
      job_id:
        description: 'Job identifier for artifact naming'
        required: true
      main_activity:
        description: 'Main activity class name (e.g. com.example.MainActivity)'
        required: false
        default: ''

jobs:
  patch:
    name: Anti-Dialog Killer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk zipalign apksigner wget unzip 2>/dev/null
          echo "java: $(java -version 2>&1 | head -1)"

      - name: Download input APK from release
        run: |
          curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.apk
          echo "Input size: $(du -sh input.apk)"

      - name: Delete input asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true

      - name: Download APKTool + baksmali
        run: |
          echo "Fetching latest APKTool release..."
          APKTOOL_URL=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(next(a['browser_download_url'] for a in r['assets'] if 'apktool' in a['name'].lower() and a['name'].endswith('.jar')))")
          echo "APKTool URL: $APKTOOL_URL"
          curl -fsSL "$APKTOOL_URL" -o apktool.jar

          echo "Downloading baksmali from Maven Central..."
          curl -fsSL "https://repo1.maven.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar" -o baksmali.jar

          echo "APKTool: $(du -sh apktool.jar) | baksmali: $(du -sh baksmali.jar)"
          echo "Tools ready"

      - name: Decompile APK
        run: |
          java -Xmx5g -jar apktool.jar d input.apk -o decompiled -f
          echo "Decompile done — $(find decompiled/smali* -name '*.smali' 2>/dev/null | wc -l) smali files"

      - name: Fetch Anti-Dialog Killer DEX
        run: |
          curl -fsSL \
            "https://taurus-shield.matrixzat99.workers.dev/anti-killer-dex" \
            -o anti_dialog_killer.dex
          echo "DEX size: $(du -sh anti_dialog_killer.dex)"

      - name: Fetch and run injection script
        run: |
          curl -fsSL \
            "https://taurus-shield.matrixzat99.workers.dev/anti-killer-script" \
            -o anti-killer-script.js
          MAIN_ACTIVITY="${{ inputs.main_activity }}" \
          BAKSMALI_JAR="baksmali.jar" \
            node anti-killer-script.js decompiled/ anti_dialog_killer.dex

      - name: Recompile APK (multi-strategy)
        run: |
          mkdir -p output
          BUILD_OK=false
          for STRAT in "--use-aapt2" "" "--use-aapt2 --keep-broken-res" "--keep-broken-res"; do
            echo "Trying: apktool b $STRAT"
            if java -Xmx5g -jar apktool.jar b decompiled -o output/patched.apk $STRAT; then
              BUILD_OK=true
              echo "Build succeeded with: $STRAT"
              break
            fi
            echo "Strategy failed, trying next..."
          done
          if [ "$BUILD_OK" = false ]; then
            echo "ERROR: All build strategies failed"; exit 1
          fi
          echo "Patched APK: $(du -sh output/patched.apk)"

      - name: Download dpt-shell
        run: |
          RELEASE_URL=$(curl -s https://api.github.com/repos/luoyesiqiu/dpt-shell/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if a['name'].endswith('.zip')))")
          echo "Downloading dpt-shell from: $RELEASE_URL"
          wget -q -O dpt-shell.zip "$RELEASE_URL"
          unzip -q dpt-shell.zip -d dpt-shell-release
          DPT_JAR=$(find dpt-shell-release/ -name "dpt.jar" | head -1)
          if [ -z "$DPT_JAR" ]; then
            echo "ERROR: dpt.jar not found in release ZIP"; exit 1
          fi
          DPT_DIR=$(dirname "$(realpath "$DPT_JAR")")
          echo "DPT_DIR=$DPT_DIR" >> $GITHUB_ENV
          if [ ! -d "$DPT_DIR/shell-files" ]; then
            echo "WARNING: shell-files/ not found next to dpt.jar"
          else
            echo "shell-files/ found OK"
          fi
          (cd "$DPT_DIR" && java -jar dpt.jar -v)

      - name: Run DPT-Shell protection
        run: |
          WS="$GITHUB_WORKSPACE"
          INPUT_APK="$WS/output/patched.apk"
          OUTPUT_DIR="$WS/dpt_output"
          mkdir -p "$OUTPUT_DIR"
          echo "Running dpt.jar from: $DPT_DIR"
          (cd "$DPT_DIR" && java -jar dpt.jar \
            -f "$INPUT_APK" \
            -o "$OUTPUT_DIR" \
            -e x86,x86_64 \
            -x) 2>&1 | tee "$WS/dpt_run.log"
          OUT_APK=$(find dpt_output/ -name "*.apk" -type f | head -1)
          if [ -z "$OUT_APK" ]; then
            echo "ERROR: No protected APK found in dpt_output/"
            exit 1
          fi
          cp "$OUT_APK" dpt_output/protected.apk
          echo "Protected APK: $(du -sh dpt_output/protected.apk)"
        timeout-minutes: 20

      - name: Inject integrity hashes into protected APK
        run: |
          node - dpt_output/protected.apk <<'NODE'
          const crypto  = require('crypto');
          const fs      = require('fs');
          const { execSync } = require('child_process');

          const APK = process.argv[2];
          const KEY = Buffer.from('SecurityGuardKey', 'utf8');
          const IV  = Buffer.from('AntiKillerIV0001', 'utf8');

          function encrypt(str) {
            const c = crypto.createCipheriv('aes-128-cbc', KEY, IV);
            return Buffer.concat([c.update(str, 'utf8'), c.final()]);
          }

          // Manifest hash (binary AndroidManifest.xml inside the protected APK)
          let manifestHash = '';
          try {
            const raw = execSync('unzip -p "' + APK + '" AndroidManifest.xml | sha256sum').toString().trim();
            const h   = raw.split(/\s+/)[0];
            if (h && h.length === 64) manifestHash = h;
          } catch(e) { console.error('Hash error:', e.message); }
          console.log('Manifest hash:', manifestHash);

          // DEX count inside the protected APK
          let dexCount = 1;
          try {
            const listing = execSync('unzip -l "' + APK + '"').toString();
            const matches = listing.match(/classes\d*\.dex/g) || [];
            dexCount = matches.length || 1;
          } catch(e) {}
          console.log('DEX count:', dexCount);

          // Write encrypted dat files
          fs.mkdirSync('hash_assets', { recursive: true });
          fs.writeFileSync('hash_assets/ak_mh.dat', encrypt(manifestHash));
          fs.writeFileSync('hash_assets/ak_dc.dat', encrypt(dexCount.toString()));

          // Inject into APK
          execSync('cd hash_assets && zip -j "../' + APK + '" ak_mh.dat ak_dc.dat');
          console.log('Integrity hashes injected successfully.');
          NODE

      - name: Zipalign + sign with release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

          echo "Zipaligning..."
          zipalign -f 4 dpt_output/protected.apk dpt_output/aligned.apk

          echo "Signing with release keystore..."
          apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out output/out.apk \
            dpt_output/aligned.apk

          rm -f /tmp/release.keystore dpt_output/aligned.apk
          apksigner verify output/out.apk && echo "Signature verified OK"
          echo "Final APK: $(du -sh output/out.apk)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-killer-${{ inputs.job_id }}
          path: output/out.apk
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: dpt_run.log
          retention-days: 1

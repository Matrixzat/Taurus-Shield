name: Compress Video

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'GitHub release asset ID of the uploaded video file'
        required: true
      job_id:
        description: 'Job correlation ID for artifact naming'
        required: true
      crf:
        description: 'CRF value (20=light 24=standard 28=strong 32=extreme)'
        required: false
        default: '24'
      height:
        description: 'Target height in px (0 = keep original)'
        required: false
        default: '0'
      preset:
        description: 'FFmpeg encoding preset (ultrafast/faster/medium/slow)'
        required: false
        default: 'faster'
      audio:
        description: 'Audio handling (keep / mute)'
        required: false
        default: 'keep'
      reverse:
        description: 'Reverse the video (true / false)'
        required: false
        default: 'false'
      trim_start:
        description: 'Trim start time in seconds (0 = from beginning)'
        required: false
        default: '0'
      trim_end:
        description: 'Trim end time in seconds (0 = no end trim)'
        required: false
        default: '0'

jobs:
  compress:
    name: FFmpeg Compress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download video from release asset
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" \
            -o input_video
          echo "Downloaded: $(ls -lh input_video)"
          # Delete upload asset immediately after download
          curl -fsSL -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" || true

      - name: Probe input
        run: |
          ffprobe -v quiet -print_format json -show_streams input_video 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for s in d.get('streams',[]):
            if s.get('codec_type') == 'video':
              print(f'Resolution: {s.get(\"width\")}x{s.get(\"height\")}')
              print(f'Codec: {s.get(\"codec_name\")}')
              print(f'Duration: {s.get(\"duration\",\"?\")}s')
              break
          " || echo "Probe skipped"

      - name: Compress with FFmpeg
        run: |
          CRF="${{ github.event.inputs.crf }}"
          HEIGHT="${{ github.event.inputs.height }}"
          PRESET="${{ github.event.inputs.preset || 'faster' }}"
          AUDIO="${{ github.event.inputs.audio || 'keep' }}"
          REVERSE="${{ github.event.inputs.reverse || 'false' }}"
          TRIM_START="${{ github.event.inputs.trim_start || '0' }}"
          TRIM_END="${{ github.event.inputs.trim_end || '0' }}"

          echo "CRF=$CRF  Preset=$PRESET  Height=${HEIGHT:-orig}  Audio=$AUDIO  Reverse=$REVERSE  Trim=${TRIM_START}s-${TRIM_END}s"

          # ── Trim args (pre-input fast seek) ──────────────────────────────────
          PRE_INPUT_ARGS=""
          DURATION_ARG=""
          if [ "$TRIM_START" != "0" ] && [ -n "$TRIM_START" ]; then
            PRE_INPUT_ARGS="-ss $TRIM_START"
          fi
          if [ "$TRIM_END" != "0" ] && [ -n "$TRIM_END" ]; then
            if [ "$TRIM_START" != "0" ] && [ -n "$TRIM_START" ]; then
              DUR=$(echo "$TRIM_END - $TRIM_START" | bc)
              DURATION_ARG="-t $DUR"
            else
              DURATION_ARG="-t $TRIM_END"
            fi
          fi

          # ── Video filter chain ───────────────────────────────────────────────
          VF_PARTS=()
          if [ "$HEIGHT" != "0" ] && [ -n "$HEIGHT" ]; then
            VF_PARTS+=("scale=-2:$HEIGHT")
          fi
          if [ "$REVERSE" = "true" ]; then
            VF_PARTS+=("reverse")
          fi
          if [ ${#VF_PARTS[@]} -gt 0 ]; then
            VF_STRING=$(IFS=,; echo "${VF_PARTS[*]}")
            VF_ARGS="-vf $VF_STRING"
          else
            VF_ARGS=""
          fi

          # ── Audio args ───────────────────────────────────────────────────────
          if [ "$AUDIO" = "mute" ]; then
            AUDIO_ARGS="-an"
          elif [ "$REVERSE" = "true" ]; then
            AUDIO_ARGS="-af areverse -c:a aac -b:a 128k"
          else
            AUDIO_ARGS="-c:a aac -b:a 128k"
          fi

          ffmpeg -y $PRE_INPUT_ARGS -i input_video \
            -c:v libx264 -crf "$CRF" -preset "$PRESET" \
            $VF_ARGS \
            $AUDIO_ARGS \
            $DURATION_ARG \
            -movflags +faststart \
            compressed.mp4

          echo "Input:  $(ls -lh input_video)"
          echo "Output: $(ls -lh compressed.mp4)"
          INPUT_SIZE=$(stat -c%s input_video)
          OUTPUT_SIZE=$(stat -c%s compressed.mp4)
          RATIO=$(echo "scale=1; $OUTPUT_SIZE * 100 / $INPUT_SIZE" | bc)
          echo "Compression ratio: ${RATIO}% of original"

      - name: Upload compressed video artifact
        uses: actions/upload-artifact@v4
        with:
          name: compressed-video-${{ github.event.inputs.job_id }}
          path: compressed.mp4
          retention-days: 1

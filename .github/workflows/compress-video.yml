name: Compress Video

on:
  workflow_dispatch:
    inputs:
      asset_ids:
        description: 'Comma-separated GitHub release asset IDs (parallel chunks)'
        required: true
      job_id:
        description: 'Job correlation ID for artifact naming'
        required: true
      crf:
        description: 'CRF value (20=light 24=standard 28=strong 32=extreme)'
        required: false
        default: '24'
      height:
        description: 'Target height in px (0 = keep original)'
        required: false
        default: '0'
      preset:
        description: 'FFmpeg encoding preset (ultrafast/faster/medium/slow)'
        required: false
        default: 'faster'
      audio:
        description: 'Audio handling (keep / mute)'
        required: false
        default: 'keep'

jobs:
  compress:
    name: FFmpeg Compress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download and assemble video chunks
        run: |
          IFS=',' read -ra IDS <<< "${{ github.event.inputs.asset_ids }}"
          echo "Downloading ${#IDS[@]} chunk(s)..."
          i=0
          for id in "${IDS[@]}"; do
            id="${id//[[:space:]]/}"
            echo "  chunk $i → asset $id"
            curl -fL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id" \
              -o "chunk_$(printf '%04d' $i)"
            i=$((i+1))
          done
          # Assemble (single chunk = direct rename, multi-chunk = cat)
          if [ "${#IDS[@]}" -eq 1 ]; then
            mv chunk_0000 input_video
          else
            cat chunk_* > input_video
            rm -f chunk_*
          fi
          echo "Assembled: $(ls -lh input_video)"
          # Delete all chunk assets immediately
          for id in "${IDS[@]}"; do
            id="${id//[[:space:]]/}"
            curl -fsSL -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id" || true
          done

      - name: Probe input
        run: |
          ffprobe -v quiet -print_format json -show_streams input_video 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for s in d.get('streams',[]):
            if s.get('codec_type') == 'video':
              print(f'Resolution: {s.get(\"width\")}x{s.get(\"height\")}')
              print(f'Codec: {s.get(\"codec_name\")}')
              print(f'Duration: {s.get(\"duration\",\"?\")}s')
              break
          " || echo "Probe skipped"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Compress with FFmpeg
        run: |
          CRF="${{ github.event.inputs.crf }}"
          HEIGHT="${{ github.event.inputs.height }}"
          PRESET="${{ github.event.inputs.preset || 'faster' }}"
          AUDIO="${{ github.event.inputs.audio || 'keep' }}"

          echo "CRF=$CRF  Preset=$PRESET  Height=${HEIGHT:-orig}  Audio=$AUDIO"

          # ── Video filter chain ───────────────────────────────────────────────
          if [ "$HEIGHT" != "0" ] && [ -n "$HEIGHT" ]; then
            VF_ARGS="-vf scale=-2:$HEIGHT"
          else
            VF_ARGS=""
          fi

          # ── Audio args ───────────────────────────────────────────────────────
          if [ "$AUDIO" = "mute" ]; then
            AUDIO_ARGS="-an"
          else
            AUDIO_ARGS="-c:a aac -b:a 128k"
          fi

          ffmpeg -y -i input_video \
            -c:v libx264 -crf "$CRF" -preset "$PRESET" \
            $VF_ARGS \
            $AUDIO_ARGS \
            -movflags +faststart \
            compressed.mp4

          echo "Input:  $(ls -lh input_video)"
          echo "Output: $(ls -lh compressed.mp4)"
          INPUT_SIZE=$(stat -c%s input_video)
          OUTPUT_SIZE=$(stat -c%s compressed.mp4)
          RATIO=$(echo "scale=1; $OUTPUT_SIZE * 100 / $INPUT_SIZE" | bc)
          echo "Compression ratio: ${RATIO}% of original"

      - name: Upload compressed video artifact
        uses: actions/upload-artifact@v4
        with:
          name: compressed-video-${{ github.event.inputs.job_id }}
          path: compressed.mp4
          retention-days: 1

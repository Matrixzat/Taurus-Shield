name: Dex2C Protection

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Release asset ID of the uploaded ZIP (APK + filter.txt)'
        required: true
      job_id:
        description: 'Unique job ID for artifact naming'
        required: true
      sign_apk:
        description: 'Whether to sign the output APK with a debug key (true/false)'
        required: false
        default: 'true'

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Download uploaded ZIP
        run: |
          curl -fL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
            -o input.zip
          ls -lh input.zip
          file input.zip

      - name: Delete uploaded asset from release
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" || true
          echo "Upload slot cleaned up"

      - name: Extract APK and filter.txt
        run: |
          mkdir -p extracted
          set +e
          unzip -o input.zip -d extracted
          UNZIP_RC=$?
          set -e
          if [ "$UNZIP_RC" -gt 1 ]; then
            echo "ERROR: unzip failed with code $UNZIP_RC"
            exit 1
          fi
          echo "=== ZIP contents ==="
          unzip -l input.zip || true

          APK_COUNT=$(find extracted/ -name "*.apk" -type f | wc -l)
          APK_PATH=$(find extracted/  -name "*.apk" -type f | head -1)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No .apk file found"; exit 1
          fi
          if [ "$APK_COUNT" -gt 1 ]; then
            echo "ERROR: ZIP must contain exactly one .apk file (found $APK_COUNT)"; exit 1
          fi
          echo "Found APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

          FILTER_COUNT=$(find extracted/ -name "filter.txt" -type f | wc -l)
          FILTER_PATH=$(find extracted/ -name "filter.txt" -type f | head -1)
          if [ "$FILTER_COUNT" -eq 0 ]; then
            echo "ERROR: No filter.txt found"; exit 1
          fi
          echo "Found filter: $FILTER_PATH"
          echo "=== filter.txt contents ==="
          cat "$FILTER_PATH"

          echo "APK_PATH=$APK_PATH"     >> $GITHUB_ENV
          echo "FILTER_PATH=$FILTER_PATH" >> $GITHUB_ENV

      # ── Cached: Android NDK (~800 MB) ─────────────────────────────────────
      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ~/android-ndk
          key: android-ndk-r27c-linux

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading NDK r27c..."
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O /tmp/ndk.zip
          mkdir -p ~/android-ndk
          unzip -q /tmp/ndk.zip -d ~/android-ndk
          rm /tmp/ndk.zip
          echo "NDK ready: $(ls ~/android-ndk)"

      # ── Cached: dex2c repo + pip packages ────────────────────────────────
      - name: Cache dex2c + Python packages
        uses: actions/cache@v4
        id: dex2c-cache
        with:
          path: |
            ~/dex2c
            ~/.cache/pip
          key: dex2c-codehasan-v1

      - name: Clone dex2c
        if: steps.dex2c-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — cloning dex2c..."
          git clone --depth=1 https://github.com/codehasan/dex2c.git ~/dex2c
          ls ~/dex2c/dcc.py

      - name: Install Python dependencies
        if: steps.dex2c-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — installing Python deps..."
          cd ~/dex2c
          pip3 install -r requirements.txt --break-system-packages

      # ── Cached: apktool JAR ───────────────────────────────────────────────
      - name: Cache apktool
        uses: actions/cache@v4
        id: apktool-cache
        with:
          path: ~/tools/apktool.jar
          key: apktool-2.10.0

      - name: Download apktool
        if: steps.apktool-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading apktool..."
          mkdir -p ~/tools
          wget -q -O ~/tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          ls -lh ~/tools/apktool.jar

      # ── System deps (only zipalign + apksigner; rest ships with ubuntu-latest) ──
      - name: Install system dependencies
        run: |
          sudo apt-get install -y -qq zipalign apksigner 2>/dev/null
          echo "java:    $(java -version 2>&1 | head -1)"
          echo "python3: $(python3 --version)"
          echo "zipalign: $(zipalign -version 2>&1 | head -1 || echo ok)"

      - name: Configure dex2c
        run: |
          NDK_DIR="$HOME/android-ndk/android-ndk-r27c"
          APKTOOL_JAR="$HOME/tools/apktool.jar"

          # dcc.py hardcodes APKTOOL3 = <dcc.py dir>/tools/apktool
          # The wrapper MUST live at ~/dex2c/tools/apktool, not ~/tools/apktool
          mkdir -p ~/dex2c/tools
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$APKTOOL_JAR" > ~/dex2c/tools/apktool
          chmod +x ~/dex2c/tools/apktool

          # dcc.cfg — valid JSON pointing to cached NDK and apktool JAR
          printf '{\n  "ndk_dir": "%s",\n  "apktool": "%s"\n}\n' \
            "$NDK_DIR" "$APKTOOL_JAR" > ~/dex2c/dcc.cfg

          echo "=== dcc.cfg ==="
          cat ~/dex2c/dcc.cfg
          bash ~/dex2c/tools/apktool --version

      - name: Run Dex2C protection
        run: |
          cp "$GITHUB_WORKSPACE/$APK_PATH"    ~/dex2c/input.apk
          cp "$GITHUB_WORKSPACE/$FILTER_PATH" ~/dex2c/filter.txt
          cd ~/dex2c
          echo "Running dcc.py..."
          set +e
          python3 dcc.py -a input.apk -o out.apk --filter filter.txt -p --allow-global \
            2>&1 | tee "$GITHUB_WORKSPACE/dex2c_run.log"
          DCC_RC=${PIPESTATUS[0]}
          set -e

          # dcc.py exits 0 but writes nothing when filter matches no methods.
          # Fall back to the original APK so the pipeline always delivers output.
          if [ ! -f out.apk ]; then
            if grep -q "No methods compiled" "$GITHUB_WORKSPACE/dex2c_run.log" 2>/dev/null; then
              echo "WARNING: No methods matched the filter — returning original APK unchanged."
              echo "  Ensure filter.txt uses Dalvik descriptor format, e.g.:"
              echo "    Lcom/example/MyClass;->.*"
              cp input.apk out.apk
              printf "WARNING: 0 methods compiled.\nFilter did not match any methods in this APK.\n" \
                > compiled_methods.txt
            else
              echo "ERROR: dcc.py failed (exit $DCC_RC) and produced no output."
              cat "$GITHUB_WORKSPACE/dex2c_run.log" || true
              exit 1
            fi
          else
            echo "Protection complete: $(wc -c < out.apk) bytes"
            exit $DCC_RC
          fi
        timeout-minutes: 45

      - name: Collect output
        run: |
          mkdir -p dex2c_output
          if [ -f ~/dex2c/out.apk ]; then
            cp ~/dex2c/out.apk dex2c_output/
            echo "Output APK: $(wc -c < dex2c_output/out.apk) bytes"
          else
            echo "ERROR: out.apk missing after protection step — this should not happen."
            find ~/dex2c/ -name "*.apk" -type f | head -10
            exit 1
          fi
          # Source ZIP (only exists when real compilation happened)
          if ls ~/dex2c/project-source*.zip 1>/dev/null 2>&1; then
            cp ~/dex2c/project-source*.zip dex2c_output/
          fi
          # compiled_methods.txt (real list or our fallback warning)
          if [ -f ~/dex2c/compiled_methods.txt ]; then
            cp ~/dex2c/compiled_methods.txt dex2c_output/
          fi
          echo "=== Output files ==="
          find dex2c_output/ -type f | sort
          du -sh dex2c_output/

      - name: Sign APK
        if: inputs.sign_apk == 'true'
        run: |
          if [ ! -f dex2c_output/out.apk ]; then
            echo "No out.apk to sign — skipping"; exit 0
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          echo "Zipaligning..."
          zipalign -f 4 dex2c_output/out.apk dex2c_output/out_aligned.apk
          echo "Signing..."
          apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out dex2c_output/out_signed.apk \
            dex2c_output/out_aligned.apk
          mv dex2c_output/out_signed.apk dex2c_output/out.apk
          rm -f dex2c_output/out_aligned.apk /tmp/release.keystore
          echo "Signed APK: $(wc -c < dex2c_output/out.apk) bytes"
          apksigner verify dex2c_output/out.apk && echo "Signature verified OK"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex2c-${{ inputs.job_id }}
          path: dex2c_output/
          if-no-files-found: error
          retention-days: 1

      - name: Upload error log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ inputs.job_id }}
          path: dex2c_run.log
          retention-days: 1

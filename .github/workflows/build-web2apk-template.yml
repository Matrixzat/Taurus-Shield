name: Build & Publish Web2Apk Template

  on:
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      permissions:
        contents: write

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Setup Android SDK
          uses: android-actions/setup-android@v3

        - name: Cache Gradle
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: gradle-${{ hashFiles('website-to-apk/**/*.gradle*') }}

        - name: Decode keystore
          run: |
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > website-to-apk/app/my-release-key.jks

        - name: Patch signing config
          run: |
            sed -i "s/storePassword \"123456\"/storePassword \"${{ secrets.KEYSTORE_PASSWORD }}\"/" website-to-apk/app/build.gradle
            sed -i "s/keyAlias \"my\"/keyAlias \"${{ secrets.KEYSTORE_ALIAS }}\"/" website-to-apk/app/build.gradle
            sed -i "s/keyPassword \"123456\"/keyPassword \"${{ secrets.KEYSTORE_PASSWORD }}\"/" website-to-apk/app/build.gradle

        - name: Build release APK
          run: |
            cd website-to-apk
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace

        - name: Locate APK
          id: apk
          run: |
            APK=$(find website-to-apk/app/build/outputs/apk/release -name "*.apk" | head -1)
            echo "path=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"

        - name: Delete existing web2apk-template release
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/web2apk-template" \
              | jq -r '.id // empty')
            if [ -n "$RELEASE_ID" ]; then
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            fi
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/web2apk-template" || true

        - name: Create release and upload APK
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              -d '{"tag_name":"web2apk-template","name":"Web 2 Apk Template","body":"Template APK for Taurus Shield Web 2 Apk Builder.","draft":false,"prerelease":false}' \
              | jq -r '.id')
            echo "Release ID: $RELEASE_ID"
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=web2apk_template.apk" \
              --data-binary @${{ steps.apk.outputs.path }}
            echo "Template APK published to web2apk-template release"
  
name: WebForge — Build & Publish Template

on:
  workflow_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create WebForge template project
        run: |
          mkdir -p wf/app/src/main/kotlin/com/matrix/webtoapk
          mkdir -p wf/app/src/main/res/values
          mkdir -p wf/app/src/main/res/mipmap-mdpi-v4
          mkdir -p wf/app/src/main/res/mipmap-hdpi-v4
          mkdir -p wf/app/src/main/res/mipmap-xhdpi-v4
          mkdir -p wf/app/src/main/res/mipmap-xxhdpi-v4
          mkdir -p wf/app/src/main/res/mipmap-xxxhdpi-v4
          mkdir -p wf/app/src/main/assets
          mkdir -p wf/gradle/wrapper

          # ── settings.gradle ──────────────────────────────────────────────
          cat > wf/settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "WebForge"
include ':app'
EOF

          # ── build.gradle (root) ──────────────────────────────────────────
          cat > wf/build.gradle << 'EOF'
plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
}
EOF

          # ── gradle wrapper properties ────────────────────────────────────
          cat > wf/gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

          # ── app/build.gradle ─────────────────────────────────────────────
          cat > wf/app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.matrix.webtoapk'
    compileSdk 35

    defaultConfig {
        applicationId "com.matrix.webtoapk"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
EOF

          echo "sdk.dir=$ANDROID_HOME" > wf/local.properties


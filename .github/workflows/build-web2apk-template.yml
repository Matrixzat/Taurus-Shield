name: Build Web2Apk Template

on:
  workflow_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create WebForge template project
        run: |
          python3 - << 'PYEOF'
          import os, base64

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w') as f:
                  f.write(content)

          def wb(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(data)

          # settings.gradle
          w('wf/settings.gradle', '''pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebForge"
          include ':app'
          ''')

          # build.gradle root
          w('wf/build.gradle', '''plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          ''')

          # gradle wrapper
          w('wf/gradle/wrapper/gradle-wrapper.properties',
          'distributionBase=GRADLE_USER_HOME\n'
          'distributionPath=wrapper/dists\n'
          'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-bin.zip\n'
          'zipStoreBase=GRADLE_USER_HOME\n'
          'zipStorePath=wrapper/dists\n')

          # app/build.gradle
          w('wf/app/build.gradle', '''plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.matrix.webtoapk'
              compileSdk 35
              defaultConfig {
                  applicationId "com.matrix.webtoapk"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig null }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          ''')

          import subprocess
          result = subprocess.run(['bash', '-c', 'echo sdk.dir=$ANDROID_HOME'], capture_output=True, text=True)
          w('wf/local.properties', result.stdout.strip() + '\n')

          # gradle.properties — required for AndroidX
          w('wf/gradle.properties',
          'org.gradle.jvmargs=-Xmx2g\n'
          'android.useAndroidX=true\n'
          'android.enableJetifier=true\n'
          'kotlin.code.style=official\n')

          # AndroidManifest.xml
          w('wf/app/src/main/AndroidManifest.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WebApp"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:screenOrientation="unspecified"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          # strings.xml
          w('wf/app/src/main/res/values/strings.xml',
          '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Web2Apk App</string>\n</resources>\n')

          # styles.xml
          w('wf/app/src/main/res/values/styles.xml',
          '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
          '    <style name="Theme.WebApp" parent="android:Theme.Material.NoActionBar">\n'
          '        <item name="android:windowBackground">@android:color/black</item>\n'
          '        <item name="android:statusBarColor">@android:color/black</item>\n'
          '        <item name="android:navigationBarColor">@android:color/black</item>\n'
          '    </style>\n</resources>\n')

          # web2apk.conf
          w('wf/app/src/main/assets/web2apk.conf',
          '# DO NOT REMOVE\nmainURL = https://example.com\n'
          'requireDoubleBackToExit = true\nallowSubdomains = true\nenableExternalLinks = true\n'
          'openExternalLinksInBrowser = false\nconfirmOpenInBrowser = true\nallowOpenMobileApp = true\n'
          'confirmOpenExternalApp = false\nallowSwipeToNavigate = true\ncookies = ENABLED\n'
          'basicAuth = \nuserAgent = \nblockLocalhostRequests = false\nJSEnabled = true\n'
          'JSCanOpenWindowsAutomatically = true\nDomStorageEnabled = true\nAppCacheEnabled = true\n'
          'CacheMode = LOAD_DEFAULT\nDatabaseEnabled = true\nMediaPlaybackRequiresUserGesture = true\n'
          'SavePassword = true\nAllowFileAccess = true\nAllowFileAccessFromFileURLs = true\n'
          'AllowUniversalAccessFromFileURLs = true\nforceLandscapeMode = false\nedgeToEdge = false\n'
          'forceDarkTheme = true\nenablePullToRefresh = true\nDebugWebView = false\n'
          'geolocationEnabled = true\nAllowGeolocationPermissionAlways = true\n'
          'showDetailsOnErrorScreen = false\nbiometricLockEnabled = false\n'
          'biometricTimeoutMinutes = 5\nbiometricType = both\n')

          # MainActivity.kt
          w('wf/app/src/main/kotlin/com/matrix/webtoapk/MainActivity.kt', '''package com.matrix.webtoapk

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.pm.ActivityInfo
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.webkit.*
          import android.widget.FrameLayout

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private val conf = HashMap<String, String>()

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  loadConf()
                  requestedOrientation = if (b("forceLandscapeMode"))
                      ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                  else ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  if (b("edgeToEdge")) applyEdgeToEdge()
                  webView = WebView(this)
                  webView.layoutParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  setContentView(webView)
                  configureWebView()
                  webView.loadUrl(s("mainURL", "https://example.com"))
              }

              private fun loadConf() {
                  try {
                      assets.open("web2apk.conf").bufferedReader().use { r ->
                          r.lineSequence()
                              .filter { it.isNotBlank() && !it.trimStart().startsWith("#") }
                              .forEach { line ->
                                  val idx = line.indexOf('=')
                                  if (idx > 0) conf[line.substring(0, idx).trim()] = line.substring(idx + 1).trim()
                              }
                      }
                  } catch (_: Exception) {}
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun configureWebView() {
                  val s = webView.settings
                  s.javaScriptEnabled = b("JSEnabled", true)
                  s.javaScriptCanOpenWindowsAutomatically = b("JSCanOpenWindowsAutomatically", true)
                  s.domStorageEnabled = b("DomStorageEnabled", true)
                  s.databaseEnabled = b("DatabaseEnabled", true)
                  s.allowFileAccess = b("AllowFileAccess", true)
                  @Suppress("DEPRECATION") s.allowFileAccessFromFileURLs = b("AllowFileAccessFromFileURLs", true)
                  @Suppress("DEPRECATION") s.allowUniversalAccessFromFileURLs = b("AllowUniversalAccessFromFileURLs", true)
                  s.mediaPlaybackRequiresUserGesture = b("MediaPlaybackRequiresUserGesture", true)
                  s.setSupportZoom(true); s.builtInZoomControls = false
                  s.loadWithOverviewMode = true; s.useWideViewPort = true
                  @Suppress("DEPRECATION") s.savePassword = b("SavePassword", true)
                  if (b("forceDarkTheme") && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      @Suppress("DEPRECATION") s.forceDark = WebSettings.FORCE_DARK_ON
                  }
                  s.cacheMode = when (g("CacheMode", "LOAD_DEFAULT")) {
                      "LOAD_CACHE_ELSE_NETWORK" -> WebSettings.LOAD_CACHE_ELSE_NETWORK
                      "LOAD_NO_CACHE" -> WebSettings.LOAD_NO_CACHE
                      "LOAD_CACHE_ONLY" -> WebSettings.LOAD_CACHE_ONLY
                      else -> WebSettings.LOAD_DEFAULT
                  }
                  val ua = g("userAgent"); if (ua.isNotEmpty()) s.userAgentString = ua
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, r: android.webkit.WebResourceRequest): Boolean {
                          v.loadUrl(r.url.toString()); return false
                      }
                  }
                  if (b("geolocationEnabled", true)) {
                      webView.webChromeClient = object : android.webkit.WebChromeClient() {
                          override fun onGeolocationPermissionsShowPrompt(origin: String, callback: android.webkit.GeolocationPermissions.Callback) {
                              callback.invoke(origin, b("AllowGeolocationPermissionAlways", true), false)
                          }
                      }
                  }
              }

              private fun applyEdgeToEdge() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.apply {
                          hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { if (webView.canGoBack()) webView.goBack() else super.onBackPressed() }
              private fun b(k: String, d: Boolean = false) = (conf[k] ?: if (d) "true" else "false") == "true"
              private fun s(k: String, d: String = "") = conf[k] ?: d
              private fun g(k: String, d: String = "") = conf[k] ?: d
          }
          ''')

          # Placeholder 1x1 red icon PNG
          import struct, zlib
          def make_png(r, g, b):
              def chunk(t, d):
                  c = zlib.crc32(t + d) & 0xFFFFFFFF
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', c)
              return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 2, 0, 0, 0)) +
                      chunk(b'IDAT', zlib.compress(b'\x00' + bytes([r, g, b]))) + chunk(b'IEND', b''))

          icon = make_png(255, 10, 10)
          for d in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              for n in ['ic_launcher.png', 'ic_launcher_round.png']:
                  wb(f'wf/app/src/main/res/mipmap-{d}-v4/{n}', icon)

          print("Project files created successfully")
          PYEOF

      - name: Install Gradle wrapper
        working-directory: wf
        run: |
          gradle wrapper --gradle-version=8.6 2>/dev/null || true
          if [ ! -f gradlew ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.6-bin.zip" -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp/gi
            /tmp/gi/gradle-8.6/bin/gradle wrapper --gradle-version=8.6
          fi
          chmod +x gradlew

      - name: Build unsigned release APK
        working-directory: wf
        run: ./gradlew assembleRelease --no-daemon -q

      - name: Sign template APK
        run: |
          APK=$(find wf -path "*/release/*.apk" | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          sudo apt-get install -y zipalign apksigner 2>/dev/null
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/ks.jks
          zipalign -f 4 "$APK" /tmp/aligned.apk
          apksigner sign \
            --ks /tmp/ks.jks \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out /tmp/web2apk_template.apk /tmp/aligned.apk
          rm -f /tmp/ks.jks /tmp/aligned.apk
          apksigner verify /tmp/web2apk_template.apk && echo "Signed OK"

      - name: Publish web2apk-template release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete web2apk-template --yes --repo "${{ github.repository }}" 2>/dev/null || true
          git -C /tmp init dummy-repo 2>/dev/null || true
          gh release create web2apk-template \
            --repo "${{ github.repository }}" \
            --title "Web2Apk Template" \
            --notes "Template APK for Taurus Shield Web2Apk Builder." \
            /tmp/web2apk_template.apk#web2apk_template.apk
          echo "Template APK published successfully"

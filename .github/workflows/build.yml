name: Build Blutter for Android ARM64

on:
  workflow_dispatch:
    inputs:
      dart_versions:
        description: 'auto = current stable Dart; optional comma-separated versions'
        required: false
        default: 'auto'
  push:
    tags:
      - 'blutter-*'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover Dart stable automatically
        id: versions
        env:
          REQUESTED_VERSIONS: ${{ inputs.dart_versions || 'auto' }}
        run: python3 scripts/blutter_versions.py --versions "$REQUESTED_VERSIONS"
      - name: Resolve latest upstream Blutter
        id: upstream
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/worawit/blutter.git HEAD | cut -f1)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve Blutter HEAD"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build Dart ${{ matrix.dart_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            libicu-dev \
            python3-pip python3-pyelftools git curl unzip wget
          pip3 install requests --break-system-packages --quiet 2>/dev/null || pip3 install requests --quiet

      - name: Find Android NDK
        run: |
          # GitHub ubuntu-24.04 runners ship the NDK under ANDROID_NDK_HOME
          # or discoverable under the Android SDK directory.
          NDK_HOME="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            NDK_HOME=$(find /usr/local/lib/android/sdk/ndk \
              -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            echo "ERROR: Android NDK not found"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "Found NDK: $NDK_HOME"
          ls "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep "aarch64" | head -5

      - name: Checkout current upstream Blutter
        uses: actions/checkout@v4
        with:
          repository: worawit/blutter
          ref: ${{ needs.resolve.outputs.sha }}
          path: blutter
          persist-credentials: false

      - name: Record binary provenance
        env:
          BLUTTER_SHA: ${{ needs.resolve.outputs.sha }}
          DART_VERSION: ${{ matrix.dart_version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          version = os.environ['DART_VERSION']
          pathlib.Path('blutter_dartvm' + version + '_android_arm64.json').write_text(json.dumps({
              'repository': 'https://github.com/worawit/blutter',
              'commit': os.environ['BLUTTER_SHA'], 'dart_version': version,
              'host_target': 'android_arm64'}, indent=2) + '\n')
          PY

      - name: Build for Dart ${{ matrix.dart_version }}
        run: |
          chmod +x scripts/build_blutter.sh
          bash scripts/build_blutter.sh "${{ matrix.dart_version }}" blutter

      - name: Prepare release asset
        run: |
          BIN="blutter/bin/blutter_dartvm${{ matrix.dart_version }}_android_arm64"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: binary not found at $BIN"
            ls -la blutter/bin/ 2>/dev/null || echo "(bin/ empty)"
            exit 1
          fi
          cp "$BIN" "blutter_dartvm${{ matrix.dart_version }}_android_arm64"
          file "blutter_dartvm${{ matrix.dart_version }}_android_arm64"
          ls -lh "blutter_dartvm${{ matrix.dart_version }}_android_arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter_dartvm${{ matrix.dart_version }}_android_arm64
          path: |
            blutter_dartvm${{ matrix.dart_version }}_android_arm64
            blutter_dartvm${{ matrix.dart_version }}_android_arm64.json
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && contains(needs.build.result, 'success')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blutter-latest
          name: Blutter ARM64 Binaries
          body: |
            Pre-compiled blutter binaries for Android ARM64.
            Built with Android NDK — no external .so dependencies.
            Dart versions are discovered automatically; matching cloud-job builds remain on demand.
            Each asset includes its exact upstream commit and Dart version.
          files: artifacts/**/*
          make_latest: true

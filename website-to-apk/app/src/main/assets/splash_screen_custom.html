<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Splash</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #lottieContainer {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #lottieSplash {
      width: 80%;
      max-width: 400px;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="lottieContainer">
    <div id="lottieSplash"></div>
  </div>

  <script>
    function loadLottieFromAndroid() {
      try {
        if (window.Android && window.Android.hasCustomLottie && window.Android.hasCustomLottie()) {
          const jsonString = window.Android.getCustomLottieJson();
          if (jsonString) {
            const animationData = JSON.parse(jsonString);
            lottie.loadAnimation({
              container: document.getElementById('lottieSplash'),
              renderer: 'svg',
              loop: true,
              autoplay: true,
              animationData: animationData
            });
          }
        }
      } catch (err) {
        console.log('Lottie load error:', err);
      }
    }
  </script>
</body>
</html>
